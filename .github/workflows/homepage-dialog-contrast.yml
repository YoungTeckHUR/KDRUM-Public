name: Homepage dialog contrast audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dialog-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Check dialog and audit JavaScript syntax
        run: |
          node --check docs/assets/site.js
          node --check .github/scripts/homepage-v4-audit.cjs

      - name: Install Chromium test runtime
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Start local homepage server
        run: |
          python3 -m http.server 8000 --directory docs >/tmp/kdrum-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kdrum-http.log
          exit 1

      - name: Check dialogs, contrast, keyboard controls and reflow
        env:
          BASE_URL: http://127.0.0.1:8000
          AUDIT_DIR: dialog-contrast-artifacts
          AUDIT_LABEL: Homepage dialog contrast audit
        run: node .github/scripts/homepage-v4-audit.cjs

      - name: Upload dialog screenshots and metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homepage-dialog-contrast
          path: dialog-contrast-artifacts/
          if-no-files-found: error
