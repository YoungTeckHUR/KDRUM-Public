name: Retire superseded content-review checks
on:
  push:
    branches: [content/full-methodology-review-20261028]
    paths: [.github/workflows/cleanup-staged-runs-20261028.yml]
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    if: github.event.head_commit.message == 'Cancel only superseded review-branch checks before final verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel only explicitly superseded content-review runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run list --branch content/full-methodology-review-20261028 --limit 200 --json databaseId,headSha,status,event > /tmp/review-runs.json
          python3 - <<'PY'
          import json,subprocess
          superseded=set('''
          ba904fe0165e4365ff88e7aca834469b3e671b75
          c965ffb4a490e22c5d3ff14f8a8d55b0464727e2
          6441269831ed884c646a8b16a09d3ee7fbf61981
          de926dd134d57f0984c5387c82ab8adbc706c5b1
          b51e881904d10db9019712f0dc0e05093dd94595
          3442883989ebcb993f7dd956a7ead16ac6699208
          e739357c1d35e1018e2de8075ea47cd7307cff59
          18fe229a48edaa0979fd6a4f32623b212dd3b28a
          8a1269beed48aae8f66a3ca2d00e64bd131df680
          6504a88f9160823dc13b9ad286579958d79ef4c0
          2b1315c063df62f91990a2a174128d88355f0f80
          '''.split())
          with open('/tmp/review-runs.json') as f:runs=json.load(f)
          for r in runs:
              if r['headSha'] not in superseded or r['event'] not in ('push','pull_request') or r['status'] not in ('queued','in_progress','waiting','pending','requested'):
                  continue
              print('Retire superseded run',r['databaseId'],r['headSha'],flush=True)
              subprocess.run(['gh','run','cancel',str(r['databaseId'])],check=False,timeout=30)
          print('No main, unrelated branch, artifact or completed check was modified.')
          PY
