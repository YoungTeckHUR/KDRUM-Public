name: Homepage runtime audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homepage-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check runtime, content and public routes
        run: |
          node --check docs/assets/site.js
          node --check .github/scripts/build-site.cjs
          node .github/scripts/site-static-audit.cjs
      - name: Confirm generated pages are reproducible
        run: |
          node .github/scripts/build-site.cjs
          git diff --exit-code -- docs/index.html docs/ko/index.html docs/media.html docs/seo-kdrum.html
