name: Staged method-screen preflight
on:
  push:
    branches: [content/full-methodology-review-20261028]
    paths: [.github/workflows/content-workbench-20261028.yml]
permissions:
  contents: write
jobs:
  preflight:
    if: github.event.head_commit.message == 'Correct InputStudio first-row spacing and preflight all method screens'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/full-methodology-review-20261028
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Separate the first numbered row from its subtitle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('.github/scripts/feature-specific-figures.cjs')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='ae9fd78cc2a76f66e376984519c2852b8caa85f1ed1c47fe8d279dad182fff24'
          s=p.read_text()
          old="L('공간격자·유출경로 · 강우','Grid/flow paths · rainfall'),270]]"
          assert s.count(old)==1
          p.write_text(s.replace(old,old.replace('270]]','300]]')))
          PY
          node .github/scripts/build-site.cjs
          node .github/scripts/site-static-audit.cjs
      - name: Install rendered inspection runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve exact candidate locally for browser tests
        run: |
          node .github/scripts/pages-preview.cjs >/tmp/kdrum-preflight.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/KDRUM-Public/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kdrum-preflight.log
          exit 1
      - name: Verify all schematic text and expanded methods independently
        env:
          BASE_URL: http://127.0.0.1:8000/KDRUM-Public
          METHOD_AUDIT_DIR: preflight-artifacts/methodology
        run: |
          set +e
          node -e "(async()=>{const b=await require('playwright').chromium.launch({headless:true});try{await require('./.github/scripts/feature-schematic-audit.cjs').run(b,process.env.BASE_URL,'preflight-artifacts')}finally{await b.close()}})().catch(e=>{console.error(e);process.exitCode=1})"
          svg=$?
          node .github/scripts/methodology-browser-audit.cjs
          method=$?
          test "$svg" -eq 0 && test "$method" -eq 0
      - name: Preserve all review screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: method-screen-preflight
          path: preflight-artifacts/
          if-no-files-found: warn
      - name: Commit only verified schematic source and derivatives
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/scripts/feature-specific-figures.cjs docs/assets/diagrams/feature-specific/inputstudio-ko.svg docs/assets/diagrams/feature-specific/inputstudio-en.svg
          git diff --cached --quiet && exit 0
          git commit -m 'Separate InputStudio subtitle and first stage with rendered verification'
          git push origin HEAD:content/full-methodology-review-20261028
