name: Staged public-content workbench
on:
  push:
    branches: [content/full-methodology-review-20261028]
    paths: [.github/workflows/content-workbench-20261028.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.event.head_commit.message == 'Complete diagram status and expanded-method browser verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/full-methodology-review-20261028
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded source corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def read(name, expected):
              p=Path(name); raw=p.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==expected, name+' baseline changed'
              return p,raw.decode('utf-8')
          p,s=read('.github/scripts/sync-current-data.cjs','b0841cd35487cb89c7ef2e3911198bc6a71324d9dd1faa10ff8971fd3171685c')
          p.write_text(s+"\nrequire('./current-diagram-status.cjs');\n",encoding='utf-8')
          p,s=read('.github/scripts/build-feature-reference-svg.cjs','c302220b12d1cb74409d3885ac6fbb85d34030f1bcf1455ac08a22987772c801')
          a="text(915,447,L('개구부','Opening'),18,700,'middle')"
          assert s.count(a)==1
          p.write_text(s.replace(a,"text(940,447,L('개구부','Opening'),18,700,'middle')"),encoding='utf-8')
          p,s=read('.github/scripts/navigation-layout.cjs','49db1748885f80a4e5c417e55a42151501af7a7efb2c2a28ba17826899d30e0c')
          a="${pic?L('작동 방식·그림 해설·확인사항','How it works · figure guide · checks'):L('작동 방식·적용 범위·확인사항','How it works · scope · checks')}"
          assert s.count(a)==1
          p.write_text(s.replace(a,"${L('이론·계산방법·입출력 상세','Theory, methods and input/output details')}"),encoding='utf-8')
          p,s=read('.github/workflows/homepage-browser-smoke.yml','381e4b4f05fe97cd52aee02b6f007f70703e7855f5e7850bfcc2f4a64fb6157f')
          a='      - name: Compare laptop typography at six viewport widths'
          assert s.count(a)==1
          new='      - name: Verify reviewed methods, lifecycle status and overview SVG text\n        env:\n          BASE_URL: http://127.0.0.1:8000/KDRUM-Public\n          METHOD_AUDIT_DIR: browser-artifacts/methodology\n        run: node .github/scripts/methodology-browser-audit.cjs\n\n'
          p.write_text(s.replace(a,new+a),encoding='utf-8')
          p,s=read('.github/scripts/current-content-audit.cjs','5e781ce5062662dc429056878b3baa539e6e6285c879fed0853b216aa463bf81')
          s+="""
          for(const lang of ['ko','en']){
           for(const stem of ['model-workflow','river-floodplain']){
            const svg=fs.readFileSync(path.join(root,'docs/assets/diagrams',stem+'-'+lang+'.svg'),'utf8');
            assert.ok(!/IN DEVELOPMENT|in development|developing hydraulic|개발 중|개발·검증 단계/.test(svg),stem+' '+lang+' completed SVG labels');
            assert.ok(lang==='ko'?svg.includes('개발 완료'):/complete|COMPLETED/.test(svg),stem+' '+lang+' current label');
           }
           const p=fs.readFileSync(path.join(root,'docs/assets/diagrams/program-workflow-'+lang+'.svg'),'utf8');
           assert.ok(!/수리 확장 개발|통합 개발 중|INTEGRATION DEV\\./.test(p),'Core/output diagram status '+lang);
          }
          console.log('PASS editable overview SVG status matches the reviewed implementation');
          """
          p.write_text(s,encoding='utf-8')
          PY
      - name: Rebuild site, diagrams and documentation
        run: |
          node .github/scripts/build-site.cjs
          node .github/scripts/site-static-audit.cjs
          node .github/scripts/media-status-consistency.cjs
          node --check .github/scripts/methodology-browser-audit.cjs
      - name: Commit exact reviewed branch derivatives
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/scripts .github/workflows/homepage-browser-smoke.yml docs
          git diff --cached --quiet && exit 0
          git commit -m 'Synchronize SVG statuses, center structure label and strengthen method screen coverage'
          git push origin HEAD:content/full-methodology-review-20261028
