name: Homepage live Pages verification

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: read
  statuses: write

jobs:
  live-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for GitHub Pages build for this exact commit
        id: pages_build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          token=os.environ['GH_TOKEN']
          sha=os.environ['SHA']
          repo=os.environ['REPOSITORY']
          url=f'https://api.github.com/repos/{repo}/pages/builds?per_page=100'
          headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f'Bearer {token}',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'KDRUM-Pages-QA',
          }

          deadline=time.monotonic()+600.0
          attempt=0
          last=None
          while time.monotonic() < deadline:
              attempt+=1
              remaining=deadline-time.monotonic()
              timeout=max(1.0,min(20.0,remaining))
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      builds=json.load(r)
                  build=next((item for item in builds if item.get('commit')==sha),None)
                  if build:
                      last={'commit':build.get('commit'),'status':build.get('status'),'error':build.get('error')}
                      print(f'exact Pages build attempt {attempt}: {last}')
                      if build.get('status')=='built':
                          print('Exact GitHub Pages build is published.')
                          raise SystemExit(0)
                      if build.get('status')=='errored':
                          raise SystemExit(f'GitHub Pages build for current commit errored: {build.get("error")}')
                  else:
                      last={'commit':sha,'status':'not-listed-yet'}
                      print(f'exact Pages build attempt {attempt}: not listed yet')
              except SystemExit:
                  raise
              except Exception as e:
                  last={'request_error':str(e)}
                  print(f'Pages build attempt {attempt} request error: {e}')

              remaining=deadline-time.monotonic()
              if remaining<=0:
                  break
              time.sleep(min(10.0,remaining))

          raise SystemExit(f'Exact GitHub Pages build did not become ready within 10 minutes: {last}')
          PY

      - name: Verify deployed English and Korean visual system
        id: live_verify
        if: steps.pages_build.outcome == 'success'
        continue-on-error: true
        env:
          SHA: ${{ github.sha }}
        run: |
          mkdir -p live-artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const sha=process.env.SHA;
          const LIVE_WINDOW_MS=10*60*1000;
          const targets=[
            {name:'live-en-desktop',url:'https://youngteckhur.github.io/KDRUM-Public/',title:'Basin water-balance audit',korean:false,mobile:false,viewport:{width:1440,height:1000},hero:82},
            {name:'live-ko-desktop',url:'https://youngteckhur.github.io/KDRUM-Public/ko/',title:'유역 물수지 평가',korean:true,mobile:false,viewport:{width:1440,height:1000},hero:82},
            {name:'live-en-mobile',url:'https://youngteckhur.github.io/KDRUM-Public/',title:'Basin water-balance audit',korean:false,mobile:true,viewport:{width:390,height:844},hero:60},
            {name:'live-ko-mobile',url:'https://youngteckhur.github.io/KDRUM-Public/ko/',title:'유역 물수지 평가',korean:true,mobile:true,viewport:{width:390,height:844},hero:60},
          ];

          function timeoutWithin(deadline,maxMs){
            const remaining=deadline-Date.now();
            if(remaining<250)throw new Error('live verification deadline exceeded');
            return Math.min(maxMs,remaining);
          }

          async function waitForCapabilityDesign(page,deadline){
            await page.waitForFunction(()=>{
              const cards=document.querySelectorAll('.catlas-card').length;
              const symbols=document.querySelectorAll('.catlas-card .catlas-symbol').length;
              return cards>0 && cards===symbols;
            },null,{timeout:timeoutWithin(deadline,5000)});
          }

          async function findCard(page,id,deadline){
            const tabs=page.locator('.catlas-tab');
            for(let i=0;i<await tabs.count();i++){
              await tabs.nth(i).click();
              await waitForCapabilityDesign(page,deadline);
              const card=page.locator(`.catlas-card[data-id="${id}"]`);
              if(await card.count())return card;
            }
            return null;
          }

          async function inspectTarget(browser,target,attempt,deadline){
            const page=await browser.newPage({viewport:target.viewport});
            const errors=[];
            page.on('console',msg=>{if(msg.type()==='error')errors.push(`console: ${msg.text()}`)});
            page.on('pageerror',err=>errors.push(`pageerror: ${err.message}`));
            let result={ok:false,attempt,errors};
            try{
              const cacheBust=`qa=${encodeURIComponent(sha)}-${target.name}-${attempt}`;
              await page.goto(target.url+'?'+cacheBust,{waitUntil:'networkidle',timeout:timeoutWithin(deadline,25000)});
              await page.waitForFunction(()=>document.documentElement.dataset.kdrumBrandRuntime==='ready',null,{timeout:timeoutWithin(deadline,7000)});
              await page.waitForFunction(()=>document.documentElement.dataset.kdrumCapabilityAtlas==='ready',null,{timeout:timeoutWithin(deadline,7000)});
              await page.waitForFunction(()=>document.documentElement.dataset.kdrumPublicCopy==='ready',null,{timeout:timeoutWithin(deadline,7000)});
              await page.waitForFunction(()=>document.documentElement.dataset.kdrumDesignSystem==='ready',null,{timeout:timeoutWithin(deadline,7000)});
              await waitForCapabilityDesign(page,deadline);

              const metrics=await page.evaluate(()=>{
                const frame=document.querySelector('.brand-symbol-frame');
                const nav=document.querySelector('.site-mark');
                const hero=document.querySelector('.brand-symbol');
                const wrap=document.querySelector('#capabilities .wrap')?.getBoundingClientRect();
                if(!frame||!nav||!hero||!wrap)return null;
                const fr=frame.getBoundingClientRect();
                const rowCounts={};
                for(const card of document.querySelectorAll('#platform [data-program-role]')){
                  const y=Math.round(card.getBoundingClientRect().y);
                  rowCounts[y]=(rowCounts[y]||0)+1;
                }
                const tabs=[...document.querySelectorAll('.catlas-tab')].map(tab=>{
                  const r=tab.getBoundingClientRect();
                  return {x:r.x,right:r.right};
                });
                return {
                  frameWidth:fr.width,frameHeight:fr.height,
                  navSrc:nav.getAttribute('src'),heroSrc:hero.getAttribute('src'),
                  heroTransform:getComputedStyle(hero).transform,
                  tabs:document.querySelectorAll('.catlas-tab').length,
                  tabsWithin:tabs.every(r=>r.x>=wrap.x-1&&r.right<=wrap.right+1),
                  atlas:Boolean(document.querySelector('#capabilities')),
                  designReady:document.documentElement.dataset.kdrumDesignSystem,
                  oldFeaturesHidden:Boolean(document.querySelector('#features')?.hidden),
                  oldFunctionsHidden:Boolean(document.querySelector('#functions')?.hidden),
                  scrollWidth:document.documentElement.scrollWidth,
                  clientWidth:document.documentElement.clientWidth,
                  lead:(document.querySelector('.lead')?.textContent||'').trim(),
                  official:(document.querySelector('#references .official')?.textContent||'').trim(),
                  officialHeight:document.querySelector('#references .official')?.getBoundingClientRect().height||0,
                  mywaterDesign:document.querySelector('#references .official')?.classList.contains('mywater-callout-v2'),
                  platformViewer:Boolean(document.querySelector('#platform [data-kdrum-1d-viewer]')),
                  programRoles:document.querySelectorAll('#platform [data-program-role]').length,
                  platformRows:Object.values(rowCounts).sort((a,b)=>b-a),
                  genericBarsVisible:[...document.querySelectorAll('.catlas-mini')].some(e=>getComputedStyle(e).display!=='none'),
                  currentCards:document.querySelectorAll('.catlas-card').length,
                  currentSymbols:document.querySelectorAll('.catlas-card .catlas-symbol').length,
                  navPosition:getComputedStyle(document.querySelector('.topbar')).position,
                  bodyText:document.body.innerText,
                };
              });

              const basicOk=Boolean(metrics && metrics.atlas && metrics.designReady==='ready' && metrics.tabs===8 && metrics.tabsWithin && metrics.oldFeaturesHidden && metrics.oldFunctionsHidden && metrics.platformViewer && metrics.programRoles===7 && metrics.mywaterDesign && !metrics.genericBarsVisible && metrics.currentCards===metrics.currentSymbols && Math.abs(metrics.frameWidth-target.hero)<=1.1 && Math.abs(metrics.frameHeight-target.hero)<=1.1 && metrics.navSrc.includes('branding/kdrum-symbol-compact.png') && metrics.heroSrc.includes('branding/kdrum-symbol-compact.png') && metrics.heroTransform==='none' && metrics.scrollWidth<=metrics.clientWidth+1 && metrics.official.includes('MyWater'));
              if(!basicOk){result={ok:false,attempt,stage:'homepage-design-base',metrics,errors};await page.close();return result;}
              if(target.mobile&&(metrics.navPosition==='sticky'||metrics.officialHeight>560)){
                result={ok:false,attempt,stage:'mobile-layout',metrics,errors};await page.close();return result;
              }
              if(!target.mobile&&JSON.stringify(metrics.platformRows)!==JSON.stringify([4,3])){
                result={ok:false,attempt,stage:'desktop-program-layout',metrics,errors};await page.close();return result;
              }
              if(target.korean){
                if(!metrics.lead.includes('물리적 기반의 격자단위 분포형 강우유출모형')||metrics.bodyText.includes('격자형 분포형')||!metrics.official.includes('무료')){
                  result={ok:false,attempt,stage:'korean-terminology',metrics,errors};await page.close();return result;
                }
              }

              let total=0;
              const tabs=page.locator('.catlas-tab');
              for(let i=0;i<await tabs.count();i++){
                await tabs.nth(i).click();
                await waitForCapabilityDesign(page,deadline);
                total+=await page.locator('.catlas-card').count();
              }
              if(total!==46){result={ok:false,attempt,stage:'atlas-count',metrics,total,errors};await page.close();return result;}

              const wb=await findCard(page,'wb',deadline);
              if(!wb){result={ok:false,attempt,stage:'water-balance-card-missing',metrics,total,errors};await page.close();return result;}
              await wb.click({timeout:timeoutWithin(deadline,5000)});
              const dialog=page.locator('#catlas-dialog');
              await dialog.waitFor({state:'visible',timeout:timeoutWithin(deadline,5000)});
              const popup={
                title:(await dialog.locator('#catlas-title').innerText()).trim(),
                status:(await dialog.locator('.catlas-status').first().innerText()).trim(),
                lead:(await dialog.locator('.catlas-dlead').innerText()).trim(),
                svg:await dialog.locator('.catlas-graphic svg').count(),
                flow:await dialog.locator('.catlas-flow>div').count(),
                panels:await dialog.locator('.catlas-panel').count(),
              };
              const popupOk=popup.title===target.title && popup.status.length>0 && popup.lead.length>=20 && popup.svg===1 && popup.flow===3 && popup.panels>=2;
              await page.keyboard.press('Escape');

              const viewer=await findCard(page,'viewer1d',deadline);
              if(!viewer){result={ok:false,attempt,stage:'viewer-card-missing',metrics,total,popup,errors};await page.close();return result;}
              await viewer.click({timeout:timeoutWithin(deadline,5000)});
              await dialog.waitFor({state:'visible',timeout:timeoutWithin(deadline,5000)});
              const viewerPopup={
                title:(await dialog.locator('#catlas-title').innerText()).trim(),
                status:(await dialog.locator('.catlas-status').first().innerText()).trim(),
                lead:(await dialog.locator('.catlas-dlead').innerText()).trim(),
                svg:await dialog.locator('.catlas-graphic svg').count(),
                flow:await dialog.locator('.catlas-flow>div').count(),
                panels:await dialog.locator('.catlas-panel').count(),
              };
              const viewerOk=viewerPopup.title===(target.korean?'1차원 하천수리 결과 뷰어':'1D River Hydraulics Results Viewer') && viewerPopup.status.length>0 && viewerPopup.lead.length>=20 && viewerPopup.svg===1 && viewerPopup.flow===3 && viewerPopup.panels>=2;

              result={ok:popupOk&&viewerOk&&errors.length===0,attempt,stage:'homepage-live-design',metrics,total,popup,viewerPopup,errors};
              if(result.ok){
                await page.keyboard.press('Escape');
                await page.locator('#capabilities').screenshot({path:`live-artifacts/${target.name}-capabilities.png`});
                await page.locator('#platform').screenshot({path:`live-artifacts/${target.name}-platform.png`});
                await page.locator('#references .official').screenshot({path:`live-artifacts/${target.name}-mywater.png`});
                const viewer2=await findCard(page,'viewer1d',deadline);
                await viewer2.click();
                await dialog.screenshot({path:`live-artifacts/${target.name}-viewer1d.png`});
              }
            }catch(err){result={ok:false,attempt,stage:'exception',error:`${err.name}: ${err.message}`,errors};}
            await page.close();
            return result;
          }

          (async()=>{
            const browser=await chromium.launch();
            const failures=[];
            const report={};
            const deadline=Date.now()+LIVE_WINDOW_MS;
            for(const target of targets){
              let final=null;
              let attempt=0;
              while(Date.now()<deadline){
                attempt+=1;
                final=await inspectTarget(browser,target,attempt,deadline);
                console.log(`${target.name} attempt ${attempt}: ${JSON.stringify(final)}`);
                if(final.ok)break;
                const remaining=deadline-Date.now();
                if(remaining<=0)break;
                await sleep(Math.min(10000,remaining));
              }
              report[target.name]=final;
              if(!final?.ok)failures.push(`${target.name}: homepage visual system did not reach expected deployed state: ${JSON.stringify(final)}`);
            }
            fs.writeFileSync('live-artifacts/live-metrics.json',JSON.stringify(report,null,2));
            await browser.close();
            if(failures.length){console.error('LIVE GITHUB PAGES VISUAL VERIFICATION FAILED');failures.forEach(x=>console.error(' -',x));process.exit(1)}
            console.log('LIVE GITHUB PAGES VISUAL SYSTEM VERIFIED');
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE

      - name: Publish live verification commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_OUTCOME: ${{ steps.pages_build.outcome }}
          LIVE_OUTCOME: ${{ steps.live_verify.outcome }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(python3 - <<'PY'
          import json, os
          ok=os.environ['PAGES_OUTCOME']=='success' and os.environ['LIVE_OUTCOME']=='success'
          print(json.dumps({
            'state':'success' if ok else 'failure',
            'context':'homepage-live-pages',
            'description':'Exact Pages build + EN/KO desktop/mobile visual system verified' if ok else 'Pages build/live visual verification failed',
            'target_url':os.environ['RUN_URL'],
          }))
          PY
          )
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "$payload"

      - name: Upload live screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-live-pages
          path: live-artifacts/
          if-no-files-found: warn

      - name: Fail job when verification failed
        if: steps.pages_build.outcome != 'success' || steps.live_verify.outcome != 'success'
        run: exit 1
