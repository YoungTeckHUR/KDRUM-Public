name: Homepage live Pages verification

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  live-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check deployed-audit JavaScript syntax
        run: node --check .github/scripts/homepage-v4-audit.cjs

      - name: Install Chromium runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for deployed files from this commit
        id: deploy_ready
        continue-on-error: true
        env:
          SHA: ${{ github.sha }}
        run: |
          set +e
          BASE='https://youngteckhur.github.io/KDRUM-Public'
          files=(
            'index.html'
            'ko/index.html'
            'media.html'
            'assets/site.css'
            'assets/site.js'
          )
          for attempt in $(seq 1 40); do
            echo "deployment readiness attempt $attempt"
            all_match=1
            for file in "${files[@]}"; do
              expected=$(sha256sum "docs/$file" | awk '{print $1}')
              tmp=$(mktemp)
              if curl -fsS -H 'Cache-Control: no-cache' "$BASE/$file?deploy=$SHA-$attempt" -o "$tmp"; then
                actual=$(sha256sum "$tmp" | awk '{print $1}')
                if [ "$actual" = "$expected" ]; then
                  echo "  match: $file"
                else
                  echo "  pending: $file expected=$expected actual=$actual"
                  all_match=0
                fi
              else
                echo "  unavailable: $file"
                all_match=0
              fi
              rm -f "$tmp"
            done
            if [ "$all_match" -eq 1 ]; then
              echo 'All representative live files match this commit.'
              exit 0
            fi
            sleep 15
          done
          echo 'Representative live files did not match this commit within the 10-minute propagation window.'
          exit 1

      - name: Verify deployed homepage after CDN propagation
        id: live_verify
        if: steps.deploy_ready.outcome == 'success'
        continue-on-error: true
        env:
          SHA: ${{ github.sha }}
        run: |
          BASE='https://youngteckhur.github.io/KDRUM-Public'
          rm -rf live-artifacts
          mkdir -p live-artifacts
          BASE_URL="$BASE" AUDIT_DIR=live-artifacts AUDIT_LABEL='Live GitHub Pages homepage audit' \
            node .github/scripts/homepage-v4-audit.cjs
          BASE_URL="$BASE" READABILITY_AUDIT_DIR=live-artifacts/readability \
            node .github/scripts/homepage-readability-audit.cjs

      - name: Publish live verification commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy_ready.outcome }}
          LIVE_OUTCOME: ${{ steps.live_verify.outcome }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(python3 - <<'PY'
          import json, os
          ok=os.environ['DEPLOY_OUTCOME']=='success' and os.environ['LIVE_OUTCOME']=='success'
          print(json.dumps({
            'state':'success' if ok else 'failure',
            'context':'homepage-live-pages',
            'description':'Live files + EN/KO homepage verified' if ok else 'Live deployment/browser verification failed',
            'target_url':os.environ['RUN_URL'],
          }))
          PY
          )
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "$payload"

      - name: Upload live screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-live-pages
          path: live-artifacts/
          if-no-files-found: warn

      - name: Fail job when verification failed
        if: steps.deploy_ready.outcome != 'success' || steps.live_verify.outcome != 'success'
        run: exit 1
