name: Homepage live Pages verification

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: read
  statuses: write

jobs:
  live-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check deployed-audit JavaScript syntax
        run: node --check .github/scripts/homepage-v4-audit.cjs

      - name: Install Chromium runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for GitHub Pages build for this exact commit
        id: pages_build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          token=os.environ['GH_TOKEN']
          sha=os.environ['SHA']
          repo=os.environ['REPOSITORY']
          url=f'https://api.github.com/repos/{repo}/pages/builds?per_page=100'
          headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f'Bearer {token}',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'KDRUM-Pages-QA',
          }
          deadline=time.monotonic()+600.0
          last=None
          attempt=0
          while time.monotonic()<deadline:
              attempt+=1
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=20) as response:
                      builds=json.load(response)
                  build=next((item for item in builds if item.get('commit')==sha),None)
                  if build:
                      last={'commit':build.get('commit'),'status':build.get('status'),'error':build.get('error')}
                      print(f'exact Pages build attempt {attempt}: {last}')
                      if build.get('status')=='built':
                          raise SystemExit(0)
                      if build.get('status')=='errored':
                          raise SystemExit(f'Pages build failed: {build.get("error")}')
                  else:
                      last={'commit':sha,'status':'not-listed-yet'}
                      print(f'exact Pages build attempt {attempt}: not listed yet')
              except SystemExit:
                  raise
              except Exception as exc:
                  last={'request_error':str(exc)}
                  print(f'Pages build attempt {attempt} request error: {exc}')
              time.sleep(10)
          raise SystemExit(f'Exact Pages build did not become ready: {last}')
          PY

      - name: Verify deployed tabbed homepage after CDN propagation
        id: live_verify
        if: steps.pages_build.outcome == 'success'
        continue-on-error: true
        env:
          SHA: ${{ github.sha }}
        run: |
          set +e
          BASE='https://youngteckhur.github.io/KDRUM-Public'
          for attempt in $(seq 1 40); do
            echo "live verification attempt $attempt"
            rm -rf live-artifacts
            mkdir -p live-artifacts
            marker_url="$BASE/assets/design-system-v2.js?deploy=$SHA-$attempt"
            if curl -fsS -H 'Cache-Control: no-cache' "$marker_url" | grep -q 'experience-v4-stable.js'; then
              BASE_URL="$BASE" AUDIT_DIR=live-artifacts AUDIT_LABEL='Live GitHub Pages tabbed v4 audit' \
                node .github/scripts/homepage-v4-audit.cjs
              rc=$?
              if [ "$rc" -eq 0 ]; then
                exit 0
              fi
              echo "Rendered audit has not converged yet (exit $rc)."
            else
              echo "Stable v4 asset has not propagated to the CDN yet."
            fi
            sleep 15
          done
          echo 'Live GitHub Pages did not pass within the 10-minute propagation window.'
          exit 1

      - name: Publish live verification commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_OUTCOME: ${{ steps.pages_build.outcome }}
          LIVE_OUTCOME: ${{ steps.live_verify.outcome }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(python3 - <<'PY'
          import json, os
          ok=os.environ['PAGES_OUTCOME']=='success' and os.environ['LIVE_OUTCOME']=='success'
          print(json.dumps({
            'state':'success' if ok else 'failure',
            'context':'homepage-live-pages',
            'description':'Exact Pages build + tabbed EN/KO homepage verified' if ok else 'Pages build/live homepage verification failed',
            'target_url':os.environ['RUN_URL'],
          }))
          PY
          )
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "$payload"

      - name: Upload live screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-live-pages
          path: live-artifacts/
          if-no-files-found: warn

      - name: Fail job when verification failed
        if: steps.pages_build.outcome != 'success' || steps.live_verify.outcome != 'success'
        run: exit 1
