name: Homepage live Pages verification

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: read
  statuses: write

jobs:
  live-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for GitHub Pages build for this exact commit
        id: pages_build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          token=os.environ['GH_TOKEN']
          sha=os.environ['SHA']
          repo=os.environ['REPOSITORY']
          url=f'https://api.github.com/repos/{repo}/pages/builds?per_page=100'
          headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f'Bearer {token}',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'KDRUM-Pages-QA',
          }

          deadline=time.monotonic()+600.0
          attempt=0
          last=None
          while time.monotonic() < deadline:
              attempt+=1
              remaining=deadline-time.monotonic()
              timeout=max(1.0,min(20.0,remaining))
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      builds=json.load(r)
                  build=next((item for item in builds if item.get('commit')==sha),None)
                  if build:
                      last={'commit':build.get('commit'),'status':build.get('status'),'error':build.get('error')}
                      print(f'exact Pages build attempt {attempt}: {last}')
                      if build.get('status')=='built':
                          print('Exact GitHub Pages build is published.')
                          raise SystemExit(0)
                      if build.get('status')=='errored':
                          raise SystemExit(f'GitHub Pages build for current commit errored: {build.get("error")}')
                  else:
                      last={'commit':sha,'status':'not-listed-yet'}
                      print(f'exact Pages build attempt {attempt}: not listed yet')
              except SystemExit:
                  raise
              except Exception as e:
                  last={'request_error':str(e)}
                  print(f'Pages build attempt {attempt} request error: {e}')

              remaining=deadline-time.monotonic()
              if remaining<=0:
                  break
              time.sleep(min(10.0,remaining))

          raise SystemExit(f'Exact GitHub Pages build did not become ready within 10 minutes: {last}')
          PY

      - name: Verify deployed English and Korean capability atlas
        id: live_verify
        if: steps.pages_build.outcome == 'success'
        continue-on-error: true
        env:
          SHA: ${{ github.sha }}
        run: |
          mkdir -p live-artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const sha=process.env.SHA;
          const LIVE_WINDOW_MS=10*60*1000;
          const targets=[
            {name:'live-en',url:'https://youngteckhur.github.io/KDRUM-Public/',title:'Basin water-balance audit',korean:false},
            {name:'live-ko',url:'https://youngteckhur.github.io/KDRUM-Public/ko/',title:'유역 물수지 평가',korean:true},
          ];

          function timeoutWithin(deadline,maxMs){
            const remaining=deadline-Date.now();
            if(remaining<250)throw new Error('live verification deadline exceeded');
            return Math.min(maxMs,remaining);
          }

          async function findCard(page,id){
            const tabs=page.locator('.catlas-tab');
            for(let i=0;i<await tabs.count();i++){
              await tabs.nth(i).click();
              const card=page.locator(`.catlas-card[data-id="${id}"]`);
              if(await card.count())return card;
            }
            return null;
          }

          async function inspectTarget(browser,target,attempt,deadline){
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const errors=[];
            page.on('console',msg=>{if(msg.type()==='error')errors.push(`console: ${msg.text()}`)});
            page.on('pageerror',err=>errors.push(`pageerror: ${err.message}`));
            let result={ok:false,attempt,errors};
            try{
              const cacheBust=`qa=${encodeURIComponent(sha)}-${attempt}`;
              await page.goto(target.url+'?'+cacheBust,{waitUntil:'networkidle',timeout:timeoutWithin(deadline,20000)});
              await page.waitForFunction(()=>document.documentElement.dataset.kdrumBrandRuntime==='ready',null,{timeout:timeoutWithin(deadline,6000)});
              await page.waitForFunction(()=>document.documentElement.dataset.kdrumCapabilityAtlas==='ready',null,{timeout:timeoutWithin(deadline,6000)});

              const metrics=await page.evaluate(()=>{
                const frame=document.querySelector('.brand-symbol-frame');
                const nav=document.querySelector('.site-mark');
                const hero=document.querySelector('.brand-symbol');
                if(!frame||!nav||!hero)return null;
                const fr=frame.getBoundingClientRect();
                return {
                  frameWidth:fr.width,frameHeight:fr.height,
                  navSrc:nav.getAttribute('src'),heroSrc:hero.getAttribute('src'),
                  heroTransform:getComputedStyle(hero).transform,
                  tabs:document.querySelectorAll('.catlas-tab').length,
                  atlas:Boolean(document.querySelector('#capabilities')),
                  oldFeaturesHidden:Boolean(document.querySelector('#features')?.hidden),
                  oldFunctionsHidden:Boolean(document.querySelector('#functions')?.hidden),
                  scrollWidth:document.documentElement.scrollWidth,
                  clientWidth:document.documentElement.clientWidth,
                };
              });
              const basicOk=Boolean(metrics && metrics.atlas && metrics.tabs===8 && metrics.oldFeaturesHidden && metrics.oldFunctionsHidden && Math.abs(metrics.frameWidth-82)<=1.1 && Math.abs(metrics.frameHeight-82)<=1.1 && metrics.navSrc.includes('branding/kdrum-symbol-compact.png') && metrics.heroSrc.includes('branding/kdrum-symbol-compact.png') && metrics.heroTransform==='none' && metrics.scrollWidth<=metrics.clientWidth+1);
              if(!basicOk){result={ok:false,attempt,stage:'atlas-base',metrics,errors};await page.close();return result;}

              let total=0;
              const tabs=page.locator('.catlas-tab');
              for(let i=0;i<await tabs.count();i++){
                await tabs.nth(i).click();
                total+=await page.locator('.catlas-card').count();
              }
              if(total!==40){result={ok:false,attempt,stage:'atlas-count',metrics,total,errors};await page.close();return result;}

              const card=await findCard(page,'wb');
              if(!card){result={ok:false,attempt,stage:'water-balance-card-missing',metrics,total,errors};await page.close();return result;}
              await card.click({timeout:timeoutWithin(deadline,5000)});
              const dialog=page.locator('#catlas-dialog');
              await dialog.waitFor({state:'visible',timeout:timeoutWithin(deadline,5000)});
              const popup={
                title:(await dialog.locator('#catlas-title').innerText()).trim(),
                status:(await dialog.locator('.catlas-status').first().innerText()).trim(),
                lead:(await dialog.locator('.catlas-dlead').innerText()).trim(),
                svg:await dialog.locator('.catlas-graphic svg').count(),
                flow:await dialog.locator('.catlas-flow>div').count(),
                panels:await dialog.locator('.catlas-panel').count(),
              };
              const popupOk=popup.title===target.title && popup.status.length>0 && popup.lead.length>=20 && popup.svg===1 && popup.flow===3 && popup.panels>=2;
              result={ok:popupOk&&errors.length===0,attempt,stage:'capability-popup',metrics,total,popup,errors};
              if(result.ok){
                await page.locator('#capabilities').screenshot({path:`live-artifacts/${target.name}-atlas.png`});
                await dialog.screenshot({path:`live-artifacts/${target.name}-water-balance.png`});
              }
            }catch(err){result={ok:false,attempt,stage:'exception',error:`${err.name}: ${err.message}`,errors};}
            await page.close();
            return result;
          }

          (async()=>{
            const browser=await chromium.launch();
            const failures=[];
            const report={};
            const deadline=Date.now()+LIVE_WINDOW_MS;
            for(const target of targets){
              let final=null;
              let attempt=0;
              while(Date.now()<deadline){
                attempt+=1;
                final=await inspectTarget(browser,target,attempt,deadline);
                console.log(`${target.name} attempt ${attempt}: ${JSON.stringify(final)}`);
                if(final.ok)break;
                const remaining=deadline-Date.now();
                if(remaining<=0)break;
                await sleep(Math.min(10000,remaining));
              }
              report[target.name]=final;
              if(!final?.ok)failures.push(`${target.name}: capability atlas did not reach expected deployed state: ${JSON.stringify(final)}`);
            }
            fs.writeFileSync('live-artifacts/live-metrics.json',JSON.stringify(report,null,2));
            await browser.close();
            if(failures.length){console.error('LIVE GITHUB PAGES VERIFICATION FAILED');failures.forEach(x=>console.error(' -',x));process.exit(1)}
            console.log('LIVE GITHUB PAGES CAPABILITY ATLAS VERIFIED');
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE

      - name: Publish live verification commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_OUTCOME: ${{ steps.pages_build.outcome }}
          LIVE_OUTCOME: ${{ steps.live_verify.outcome }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(python3 - <<'PY'
          import json, os
          ok=os.environ['PAGES_OUTCOME']=='success' and os.environ['LIVE_OUTCOME']=='success'
          print(json.dumps({
            'state':'success' if ok else 'failure',
            'context':'homepage-live-pages',
            'description':'Exact Pages build + EN/KO capability atlas verified' if ok else 'Pages build/live capability verification failed',
            'target_url':os.environ['RUN_URL'],
          }))
          PY
          )
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "$payload"

      - name: Upload live screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-live-pages
          path: live-artifacts/
          if-no-files-found: warn

      - name: Fail job when verification failed
        if: steps.pages_build.outcome != 'success' || steps.live_verify.outcome != 'success'
        run: exit 1