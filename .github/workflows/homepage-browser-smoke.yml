name: Homepage browser smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check browser runtime JavaScript
        run: |
          node --check docs/assets/branding/brand-runtime.js
          node --check docs/assets/capability-atlas.js
          node --check docs/assets/experience-v4.js
          node --check .github/scripts/homepage-v4-audit.cjs

      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local homepage server
        run: |
          python3 -m http.server 8000 --directory docs >/tmp/kdrum-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kdrum-http.log
          exit 1

      - name: Run rendered browser checks
        env:
          BASE_URL: http://127.0.0.1:8000
          AUDIT_DIR: browser-artifacts
          AUDIT_LABEL: Homepage browser smoke
          AUDIT_SCREENSHOTS: '0'
        run: node .github/scripts/homepage-v4-audit.cjs

      - name: Upload browser metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-browser-smoke
          path: browser-artifacts/
          if-no-files-found: error
