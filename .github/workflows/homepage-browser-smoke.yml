name: Homepage browser smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Check browser runtime JavaScript
        run: |
          node --check docs/assets/site.js
          node --check .github/scripts/homepage-v4-audit.cjs
          node --check .github/scripts/media-p18-audit.cjs
          node --check .github/scripts/layout-density-audit.cjs
          node --check .github/scripts/pages-preview.cjs
          node .github/scripts/capability-contract.cjs

      - name: Install Chromium test runtime
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          npx playwright install --with-deps chrome

      - name: Start local homepage server
        run: |
          node .github/scripts/pages-preview.cjs >/tmp/kdrum-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/KDRUM-Public/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kdrum-http.log
          exit 1

      - name: Verify CSP and optional analytics failure handling
        env:
          BASE_URL: http://127.0.0.1:8000/KDRUM-Public
        run: node .github/scripts/security-audit.cjs --browser

      - name: Verify compact layout, content preservation and image links
        env:
          BASE_URL: http://127.0.0.1:8000/KDRUM-Public
          READABILITY_AUDIT_DIR: browser-artifacts/readability
        run: node .github/scripts/homepage-readability-audit.cjs

      - name: Run rendered browser checks
        env:
          BASE_URL: http://127.0.0.1:8000/KDRUM-Public
          AUDIT_DIR: browser-artifacts
          AUDIT_LABEL: Homepage browser smoke
          AUDIT_SCREENSHOTS: '0'
        run: node .github/scripts/homepage-v4-audit.cjs

      - name: Verify p18 media, playback and bilingual navigation
        env:
          BASE_URL: http://127.0.0.1:8000/KDRUM-Public
          AUDIT_DIR: browser-artifacts/p18
        run: node .github/scripts/media-p18-audit.cjs

      - name: Open every bilingual capability and capture its complete detail
        env:
          BASE_URL: http://127.0.0.1:8000/KDRUM-Public
          CAPABILITY_AUDIT_DIR: browser-artifacts/capability-details
        run: node .github/scripts/capability-detail-audit.cjs

      - name: Compare laptop typography at six viewport widths
        env:
          BASE_URL: http://127.0.0.1:8000/KDRUM-Public
          LAYOUT_AUDIT_DIR: browser-artifacts/layout-density
        run: node .github/scripts/layout-density-audit.cjs

      - name: Upload browser metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homepage-browser-smoke
          path: browser-artifacts/
          if-no-files-found: error
