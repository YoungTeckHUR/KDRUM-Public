name: Prepare approved K-DRUM opening media on review branch
on:
  push:
    branches:
      - feature/homepage-content-20261027
permissions:
  contents: write
jobs:
  materialize:
    if: github.event.head_commit.message == 'Prepare approved K-DRUM opening media and regenerate bilingual site'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/homepage-content-20261027
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate versioned opening MP4 and poster from reviewed public original
        run: bash .github/scripts/prepare-opening-media.sh
      - name: Regenerate bilingual website and run static contract
        run: |
          node .github/scripts/build-site.cjs
          node .github/scripts/site-static-audit.cjs
      - name: Commit only the dated media and generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/2026-10-27-opening docs/index.html docs/ko/index.html docs/media.html docs/seo-kdrum.html
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Materialize versioned opening media and bilingual website pages"
          git push origin HEAD:feature/homepage-content-20261027
