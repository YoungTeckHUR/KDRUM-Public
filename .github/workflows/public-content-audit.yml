          }

          patterns = [
              ('Windows absolute path', re.compile(r'\b[A-Za-z]:\\')),
              ('private development branch', re.compile(r'\b(?:codex|autotest)/[A-Za-z0-9._/-]+', re.I)),
              ('40-character Git SHA', re.compile(r'\b[0-9a-fA-F]{40}\b')),
              ('explicit internal failure code', re.compile(r'\b(?:exit|failure|error)\s+code\s*[:=]?\s*\d{3,}\b', re.I)),
          ]

          findings = []
          checked = 0

          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              if any(part in {'.git', '.github'} for part in path.parts):
                  continue

              checked += 1
              rel = path.as_posix()

              if rel in approved_p18_assets:
                  if hashlib.sha256(path.read_bytes()).hexdigest() != approved_p18_assets[rel]:
                      findings.append(f'{path}: p18 public asset checksum mismatch')
                  continue

              if rel in approved_binary_assets:
                  rule = approved_binary_assets[rel]
                  size = path.stat().st_size
                  if size > rule['max_bytes']:
                      findings.append(f'{path}: approved image exceeds size limit')
                      continue
                  with path.open('rb') as fh:
                      magic = fh.read(len(rule['magic']))
                  if magic != rule['magic']:
                      findings.append(f'{path}: approved image has invalid file signature')
                  if 'sha256' in rule and hashlib.sha256(path.read_bytes()).hexdigest() != rule['sha256']:
                      findings.append(f'{path}: reviewed reference image checksum mismatch')
                  continue

              if path.suffix.lower() in blocked_suffixes:
                  findings.append(f'{path}: blocked file type {path.suffix}')
                  continue

              if path.stat().st_size > 1_000_000:
                  findings.append(f'{path}: file exceeds 1 MB public-information limit')
                  continue

              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  findings.append(f'{path}: non-UTF-8/binary content is not allowed')
                  continue

              for label, regex in patterns:
                  if regex.search(text):
                      findings.append(f'{path}: possible {label}')

          for rel, rule in approved_binary_assets.items():
              if 'sha256' in rule and not Path(rel).is_file():
                  findings.append(f'{rel}: missing reviewed reference image')

          for rel in approved_p18_assets:
              if not Path(rel).is_file():
                  findings.append(f'{rel}: missing p18 public asset')

          if findings:
              print('PUBLIC CONTENT SAFETY AUDIT FAILED')
              for item in findings:
                  print(' -', item)
              sys.exit(1)

          print(f'PUBLIC CONTENT SAFETY AUDIT PASSED: {checked} public files checked.')
          PY

      - name: Set up source verification runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install pinned PDF and image verification libraries
        run: python -m pip install PyMuPDF==1.26.7 Pillow==11.3.0

      - name: Verify all 18 features against their actual source PDF pages
        env:
          AUDIT_DIR: .github/artifacts/p18-source
        run: node .github/scripts/p18-source-audit.cjs

      - name: Upload source mapping and visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p18-source-mapping
          path: .github/artifacts/p18-source/
          include-hidden-files: true
          if-no-files-found: error
