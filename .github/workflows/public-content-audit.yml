name: Public content safety audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Reject non-public file types and sensitive patterns
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import hashlib
          import sys

          root = Path('.')
          blocked_suffixes = {
              '.f', '.for', '.f90', '.f95', '.f03', '.f08',
              '.py', '.c', '.cc', '.cpp', '.h', '.hpp',
              '.exe', '.dll', '.lib', '.obj', '.pdb',
              '.zip', '.7z', '.rar',
              '.nc', '.sqlite', '.db', '.inp', '.dat', '.log', '.out',
              '.csv', '.asc'
          }

          approved_binary_assets = {
              'docs/assets/kdrum-hero-overview.jpg': {
                  'max_bytes': 500_000,
                  'magic': b'\xff\xd8\xff',
              },
              'docs/assets/kdrum-symbol.png': {
                  'max_bytes': 100_000,
                  'magic': b'\x89PNG\r\n\x1a\n',
              },
              'docs/assets/kwater-ci.png': {
                  'max_bytes': 100_000,
                  'magic': b'\x89PNG\r\n\x1a\n',
              },
              'docs/assets/branding/kdrum-symbol-approved.png': {
                  'max_bytes': 100_000,
                  'magic': b'\x89PNG\r\n\x1a\n',
              },
              'docs/assets/branding/kdrum-symbol-web.png': {
                  'max_bytes': 100_000,
                  'magic': b'\x89PNG\r\n\x1a\n',
              },
              'docs/assets/branding/kdrum-symbol-compact.png': {
                  'max_bytes': 100_000,
                  'magic': b'\x89PNG\r\n\x1a\n',
              },
              'docs/assets/branding/kwater-official-ci.png': {
                  'max_bytes': 100_000,
                  'magic': b'\x89PNG\r\n\x1a\n',
              },
              'docs/assets/visuals/kdrum-watershed-hero-approved.jpg': {
                  'max_bytes': 500_000,
                  'magic': b'\xff\xd8\xff',
              },
              'docs/assets/visuals/kdrum-watershed-hero-HQ.jpg': {
                  'max_bytes': 500_000,
                  'magic': b'\xff\xd8\xff',
              },
              'docs/assets/visuals/explainers/01-grid-distributed.jpg': {
                  'max_bytes': 200_000,
                  'magic': b'\xff\xd8\xff',
              },
              'docs/assets/visuals/explainers/02-rainfall-runoff.jpg': {
                  'max_bytes': 200_000,
                  'magic': b'\xff\xd8\xff',
              },
              'docs/assets/visuals/explainers/03-river-1d.jpg': {
                  'max_bytes': 200_000,
                  'magic': b'\xff\xd8\xff',
              },
              'docs/assets/diagrams/grid-hydrology/grid-cell-water-cycle-ko.webp': {
                  'max_bytes': 100_000,
                  'magic': b'RIFF',
              },
              'docs/assets/diagrams/grid-hydrology/green-ampt-infiltration-ko.webp': {
                  'max_bytes': 100_000,
                  'magic': b'RIFF',
              },
              'docs/assets/diagrams/grid-hydrology/evapotranspiration-soil-water-ko.webp': {
                  'max_bytes': 100_000,
                  'magic': b'RIFF',
              },
              'docs/assets/diagrams/grid-hydrology/surface-subsurface-runoff-ko.webp': {
                  'max_bytes': 100_000,
                  'magic': b'RIFF',
              },
              'docs/assets/diagrams/grid-hydrology/dlayer-delayed-baseflow-ko.webp': {
                  'max_bytes': 100_000,
                  'magic': b'RIFF',
              },
          }


          # Original PDF/MP4/PNG remain byte-identical to the public package.
          # Corrected feature JPEGs are rendered from physical PDF pages 4..21;
          # the independent source audit below verifies content as well as hashes.
          approved_p18_assets = {
              'docs/assets/presentation/2026-09-12-p18/01_model_overview.jpg': '7fedd24c22178c53d82459b9b3dce129d5d08e344033da8c664ea364b44aef1f',
              'docs/assets/presentation/2026-09-12-p18/02_water_cycle.jpg': 'c685b20b1607cd3433c8b9b00cce65a00d141fbcd100805159c947e47146fa4a',
              'docs/assets/presentation/2026-09-12-p18/03_spatial_heterogeneity.jpg': 'a683524c0b50234dac0c8867f2e7fc30369fbb98a998c3bce71a409668359985',
              'docs/assets/presentation/2026-09-12-p18/04_end_to_end_workflow.jpg': '2b306845ea06c32b18acdcb53eb9aa6bc49c6af2fefaf6420b30056e86a4d698',
              'docs/assets/presentation/2026-09-12-p18/05_rainfall_input.jpg': '760e63cb238b625669d0ddeb427f154451b5dd3a74e607179029fbf7e7aa7eea',
              'docs/assets/presentation/2026-09-12-p18/06_snow_processes.jpg': 'a949c7f281d3e2e1d3610e8cd121a23b3b1427a43e7cfc9e5a05a9d1f5bd7c52',
              'docs/assets/presentation/2026-09-12-p18/07_continuous_hydrology.jpg': '056f0782975de25116131375155cca839dea5aebf75420691fa29baa769b6d49',
              'docs/assets/presentation/2026-09-12-p18/08_initial_state_adjustment.jpg': '1c2550513b1951206cba0b951790c8077c250ab270d60998694e3be60a7edb4a',
              'docs/assets/presentation/2026-09-12-p18/09_hot_start.jpg': '6b9e473bb6bb0ec1f20c27469b48de83cf77ecc59b8ade3c27ad6aba19770908',
              'docs/assets/presentation/2026-09-12-p18/10_runoff_routing.jpg': '0eaef13c8c5cba5e5eb98d93c76a73b27db5d0d27e04290b06992fc51f8a0ae6',
              'docs/assets/presentation/2026-09-12-p18/11_subbasin_calibration.jpg': 'd686749192e76623705d78ed2319991788f005c369359e1c72bf2da26c69879e',
              'docs/assets/presentation/2026-09-12-p18/12_solver_hierarchy.jpg': '5156646c9873f7dcf9e9c7c626642a2b16ab7954ec5e6246c04e19855b3a1eba',
              'docs/assets/presentation/2026-09-12-p18/13_river_structures_operations.jpg': 'c337cbd23bac09bab7dc6f838a10ec75c26a5545543568cc9cdd9cc49988e253',
              'docs/assets/presentation/2026-09-12-p18/14_flood_1d_2d.jpg': '2b55ae23e454e67a57c7345c7935e0dff4d58935c1e4198fa49596f4744aee40',
              'docs/assets/presentation/2026-09-12-p18/15_sediment_tracer_particles.jpg': '70f7afb84731bd747a9826240ec7721a07691f68c078c061d330d33d0c202a5d',
              'docs/assets/presentation/2026-09-12-p18/16_parallel_computing.jpg': '4ad555a29ace7b4d66d05c5c312ea4229f603b1a67afa568973973ec5feea6bc',
              'docs/assets/presentation/2026-09-12-p18/17_outputs_verification.jpg': '05ac43cec47c893b1ade2d8489afbcbe40671c391ba69461456ae537bc11e45c',
              'docs/assets/presentation/2026-09-12-p18/18_core_value_integration.jpg': '0f7e8153868aa429b2de79bb3194d4a480270c3377680fb8ea92c1c48f8500e8',
              'docs/media/2026-09-12-p18/07_Digital_Reference.png': 'e8d8ad3e5539706e9d7b51af915f2ae73e9e8f52822d896f5585fbea982579af',
              'docs/media/2026-09-12-p18/K-DRUM_v3.x_p18.pdf': '28fb9f4ca0c9a2b96330422dce575a7d8663964f6800b1ce899a1dbef5f8de75',
              'docs/media/2026-09-12-p18/KDRUM_Nature_to_Digital_22s_web.mp4': '14b8173bdd1126049ad624ce4c335de72590f691dc46aab170d22bffe68dd54f',
          }

          patterns = [
              ('Windows absolute path', re.compile(r'\b[A-Za-z]:\\')),
              ('private development branch', re.compile(r'\b(?:codex|autotest)/[A-Za-z0-9._/-]+', re.I)),
              ('40-character Git SHA', re.compile(r'\b[0-9a-fA-F]{40}\b')),
              ('explicit internal failure code', re.compile(r'\b(?:exit|failure|error)\s+code\s*[:=]?\s*\d{3,}\b', re.I)),
          ]

          findings = []
          checked = 0

          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              if any(part in {'.git', '.github'} for part in path.parts):
                  continue

              checked += 1
              rel = path.as_posix()

              if rel in approved_p18_assets:
                  if hashlib.sha256(path.read_bytes()).hexdigest() != approved_p18_assets[rel]:
                      findings.append(f'{path}: p18 public asset checksum mismatch')
                  continue

              if rel in approved_binary_assets:
                  rule = approved_binary_assets[rel]
                  size = path.stat().st_size
                  if size > rule['max_bytes']:
                      findings.append(f'{path}: approved image exceeds size limit')
                      continue
                  with path.open('rb') as fh:
                      magic = fh.read(len(rule['magic']))
                  if magic != rule['magic']:
                      findings.append(f'{path}: approved image has invalid file signature')
                  continue

              if path.suffix.lower() in blocked_suffixes:
                  findings.append(f'{path}: blocked file type {path.suffix}')
                  continue

              if path.stat().st_size > 1_000_000:
                  findings.append(f'{path}: file exceeds 1 MB public-information limit')
                  continue

              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  findings.append(f'{path}: non-UTF-8/binary content is not allowed')
                  continue

              for label, regex in patterns:
                  if regex.search(text):
                      findings.append(f'{path}: possible {label}')

          for rel in approved_p18_assets:
              if not Path(rel).is_file():
                  findings.append(f'{rel}: missing p18 public asset')

          if findings:
              print('PUBLIC CONTENT SAFETY AUDIT FAILED')
              for item in findings:
                  print(' -', item)
              sys.exit(1)

          print(f'PUBLIC CONTENT SAFETY AUDIT PASSED: {checked} public files checked.')
          PY

      - name: Set up source verification runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned PDF and image verification libraries
        run: python -m pip install PyMuPDF==1.26.7 Pillow==11.3.0

      - name: Verify all 18 features against their actual source PDF pages
        env:
          AUDIT_DIR: .github/artifacts/p18-source
        run: node .github/scripts/p18-source-audit.cjs

      - name: Upload source mapping and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p18-source-mapping
          path: .github/artifacts/p18-source/
          include-hidden-files: true
          if-no-files-found: error
