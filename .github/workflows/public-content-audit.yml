              'docs/assets/presentation/2026-09-12-p18/04_end_to_end_workflow.jpg': '2b306845ea06c32b18acdcb53eb9aa6bc49c6af2fefaf6420b30056e86a4d698',
              'docs/assets/presentation/2026-09-12-p18/05_rainfall_input.jpg': '760e63cb238b625669d0ddeb427f154451b5dd3a74e607179029fbf7e7aa7eea',
              'docs/assets/presentation/2026-09-12-p18/06_snow_processes.jpg': 'a949c7f281d3e2e1d3610e8cd121a23b3b1427a43e7cfc9e5a05a9d1f5bd7c52',
              'docs/assets/presentation/2026-09-12-p18/07_continuous_hydrology.jpg': '056f0782975de25116131375155cca839dea5aebf75420691fa29baa769b6d49',
              'docs/assets/presentation/2026-09-12-p18/08_initial_state_adjustment.jpg': '1c2550513b1951206cba0b951790c8077c250ab270d60998694e3be60a7edb4a',
              'docs/assets/presentation/2026-09-12-p18/09_hot_start.jpg': '6b9e473bb6bb0ec1f20c27469b48de83cf77ecc59b8ade3c27ad6aba19770908',
              'docs/assets/presentation/2026-09-12-p18/10_runoff_routing.jpg': '0eaef13c8c5cba5e5eb98d93c76a73b27db5d0d27e04290b06992fc51f8a0ae6',
