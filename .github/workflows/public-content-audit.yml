              },
              'docs/assets/diagrams/grid-hydrology/grid-cell-water-cycle-ko.webp': {
                  'max_bytes': 100_000,
                  'magic': b'RIFF',
              },
              'docs/assets/diagrams/grid-hydrology/green-ampt-infiltration-ko.webp': {
