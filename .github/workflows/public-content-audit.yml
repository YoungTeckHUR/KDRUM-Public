          # Original PDF/MP4/PNG remain byte-identical to the public package.
          # Corrected feature JPEGs are rendered from physical PDF pages 4..21;
          # the independent source audit below verifies content as well as hashes.
          approved_p18_assets = {
              'docs/assets/presentation/2026-09-12-p18/01_model_overview.jpg': '7fedd24c22178c53d82459b9b3dce129d5d08e344033da8c664ea364b44aef1f',
