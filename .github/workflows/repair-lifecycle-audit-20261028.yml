name: Align reviewed lifecycle audit
on:
  push:
    branches: [content/full-methodology-review-20261028]
    paths: [.github/workflows/repair-lifecycle-audit-20261028.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Align full feature audit with the three-axis lifecycle structure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/full-methodology-review-20261028
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replace obsolete one-paragraph status check with all three lifecycle assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/workspace-audit.cjs')
          s=p.read_text()
          old="assert.equal(await card.locator('.detail-status p').innerText(),item['now'+suffix]);"
          assert s.count(old)==1, 'Old status audit anchor changed'
          new="""const current=require('./current-content.cjs'),reviewed=current.review.items[item.id],status=card.locator('.detail-status.lifecycle-status');
           assert.equal(await status.getAttribute('data-review-date'),current.review.revision,item.id+' review date');
           assert.deepEqual(await status.locator('dt').allTextContents(),lang==='ko'?['현재 구현','적용 시 확인','공식 배포']:['Current implementation','Application check','Official distribution'],item.id+' lifecycle axes');
           assert.equal(await status.locator('dd').nth(0).innerText(),current.label(reviewed.status,lang),item.id+' implementation label');
           assert.equal(await status.locator('dd').nth(1).innerText(),reviewed[lang].check,item.id+' application conditions');
           assert.ok((await status.locator('dd').nth(2).innerText()).includes('MyWater'),item.id+' official distribution');
           assert.equal(await status.locator('dd').nth(2).locator('a').getAttribute('href'),'#download',item.id+' distribution link');
           """
          p.write_text(s.replace(old,new))
          PY
          node --check .github/scripts/workspace-audit.cjs
          node .github/scripts/site-static-audit.cjs
      - name: Commit only the strengthened lifecycle audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/scripts/workspace-audit.cjs
          git diff --cached --quiet && exit 0
          git commit -m 'Verify implementation, application and distribution on every feature detail'
          git push origin HEAD:content/full-methodology-review-20261028
