name: Homepage visual design audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local homepage server
        run: |
          python3 -m http.server 8000 --directory docs >/tmp/kdrum-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kdrum-http.log
          exit 1

      - name: Capture rendered layouts and design metrics
        run: |
          mkdir -p visual-audit
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const cases = [
            {name:'en-desktop', url:'http://127.0.0.1:8000/', viewport:{width:1440,height:1000}, mobile:false},
            {name:'ko-desktop', url:'http://127.0.0.1:8000/ko/', viewport:{width:1440,height:1000}, mobile:false},
            {name:'en-mobile', url:'http://127.0.0.1:8000/', viewport:{width:390,height:844}, mobile:true},
            {name:'ko-mobile', url:'http://127.0.0.1:8000/ko/', viewport:{width:390,height:844}, mobile:true},
          ];

          (async()=>{
            const browser = await chromium.launch();
            const report = {};
            const failures = [];
            for (const c of cases) {
              const page = await browser.newPage({viewport:c.viewport, deviceScaleFactor:1});
              const errors=[];
              page.on('console',m=>{if(m.type()==='error')errors.push(`console: ${m.text()}`)});
              page.on('pageerror',e=>errors.push(`pageerror: ${e.message}`));
              await page.goto(c.url,{waitUntil:'networkidle'});
              await page.waitForFunction(()=>document.documentElement.dataset.kdrumBrandRuntime==='ready',null,{timeout:8000});
              await page.waitForFunction(()=>document.documentElement.dataset.kdrumCapabilityAtlas==='ready',null,{timeout:8000});
              await page.waitForFunction(()=>document.documentElement.dataset.kdrumPublicCopy==='ready',null,{timeout:8000});
              await page.waitForFunction(()=>document.documentElement.dataset.kdrumDesignSystem==='ready',null,{timeout:8000});

              await page.screenshot({path:`visual-audit/${c.name}-full.png`,fullPage:true});
              for (const [name,selector] of Object.entries({
                hero:'.hero', capabilities:'#capabilities', architecture:'#architecture', research:'#research', platform:'#platform', references:'#references'
              })) {
                const el=page.locator(selector);
                if(await el.count()) await el.screenshot({path:`visual-audit/${c.name}-${name}.png`});
              }

              let capabilityTotal=0;
              let symbolTotal=0;
              const tabs=page.locator('.catlas-tab');
              for(let i=0;i<await tabs.count();i++){
                await tabs.nth(i).click();
                await page.waitForTimeout(0);
                capabilityTotal+=await page.locator('.catlas-card').count();
                symbolTotal+=await page.locator('.catlas-card .catlas-symbol').count();
              }
              await tabs.first().click();
              await page.waitForTimeout(0);

              const metrics=await page.evaluate(()=>{
                const rect=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom}};
                const style=e=>{if(!e)return null;const s=getComputedStyle(e);return {position:s.position,color:s.color,backgroundColor:s.backgroundColor,borderColor:s.borderColor,fontSize:s.fontSize,lineHeight:s.lineHeight,borderRadius:s.borderRadius,padding:s.padding,gap:s.gap,display:s.display,gridTemplateColumns:s.gridTemplateColumns}};
                const platformCards=[...document.querySelectorAll('#platform .card')].map(e=>({title:e.querySelector('h3')?.textContent.trim(),role:e.dataset.programRole,rect:rect(e),style:style(e)}));
                const tabItems=[...document.querySelectorAll('.catlas-tab')].map(e=>({text:e.textContent.trim(),selected:e.getAttribute('aria-selected'),rect:rect(e),style:style(e)}));
                const capabilityCards=[...document.querySelectorAll('.catlas-card')].map(e=>({title:e.querySelector('h4')?.textContent.trim(),status:e.dataset.status,symbol:e.querySelector('.catlas-symbol')?.textContent.trim(),rect:rect(e),style:style(e)}));
                const wrap=rect(document.querySelector('#capabilities .wrap'));
                const rowCounts={};
                for(const card of platformCards){const y=Math.round(card.rect.y);rowCounts[y]=(rowCounts[y]||0)+1;}
                return {
                  viewport:{width:innerWidth,height:innerHeight},
                  document:{scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,scrollHeight:document.documentElement.scrollHeight},
                  body:style(document.body),hero:rect(document.querySelector('.hero')),nav:{rect:rect(document.querySelector('.topbar')),style:style(document.querySelector('.topbar'))},
                  designReady:document.documentElement.dataset.kdrumDesignSystem,
                  activeGroup:document.querySelector('#capabilities')?.dataset.activeGroup,
                  tabs:tabItems,capabilityCards,capabilityWrap:wrap,
                  platformCards,platformRows:Object.values(rowCounts).sort((a,b)=>b-a),platformGrid:style(document.querySelector('#platform .program-grid-v2')),
                  official:{rect:rect(document.querySelector('#references .official')),style:style(document.querySelector('#references .official')),className:document.querySelector('#references .official')?.className},
                  genericBarsVisible:[...document.querySelectorAll('.catlas-mini')].some(e=>getComputedStyle(e).display!=='none'),
                  errors:[]
                };
              });
              metrics.capabilityTotal=capabilityTotal;
              metrics.symbolTotal=symbolTotal;
              metrics.errors=errors;

              if(metrics.designReady!=='ready')failures.push(`${c.name}: design system not ready`);
              if(metrics.document.scrollWidth>metrics.document.clientWidth+1)failures.push(`${c.name}: horizontal overflow`);
              if(metrics.capabilityTotal!==46||metrics.symbolTotal!==46)failures.push(`${c.name}: capability symbols ${metrics.symbolTotal}/${metrics.capabilityTotal}`);
              if(metrics.genericBarsVisible)failures.push(`${c.name}: generic capability bars remain visible`);
              if(metrics.platformCards.length!==7||metrics.platformCards.some(x=>!x.role))failures.push(`${c.name}: program roles incomplete`);
              if(!metrics.official.className.includes('mywater-callout-v2'))failures.push(`${c.name}: MyWater design class missing`);
              if(c.mobile&&metrics.nav.style.position==='sticky')failures.push(`${c.name}: mobile header still overlays content`);
              if(!c.mobile){
                const within=metrics.tabs.every(t=>t.rect.x>=metrics.capabilityWrap.x-1&&t.rect.right<=metrics.capabilityWrap.right+1);
                if(!within)failures.push(`${c.name}: capability tabs exceed content width`);
                if(JSON.stringify(metrics.platformRows)!==JSON.stringify([4,3]))failures.push(`${c.name}: expected balanced 3+4 program rows, found ${JSON.stringify(metrics.platformRows)}`);
              }
              if(c.mobile&&metrics.official.rect.height>560)failures.push(`${c.name}: MyWater callout remains too tall (${metrics.official.rect.height})`);
              if(errors.length)failures.push(`${c.name}: ${errors.join(' | ')}`);
              report[c.name]=metrics;
              await page.close();
            }
            fs.writeFileSync('visual-audit/metrics.json',JSON.stringify(report,null,2));
            await browser.close();
            if(failures.length){console.error('VISUAL AUDIT HARD CHECK FAILED');failures.forEach(x=>console.error(' -',x));process.exit(1)}
            console.log('VISUAL DESIGN AUDIT PASSED');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-visual-audit
          path: visual-audit/
          if-no-files-found: error
