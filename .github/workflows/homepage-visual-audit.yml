name: Homepage visual design audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local homepage server
        run: |
          python3 -m http.server 8000 --directory docs >/tmp/kdrum-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kdrum-http.log
          exit 1

      - name: Capture rendered layouts and design metrics
        run: |
          mkdir -p visual-audit
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const cases = [
            {name:'en-desktop', url:'http://127.0.0.1:8000/', viewport:{width:1440,height:1000}},
            {name:'ko-desktop', url:'http://127.0.0.1:8000/ko/', viewport:{width:1440,height:1000}},
            {name:'en-mobile', url:'http://127.0.0.1:8000/', viewport:{width:390,height:844}},
            {name:'ko-mobile', url:'http://127.0.0.1:8000/ko/', viewport:{width:390,height:844}},
          ];

          (async()=>{
            const browser = await chromium.launch();
            const report = {};
            const failures = [];
            for (const c of cases) {
              const page = await browser.newPage({viewport:c.viewport, deviceScaleFactor:1});
              const errors=[];
              page.on('console',m=>{if(m.type()==='error')errors.push(`console: ${m.text()}`)});
              page.on('pageerror',e=>errors.push(`pageerror: ${e.message}`));
              await page.goto(c.url,{waitUntil:'networkidle'});
              await page.waitForFunction(()=>document.documentElement.dataset.kdrumBrandRuntime==='ready',null,{timeout:8000});
              await page.waitForFunction(()=>document.documentElement.dataset.kdrumCapabilityAtlas==='ready',null,{timeout:8000});
              await page.waitForFunction(()=>document.documentElement.dataset.kdrumPublicCopy==='ready',null,{timeout:8000});

              await page.screenshot({path:`visual-audit/${c.name}-full.png`,fullPage:true});
              for (const [name,selector] of Object.entries({
                hero:'.hero', capabilities:'#capabilities', architecture:'#architecture', research:'#research', platform:'#platform', references:'#references'
              })) {
                const el=page.locator(selector);
                if(await el.count()) await el.screenshot({path:`visual-audit/${c.name}-${name}.png`});
              }

              const metrics=await page.evaluate(()=>{
                const rect=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}};
                const style=e=>{if(!e)return null;const s=getComputedStyle(e);return {color:s.color,backgroundColor:s.backgroundColor,borderColor:s.borderColor,fontSize:s.fontSize,lineHeight:s.lineHeight,borderRadius:s.borderRadius,padding:s.padding,gap:s.gap}};
                const platformCards=[...document.querySelectorAll('#platform .card')].map(e=>({title:e.querySelector('h3')?.textContent.trim(),rect:rect(e),style:style(e)}));
                const tabs=[...document.querySelectorAll('.catlas-tab')].map(e=>({text:e.textContent.trim(),selected:e.getAttribute('aria-selected'),rect:rect(e),style:style(e)}));
                const capabilityCards=[...document.querySelectorAll('.catlas-card')].map(e=>({title:e.querySelector('h4')?.textContent.trim(),status:e.dataset.status,rect:rect(e),style:style(e)}));
                return {
                  viewport:{width:innerWidth,height:innerHeight},
                  document:{scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,scrollHeight:document.documentElement.scrollHeight},
                  body:style(document.body), hero:rect(document.querySelector('.hero')),
                  nav:rect(document.querySelector('.topbar')),
                  tabs, capabilityCards, platformCards,
                  platformGrid:style(document.querySelector('#platform .grid3')),
                  official:{rect:rect(document.querySelector('#references .official')),style:style(document.querySelector('#references .official'))},
                  errors:[]
                };
              });
              metrics.errors=errors;
              if(metrics.document.scrollWidth>metrics.document.clientWidth+1)failures.push(`${c.name}: horizontal overflow`);
              if(errors.length)failures.push(`${c.name}: ${errors.join(' | ')}`);
              report[c.name]=metrics;
              await page.close();
            }
            fs.writeFileSync('visual-audit/metrics.json',JSON.stringify(report,null,2));
            await browser.close();
            if(failures.length){console.error('VISUAL AUDIT HARD CHECK FAILED');failures.forEach(x=>console.error(' -',x));process.exit(1)}
            console.log('VISUAL AUDIT CAPTURED');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-visual-audit
          path: visual-audit/
          if-no-files-found: error
