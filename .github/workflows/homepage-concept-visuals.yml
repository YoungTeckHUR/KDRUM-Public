name: Homepage concept visuals audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  concept-visuals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check concept visual JavaScript syntax
        run: |
          node --check docs/assets/design-system-v2.js
          node --check docs/assets/concept-visuals-v1.js
          node --check .github/scripts/homepage-concept-visuals-audit.cjs

      - name: Validate production SVG assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected = {
              'kdrum-workflow.svg',
              'runoff-hydrograph.svg',
              'flood-depth-map.svg',
              'water-balance-report.svg',
              'viewer1d-concept.svg',
              'mywater-download.svg',
          }
          root = Path('docs/assets/concepts')
          found = {p.name for p in root.glob('*.svg')}
          missing = expected - found
          if missing:
              raise SystemExit(f'Missing concept SVG assets: {sorted(missing)}')
          for name in expected:
              path = root / name
              ET.parse(path)
              text = path.read_text(encoding='utf-8')
              if '<script' in text.lower() or 'javascript:' in text.lower():
                  raise SystemExit(f'Executable content found in {name}')
          print(f'Validated {len(expected)} production concept SVGs')
          PY

      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local homepage server
        run: |
          python3 -m http.server 8000 --directory docs >/tmp/kdrum-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kdrum-http.log
          exit 1

      - name: Verify concept visuals, boundaries and interactions
        env:
          BASE_URL: http://127.0.0.1:8000
          AUDIT_DIR: concept-visual-artifacts
          AUDIT_LABEL: Homepage concept visuals audit
        run: node .github/scripts/homepage-concept-visuals-audit.cjs

      - name: Upload concept visual screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-concept-visuals
          path: concept-visual-artifacts/
          if-no-files-found: error
