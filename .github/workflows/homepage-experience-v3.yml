name: Homepage experience v3 audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experience-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local homepage server
        run: |
          python3 -m http.server 8000 --directory docs >/tmp/kdrum-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kdrum-http.log
          exit 1

      - name: Verify light visual hierarchy, concept images and affordances
        run: |
          mkdir -p experience-v3-artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const cases=[
            {name:'en-desktop',url:'http://127.0.0.1:8000/',viewport:{width:1440,height:1000},mobile:false,korean:false},
            {name:'ko-desktop',url:'http://127.0.0.1:8000/ko/',viewport:{width:1440,height:1000},mobile:false,korean:true},
            {name:'en-mobile',url:'http://127.0.0.1:8000/',viewport:{width:390,height:844},mobile:true,korean:false},
            {name:'ko-mobile',url:'http://127.0.0.1:8000/ko/',viewport:{width:390,height:844},mobile:true,korean:true},
          ];
          const representative=['rain-qc','wb','dam-operation','viewer1d'];
          const rgb=s=>{const m=(s||'').match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);return m?m.slice(1).map(Number):null};
          const light=s=>{const v=rgb(s);return Boolean(v&&((v[0]+v[1]+v[2])/3)>190)};

          async function findCard(page,id){
            const tabs=page.locator('.catlas-tab');
            for(let i=0;i<await tabs.count();i++){
              await tabs.nth(i).click();
              await page.waitForTimeout(160);
              const card=page.locator(`.catlas-card[data-id="${id}"]`);
              if(await card.count())return card;
            }
            return null;
          }

          (async()=>{
            const browser=await chromium.launch();
            const failures=[];
            const report={};

            for(const c of cases){
              const page=await browser.newPage({viewport:c.viewport,deviceScaleFactor:1});
              const errors=[];
              page.on('console',m=>{if(m.type()==='error')errors.push(`console: ${m.text()}`)});
              page.on('pageerror',e=>errors.push(`pageerror: ${e.message}`));
              await page.goto(c.url,{waitUntil:'networkidle'});
              await page.waitForFunction(()=>document.documentElement.dataset.kdrumBrandRuntime==='ready',null,{timeout:10000});
              await page.waitForFunction(()=>document.documentElement.dataset.kdrumCapabilityAtlas==='ready',null,{timeout:10000});
              await page.waitForFunction(()=>document.documentElement.dataset.kdrumPublicCopy==='ready',null,{timeout:10000});
              await page.waitForFunction(()=>document.documentElement.dataset.kdrumExperienceV3==='ready',null,{timeout:10000});
              await page.waitForTimeout(300);

              const base=await page.evaluate(()=>{
                const q=s=>document.querySelector(s);
                const qa=s=>[...document.querySelectorAll(s)];
                const rect=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom}};
                const css=e=>e?getComputedStyle(e):null;
                return {
                  dataset:{experience:document.documentElement.dataset.kdrumExperienceV3,design:document.documentElement.dataset.kdrumDesignSystem},
                  bodyBackground:css(document.body)?.backgroundColor,
                  topbarBackground:css(q('.topbar'))?.backgroundColor,
                  heroColor:css(q('.hero h1'))?.color,
                  outcomes:qa('#outcomes .ev3-outcome-card').length,
                  outcomeImages:qa('#outcomes svg').length,
                  results:qa('#results .ev3-result-card').length,
                  resultImages:qa('#results svg').length,
                  programs:qa('#platform .ev3-program-card').length,
                  programImages:qa('#platform .ev3-program-visual[data-concept-image="1"]').length,
                  programRoles:qa('#platform .card[data-program-role]').length,
                  programPointer:qa('#platform .ev3-program-card').map(e=>css(e).cursor),
                  resources:qa('#references .ev3-resource-link').length,
                  resourceActions:qa('#references .ev3-link-action').length,
                  primaryDownload:Boolean(q('#references .ev3-download-primary')),
                  primaryDownloadHref:q('#references .ev3-download-primary')?.href||'',
                  navCtaHeight:rect(q('.ev3-nav-cta'))?.height||0,
                  clickHint:Boolean(q('#capabilities .ev3-click-hint')),
                  mobileTopbarPosition:css(q('.topbar'))?.position,
                  scrollWidth:document.documentElement.scrollWidth,
                  clientWidth:document.documentElement.clientWidth,
                  bodyText:document.body.innerText,
                };
              });

              if(base.dataset.experience!=='ready'||base.dataset.design!=='ready')failures.push(`${c.name}: experience runtime not ready`);
              if(!light(base.bodyBackground)||!light(base.topbarBackground))failures.push(`${c.name}: page/header did not switch to a light surface: ${base.bodyBackground}, ${base.topbarBackground}`);
              if(base.outcomes!==4||base.outcomeImages!==4)failures.push(`${c.name}: outcome concept cards/images ${base.outcomes}/${base.outcomeImages}`);
              if(base.results!==4||base.resultImages!==4)failures.push(`${c.name}: result concept cards/images ${base.results}/${base.resultImages}`);
              if(base.programs!==7||base.programImages!==7||base.programRoles!==7)failures.push(`${c.name}: program visuals/roles ${base.programs}/${base.programImages}/${base.programRoles}`);
              if(base.programPointer.some(x=>x==='pointer'))failures.push(`${c.name}: static program card looks clickable`);
              if(base.resources!==4||base.resourceActions!==4)failures.push(`${c.name}: linked resources lack visible actions`);
              if(!base.primaryDownload||!base.primaryDownloadHref.includes('menuId=15_126_128'))failures.push(`${c.name}: primary MyWater download action missing`);
              if(base.navCtaHeight<44)failures.push(`${c.name}: download navigation target smaller than 44px`);
              if(!base.clickHint)failures.push(`${c.name}: card interaction guidance missing`);
              if(base.scrollWidth>base.clientWidth+1)failures.push(`${c.name}: horizontal overflow`);
              if(c.mobile&&base.mobileTopbarPosition==='sticky')failures.push(`${c.name}: mobile header remains sticky`);
              if(c.korean&&!base.bodyText.includes('상세 보기'))failures.push(`${c.name}: Korean click affordance copy missing`);

              let total=0,visuals=0,actions=0,symbols=0,pointerCards=0,minTabHeight=Infinity;
              const tabs=page.locator('.catlas-tab');
              for(let i=0;i<await tabs.count();i++){
                const tab=tabs.nth(i);
                await tab.click();
                await page.waitForTimeout(180);
                const cards=page.locator('.catlas-card');
                total+=await cards.count();
                visuals+=await page.locator('.catlas-card .ev3-card-visual[data-concept-image="1"]').count();
                actions+=await page.locator('.catlas-card .ev3-card-action').count();
                symbols+=await page.locator('.catlas-card .catlas-symbol').count();
                pointerCards+=await cards.evaluateAll(els=>els.filter(e=>getComputedStyle(e).cursor==='pointer').length);
                const h=await tab.evaluate(e=>e.getBoundingClientRect().height);
                minTabHeight=Math.min(minTabHeight,h);
              }
              if(total!==46||visuals!==46||actions!==46||symbols!==46||pointerCards!==46)failures.push(`${c.name}: capability totals total=${total} visuals=${visuals} actions=${actions} symbols=${symbols} pointer=${pointerCards}`);
              if(minTabHeight<44)failures.push(`${c.name}: capability tab smaller than 44px (${minTabHeight})`);

              const dialogs={};
              for(const id of representative){
                const card=await findCard(page,id);
                if(!card){failures.push(`${c.name}: missing representative card ${id}`);continue;}
                await card.click();
                const dlg=page.locator('#catlas-dialog');
                await dlg.waitFor({state:'visible',timeout:5000});
                const metrics=await dlg.evaluate(el=>({
                  background:getComputedStyle(el).backgroundColor,
                  title:(el.querySelector('#catlas-title')?.textContent||'').trim(),
                  svg:el.querySelectorAll('.catlas-graphic svg').length,
                  panels:el.querySelectorAll('.catlas-panel').length,
                  flow:el.querySelectorAll('.catlas-flow>div').length,
                  doc:Boolean(el.querySelector('.catlas-doc')),
                }));
                dialogs[id]=metrics;
                if(!light(metrics.background)||!metrics.title||metrics.svg!==1||metrics.panels<2||metrics.flow!==3||!metrics.doc)failures.push(`${c.name}: incomplete/light dialog ${id}: ${JSON.stringify(metrics)}`);
                if(['wb','viewer1d'].includes(id))await dlg.screenshot({path:`experience-v3-artifacts/${c.name}-${id}.png`});
                await page.keyboard.press('Escape');
              }

              await page.screenshot({path:`experience-v3-artifacts/${c.name}-full.png`,fullPage:true});
              for(const [name,selector] of Object.entries({hero:'.hero',outcomes:'#outcomes',capabilities:'#capabilities',results:'#results',platform:'#platform',references:'#references'})){
                const el=page.locator(selector);
                if(await el.count())await el.screenshot({path:`experience-v3-artifacts/${c.name}-${name}.png`});
              }

              if(errors.length)failures.push(`${c.name}: browser errors: ${errors.join(' | ')}`);
              report[c.name]={base,total,visuals,actions,symbols,pointerCards,minTabHeight,dialogs,errors};
              await page.close();
            }

            fs.writeFileSync('experience-v3-artifacts/metrics.json',JSON.stringify(report,null,2));
            await browser.close();
            if(failures.length){console.error('EXPERIENCE V3 AUDIT FAILED');failures.forEach(x=>console.error(' -',x));process.exit(1)}
            console.log('EXPERIENCE V3 AUDIT PASSED');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-experience-v3
          path: experience-v3-artifacts/
          if-no-files-found: error
