name: Generate official K-DRUM QR assets

on:
  push:
    branches:
      - qr-official-assets-20260918
    paths:
      - tools/generate_official_qr_assets.py
      - .github/workflows/generate-official-qr-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: qr-official-assets-20260918
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install "qrcode[pil]"

      - name: Generate QR assets
        run: python tools/generate_official_qr_assets.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/qr/official
          if git diff --cached --quiet; then
            echo "No generated asset changes."
            exit 0
          fi
          git commit -m "Generate official K-DRUM QR asset package"
          git push origin HEAD:qr-official-assets-20260918
