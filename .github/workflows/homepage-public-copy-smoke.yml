name: Homepage public copy smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-copy-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check public-copy JavaScript and observer policy
        run: |
          node --check docs/assets/public-copy-runtime-v2.js
          node --check docs/assets/branding/brand-runtime.js
          node --check docs/assets/experience-v4.js
          node --check .github/scripts/homepage-v4-audit.cjs
          if grep -R "MutationObserver" docs/assets/public-copy-runtime-v2.js docs/assets/branding/brand-runtime.js docs/assets/experience-v4.js; then
            echo "Unexpected MutationObserver in public-copy path"
            exit 1
          fi

      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local homepage server
        run: |
          python3 -m http.server 8000 --directory docs >/tmp/kdrum-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kdrum-http.log
          exit 1

      - name: Verify rendered terminology, viewer boundary and MyWater guidance
        env:
          BASE_URL: http://127.0.0.1:8000
          AUDIT_DIR: public-copy-artifacts
          AUDIT_LABEL: Homepage public copy smoke
          AUDIT_SCREENSHOTS: '0'
        run: node .github/scripts/homepage-v4-audit.cjs

      - name: Upload public-copy metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-public-copy-smoke
          path: public-copy-artifacts/
          if-no-files-found: error
