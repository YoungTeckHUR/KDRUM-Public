name: Homepage public copy smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-copy-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check docs/assets/public-copy-runtime-v2.js
          node --check docs/assets/branding/brand-runtime.js

      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local homepage server
        run: |
          python3 -m http.server 8000 --directory docs >/tmp/kdrum-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kdrum-http.log
          exit 1

      - name: Verify rendered terminology, viewer and MyWater guidance
        run: |
          mkdir -p public-copy-artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          async function findCard(page,id){
            const tabs=page.locator('.catlas-tab');
            for(let i=0;i<await tabs.count();i++){
              await tabs.nth(i).click();
              const card=page.locator(`.catlas-card[data-id="${id}"]`);
              if(await card.count())return card;
            }
            return null;
          }

          (async()=>{
            const browser=await chromium.launch();
            const failures=[];
            const report={};
            const cases=[
              {name:'ko',url:'http://127.0.0.1:8000/ko/',korean:true},
              {name:'en',url:'http://127.0.0.1:8000/',korean:false},
            ];

            for(const c of cases){
              const page=await browser.newPage({viewport:{width:1440,height:1100}});
              const errors=[];
              page.on('console',m=>{if(m.type()==='error')errors.push(`console: ${m.text()}`)});
              page.on('pageerror',e=>errors.push(`pageerror: ${e.message}`));
              await page.goto(c.url,{waitUntil:'networkidle'});
              await page.waitForFunction(()=>document.documentElement.dataset.kdrumCapabilityAtlas==='ready',null,{timeout:8000});
              await page.waitForFunction(()=>document.documentElement.dataset.kdrumPublicCopy==='ready',null,{timeout:8000});

              const base=await page.evaluate(()=>({
                lang:document.documentElement.lang,
                title:document.title,
                lead:(document.querySelector('.lead')?.textContent||'').trim(),
                count:(document.querySelector('.catlas-count')?.textContent||'').trim(),
                tabs:document.querySelectorAll('.catlas-tab').length,
                viewer:(document.querySelector('[data-kdrum-1d-viewer]')?.textContent||'').trim(),
                official:(document.querySelector('#references .official')?.textContent||'').trim(),
                links:[...document.querySelectorAll('#references .official a')].map(a=>a.href),
              }));

              if(base.tabs!==8)failures.push(`${c.name}: expected 8 capability groups`);
              if(!base.viewer)failures.push(`${c.name}: separate 1D viewer card missing`);
              if(!base.official.includes('MyWater'))failures.push(`${c.name}: MyWater guidance missing`);
              if(!base.links.some(x=>x.includes('menuId=15_126_128')))failures.push(`${c.name}: MyWater K-Series link missing`);
              if(c.korean){
                if(base.lang!=='ko')failures.push(`ko: language mismatch: ${base.lang}`);
                if(base.lead!=='K-DRUM은 K-water에서 개발한 물리적 기반의 격자단위 분포형 강우유출모형입니다.')failures.push(`ko: canonical model description mismatch: ${base.lead}`);
                if(base.count!=='45개 주요 기능')failures.push(`ko: capability count label mismatch: ${base.count}`);
                if(!base.viewer.includes('1차원 하천수리 결과 뷰어')||!base.viewer.includes('GitHub 미공개'))failures.push(`ko: 1D viewer status wording missing`);
                if(!base.official.includes('무료로 내려받아 사용할 수 있습니다'))failures.push(`ko: free MyWater download wording missing`);
                const dwnet=await findCard(page,'dwnet');
                if(!dwnet)failures.push('ko: dwnet card missing');
                else if(!(await dwnet.locator('h4').innerText()).includes('1차원 동역학파 하천망 해석'))failures.push('ko: 1D hydraulic terminology not normalized');
                const flood=await findCard(page,'local-inertia');
                if(!flood)failures.push('ko: local-inertia card missing');
                else if(!(await flood.locator('h4').innerText()).includes('2차원 홍수범람해석'))failures.push('ko: 2D flood-inundation terminology not normalized');
              }else{
                if(!base.lead.includes('grid-unit distributed rainfall-runoff model'))failures.push(`en: model description mismatch: ${base.lead}`);
                if(!base.viewer.includes('NOT YET ON GITHUB'))failures.push('en: 1D viewer public-boundary wording missing');
                if(!base.official.includes('free of charge'))failures.push('en: free MyWater access wording missing');
              }

              await page.locator('#platform').screenshot({path:`public-copy-artifacts/${c.name}-platform.png`});
              await page.locator('#references .official').screenshot({path:`public-copy-artifacts/${c.name}-mywater.png`});
              if(errors.length)failures.push(`${c.name}: browser errors: ${errors.join(' | ')}`);
              report[c.name]={base,errors};
              await page.close();
            }

            fs.writeFileSync('public-copy-artifacts/metrics.json',JSON.stringify(report,null,2));
            await browser.close();
            if(failures.length){console.error('PUBLIC COPY SMOKE FAILED');failures.forEach(x=>console.error(' -',x));process.exit(1)}
            console.log('PUBLIC COPY SMOKE PASSED');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload rendered screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-public-copy-smoke
          path: public-copy-artifacts/
          if-no-files-found: error
