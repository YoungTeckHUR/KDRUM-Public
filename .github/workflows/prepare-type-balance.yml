name: Prepare bounded typography refinement
on:
  push:
    branches: [polish/typography-balance-20260919]
    paths: [.github/scripts/prepare-type-balance.cjs]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'YoungTeckHUR/KDRUM-Public' && github.ref == 'refs/heads/polish/typography-balance-20260919'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply presentation-only changes with preservation assertions
        run: |
          set -euo pipefail
          node --check .github/scripts/prepare-type-balance.cjs
          node --check .github/scripts/typography-balance-audit.cjs
          node .github/scripts/prepare-type-balance.cjs
          node .github/scripts/capability-contract.cjs
          git diff --check
      - name: Commit content to this review branch only
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/polish/typography-balance-20260919 | cut -f1)" = "$EXPECTED_SHA"
          git add docs/assets/site.css .github/fixtures/typography-before-40ded09.css .github/scripts/layout-density-audit.cjs .github/scripts/homepage-readability-audit.cjs .github/notes/TYPOGRAPHY_BALANCE_20260919.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refine readable text hierarchy and card balance without changing public content'
          git push origin HEAD:refs/heads/polish/typography-balance-20260919
      - name: Export exact public source for independent browser rendering
        if: always()
        run: |
          mkdir -p preparation-evidence
          git rev-parse HEAD > preparation-evidence/prepared-sha.txt
          tar -czf preparation-evidence/prepared-source.tar.gz .github docs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typography-prepared-source
          path: preparation-evidence/
          if-no-files-found: error
