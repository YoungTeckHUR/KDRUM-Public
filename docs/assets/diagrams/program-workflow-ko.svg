<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="program-workflow-ko-title program-workflow-ko-desc" lang="ko"><title id="program-workflow-ko-title">입력 작성부터 결과 해석까지</title><desc id="program-workflow-ko-desc">InputStudio에서 입력을 작성하고 K-DRUM Core에서 계산하며 결과 파일을 FloodViewer로 읽는 흐름이다. InputStudio와 NetCDF 통합은 개발 중이고 FloodViewer는 릴리스 후보이다. ChannelBed는 지형 지원 개발 도구이며, 1D 결과 뷰어는 별도 개발로 아직 GitHub에 공개되지 않았다. Estuary2DV는 독립된 실험 연구 모형이다.</desc><defs><marker id="program-workflow-ko-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#0077b6"/></marker><marker id="program-workflow-ko-blue-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#0077b6"/></marker><marker id="program-workflow-ko-teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#13878c"/></marker><marker id="program-workflow-ko-teal-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#13878c"/></marker><marker id="program-workflow-ko-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#b47013"/></marker><marker id="program-workflow-ko-amber-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#b47013"/></marker></defs><g font-family="Pretendard, Noto Sans KR, Malgun Gothic, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="24" y="44" font-size="30" font-weight="700" fill="#15364f" text-anchor="start">입력 작성부터 결과 해석까지</text><text x="24" y="83" font-size="19" font-weight="400" fill="#4d687c" text-anchor="start">프로그램 연결과 지원 도구 · 각 프로그램의 공개 개발 상태</text><circle cx="42" cy="150" r="17" fill="#0077b6" stroke="none" stroke-width="2"/><text x="42" y="157" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><rect x="24" y="180" width="212" height="177" rx="9" fill="#fff5e2" stroke="none" stroke-width="1.8"/><text x="39" y="218" font-size="23" font-weight="700" fill="#15364f" text-anchor="start">InputStudio</text><text x="39" y="256" font-size="18" font-weight="400" fill="#15364f" text-anchor="start">프로젝트 · 입력 작성</text><text x="39" y="285" font-size="18" font-weight="400" fill="#15364f" text-anchor="start">자료 점검</text><text x="39" y="329" font-size="18" font-weight="700" fill="#885112" text-anchor="start">개발 중</text><line x1="242" y1="266" x2="256" y2="266" stroke="#0077b6" stroke-width="3" marker-end="url(#program-workflow-ko-blue-arrow)"/><circle cx="282" cy="150" r="17" fill="#0077b6" stroke="none" stroke-width="2"/><text x="282" y="157" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><rect x="264" y="180" width="214" height="177" rx="9" fill="#e8f6f3" stroke="none" stroke-width="1.8"/><text x="279" y="218" font-size="23" font-weight="700" fill="#15364f" text-anchor="start">K-DRUM Core</text><text x="279" y="256" font-size="18" font-weight="400" fill="#15364f" text-anchor="start">분포형 수문 계산</text><text x="279" y="285" font-size="18" font-weight="400" fill="#15364f" text-anchor="start">수리 확장 개발</text><text x="279" y="329" font-size="18" font-weight="700" fill="#11695d" text-anchor="start">기반 기능 + 확장</text><line x1="484" y1="266" x2="498" y2="266" stroke="#0077b6" stroke-width="3" marker-end="url(#program-workflow-ko-blue-arrow)"/><circle cx="524" cy="150" r="17" fill="#0077b6" stroke="none" stroke-width="2"/><text x="524" y="157" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><rect x="506" y="180" width="192" height="177" rx="9" fill="#edf6fb" stroke="none" stroke-width="1.8"/><text x="521" y="218" font-size="23" font-weight="700" fill="#15364f" text-anchor="start">결과 파일</text><text x="521" y="256" font-size="18" font-weight="400" fill="#15364f" text-anchor="start">시계열 · 공간장</text><text x="521" y="285" font-size="18" font-weight="400" fill="#15364f" text-anchor="start">NetCDF 통합</text><text x="521" y="329" font-size="18" font-weight="700" fill="#885112" text-anchor="start">통합 개발 중</text><line x1="704" y1="266" x2="718" y2="266" stroke="#0077b6" stroke-width="3" marker-end="url(#program-workflow-ko-blue-arrow)"/><circle cx="744" cy="150" r="17" fill="#0077b6" stroke="none" stroke-width="2"/><text x="744" y="157" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><rect x="726" y="180" width="210" height="177" rx="9" fill="#edf6fb" stroke="none" stroke-width="1.8"/><text x="741" y="218" font-size="23" font-weight="700" fill="#15364f" text-anchor="start">FloodViewer</text><text x="741" y="256" font-size="18" font-weight="400" fill="#15364f" text-anchor="start">결과 탐색 · 시각화</text><text x="741" y="285" font-size="18" font-weight="400" fill="#15364f" text-anchor="start">공간·시간 해석</text><text x="741" y="329" font-size="18" font-weight="700" fill="#005f90" text-anchor="start">릴리스 후보</text><path d="M138 436 V378 H135 V363" fill="none" stroke="#b47013" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#program-workflow-ko-amber-arrow)" stroke-linecap="round" stroke-linejoin="round"/><text x="159" y="401" font-size="18" font-weight="400" fill="#885112" text-anchor="start">지형·하상 작성 지원</text><line x1="351" y1="434" x2="936" y2="434" stroke="#bbccd8" stroke-width="2" stroke-dasharray="6 6"/><text x="524" y="415" font-size="18" font-weight="700" fill="#4d687c" text-anchor="start">별도 개발·연구</text><rect x="24" y="447" width="278" height="127" rx="9" fill="#fff5e2" stroke="none" stroke-width="1.8"/><text x="42" y="481" font-size="23" font-weight="700" fill="#15364f" text-anchor="start">ChannelBed</text><text x="42" y="515" font-size="18" font-weight="400" fill="#885112" text-anchor="start">가상 하상 · 지형 지원</text><text x="42" y="544" font-size="18" font-weight="400" fill="#885112" text-anchor="start">개발 중</text><rect x="351" y="447" width="278" height="127" rx="9" fill="#f0f3f6" stroke="none" stroke-width="1.8"/><text x="369" y="481" font-size="23" font-weight="700" fill="#15364f" text-anchor="start">1D 수리 결과 뷰어</text><text x="369" y="515" font-size="18" font-weight="400" fill="#4d687c" text-anchor="start">별도 개발</text><text x="369" y="544" font-size="18" font-weight="400" fill="#4d687c" text-anchor="start">GitHub에 아직 미공개</text><rect x="658" y="447" width="278" height="127" rx="9" fill="#f0f3f6" stroke="none" stroke-width="1.8"/><text x="676" y="481" font-size="23" font-weight="700" fill="#15364f" text-anchor="start">Estuary2DV</text><text x="676" y="515" font-size="18" font-weight="400" fill="#4d687c" text-anchor="start">하구 수리·염분 연구</text><text x="676" y="544" font-size="18" font-weight="400" fill="#4d687c" text-anchor="start">독립 실험 모형</text></g></svg>
