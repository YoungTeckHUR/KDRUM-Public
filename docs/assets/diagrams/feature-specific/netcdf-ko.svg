<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">결과 파일을 비교하기 전 확인할 축</title><desc id="desc">형식은 같아도 파일별 격자와 저장 시각은 다를 수 있습니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker><pattern id="missing" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3 3-3 M0 12 12 0 M9 15 15 9" stroke="#b2bdc5" stroke-width="2"/></pattern></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">결과 파일을 비교하기 전 확인할 축</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">형식은 같아도 파일별 격자와 저장 시각은 다를 수 있습니다.</text>
<rect x="60" y="210" width="510" height="260" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="84" y="256" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">유역 격자 결과</text><text x="84" y="301" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">좌표 · 계산격자</text><text x="84" y="339" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">실제 저장 시각</text><text x="84" y="377" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">변수 이름 · 단위</text><rect x="630" y="210" width="510" height="260" rx="16" fill="#ecf6f3" stroke="#aac7d7" stroke-width="2"/><text x="654" y="256" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">범람 결과</text><text x="654" y="301" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">좌표 · 범람격자</text><text x="654" y="339" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">별도 출력 간격 가능</text><text x="654" y="377" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">사용 가능한 수리 변수</text><path d="M315 482V522H600V550" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M885 482V522H610" fill="none" stroke="#247eaa" stroke-width="3"/><text x="600" y="601" font-size="28" font-weight="600" text-anchor="middle" fill="#173d59">위치·시간 정렬 → 변수·단위 확인 → 비교</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
</g></svg>
