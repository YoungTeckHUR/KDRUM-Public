<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Check the axes before comparing files</title><desc id="desc">A common format can contain different grids and output times. Concept schematic · not calculated values or a software screenshot.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker><pattern id="missing" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3 3-3 M0 12 12 0 M9 15 15 9" stroke="#b2bdc5" stroke-width="2"/></pattern></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">Check the axes before comparing files</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">A common format can contain different grids and output times.</text>
<rect x="60" y="210" width="510" height="260" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="84" y="256" font-size="24" font-weight="700" text-anchor="start" fill="#173d59">Watershed-grid output</text><text x="84" y="301" font-size="22" font-weight="400" text-anchor="start" fill="#173d59">Coordinates · model grid</text><text x="84" y="339" font-size="22" font-weight="400" text-anchor="start" fill="#173d59">Actual output timestamps</text><text x="84" y="377" font-size="22" font-weight="400" text-anchor="start" fill="#173d59">Variable names · units</text><rect x="630" y="210" width="510" height="260" rx="16" fill="#ecf6f3" stroke="#aac7d7" stroke-width="2"/><text x="654" y="256" font-size="24" font-weight="700" text-anchor="start" fill="#173d59">Flood output</text><text x="654" y="301" font-size="22" font-weight="400" text-anchor="start" fill="#173d59">Coordinates · flood grid</text><text x="654" y="339" font-size="22" font-weight="400" text-anchor="start" fill="#173d59">May use a different interval</text><text x="654" y="377" font-size="22" font-weight="400" text-anchor="start" fill="#173d59">Available hydraulic variables</text><path d="M315 482V522H600V550" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M885 482V522H610" fill="none" stroke="#247eaa" stroke-width="3"/><text x="600" y="601" font-size="28" font-weight="600" text-anchor="middle" fill="#173d59">Align location/time → check variables/units → compare</text>
