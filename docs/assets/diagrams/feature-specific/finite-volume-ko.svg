<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">경계 유량을 공유하면 내부 교환은 상쇄</title><desc id="desc">유한체적의 보존 원리 · 그림의 수심과 화살표 크기는 설명용입니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker><pattern id="missing" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3 3-3 M0 12 12 0 M9 15 15 9" stroke="#b2bdc5" stroke-width="2"/></pattern></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">경계 유량을 공유하면 내부 교환은 상쇄</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">유한체적의 보존 원리 · 그림의 수심과 화살표 크기는 설명용입니다.</text>
<rect x="60" y="190" width="1080" height="340" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><rect x="190" y="295" width="280" height="165" rx="0" fill="#bee0ee" stroke="#bee0ee" stroke-width="2"/><line x1="190" y1="295" x2="470" y2="295" stroke="#247eaa" stroke-width="3"/><text x="330" y="236" font-size="26" font-weight="700" text-anchor="middle" fill="#173d59">i − 1</text><text x="330" y="410" font-size="32" font-weight="700" text-anchor="middle" fill="#173d59">Vᵢ₋₁</text><rect x="470" y="320" width="280" height="140" rx="0" fill="#bee0ee" stroke="#bee0ee" stroke-width="2"/><line x1="470" y1="320" x2="750" y2="320" stroke="#247eaa" stroke-width="3"/><text x="610" y="236" font-size="26" font-weight="700" text-anchor="middle" fill="#173d59">i</text><text x="610" y="410" font-size="32" font-weight="700" text-anchor="middle" fill="#173d59">Vᵢ</text><rect x="750" y="342" width="280" height="118" rx="0" fill="#bee0ee" stroke="#bee0ee" stroke-width="2"/><line x1="750" y1="342" x2="1030" y2="342" stroke="#247eaa" stroke-width="3"/><text x="890" y="236" font-size="26" font-weight="700" text-anchor="middle" fill="#173d59">i + 1</text><text x="890" y="410" font-size="32" font-weight="700" text-anchor="middle" fill="#173d59">Vᵢ₊₁</text><path d="M190 460H1030V477H190Z" fill="#ddcbb4"/><line x1="190" y1="253" x2="190" y2="477" stroke="#607f94" stroke-width="3" stroke-dasharray="7 6"/><line x1="470" y1="253" x2="470" y2="477" stroke="#607f94" stroke-width="3" stroke-dasharray="7 6"/><line x1="750" y1="253" x2="750" y2="477" stroke="#607f94" stroke-width="3" stroke-dasharray="7 6"/><line x1="1030" y1="253" x2="1030" y2="477" stroke="#607f94" stroke-width="3" stroke-dasharray="7 6"/><line x1="420" y1="280" x2="520" y2="280" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="470" y="263" font-size="24" font-weight="600" text-anchor="middle" fill="#173d59">Qᵢ₋½</text><line x1="700" y1="303" x2="800" y2="303" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="750" y="283" font-size="24" font-weight="600" text-anchor="middle" fill="#173d59">Qᵢ₊½</text><text x="330" y="508" font-size="25" font-weight="600" text-anchor="middle" fill="#173d59">−Qᵢ₋½</text><text x="610" y="508" font-size="25" font-weight="600" text-anchor="middle" fill="#173d59">+Qᵢ₋½ − Qᵢ₊½</text><text x="890" y="508" font-size="25" font-weight="600" text-anchor="middle" fill="#173d59">+Qᵢ₊½</text><text x="600" y="576" font-size="28" font-weight="600" text-anchor="middle" fill="#173d59">각 셀: 저장 변화 = 시간간격 × 순유입량</text><text x="600" y="625" font-size="24" font-weight="500" text-anchor="middle" fill="#173d59">전체 합계에는 외부 경계·소스·손실만 남습니다.</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
</g></svg>
