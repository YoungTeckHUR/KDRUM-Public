<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">교환량은 하나, 회계는 두 영역</title><desc id="desc">ΔV는 같은 시간 구간의 교환 체적입니다. 부호는 각 영역의 증감입니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker><pattern id="missing" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3 3-3 M0 12 12 0 M9 15 15 9" stroke="#b2bdc5" stroke-width="2"/></pattern></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">교환량은 하나, 회계는 두 영역</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">ΔV는 같은 시간 구간의 교환 체적입니다. 부호는 각 영역의 증감입니다.</text>
<rect x="60" y="205" width="340" height="120" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="84" y="251" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">1D 하천</text><rect x="800" y="205" width="340" height="120" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="824" y="251" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">2D 범람원</text><line x1="420" y1="240" x2="780" y2="240" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="220" font-size="23" font-weight="600" text-anchor="middle" fill="#173d59">월류 ΔV</text><line x1="780" y1="298" x2="420" y2="298" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="337" font-size="23" font-weight="600" text-anchor="middle" fill="#173d59">복귀 ΔV</text><text x="95" y="405" font-size="26" font-weight="700" text-anchor="start" fill="#173d59">교환 방향</text><text x="450" y="405" font-size="26" font-weight="700" text-anchor="start" fill="#173d59">하천 회계</text><text x="810" y="405" font-size="26" font-weight="700" text-anchor="start" fill="#173d59">범람원 회계</text><text x="95" y="473" font-size="28" font-weight="400" text-anchor="start" fill="#173d59">월류</text><text x="450" y="473" font-size="28" font-weight="400" text-anchor="start" fill="#173d59">−ΔV</text><text x="810" y="473" font-size="28" font-weight="400" text-anchor="start" fill="#173d59">+ΔV</text><text x="95" y="541" font-size="28" font-weight="400" text-anchor="start" fill="#173d59">복귀</text><text x="450" y="541" font-size="28" font-weight="400" text-anchor="start" fill="#173d59">+ΔV</text><text x="810" y="541" font-size="28" font-weight="400" text-anchor="start" fill="#173d59">−ΔV</text><line x1="60" y1="425" x2="1140" y2="425" stroke="#aac7d7" stroke-width="3"/><text x="600" y="614" font-size="25" font-weight="500" text-anchor="middle" fill="#173d59">동일 기간·교환량을 비교 · 전체 유역 물수지와 별도 진단</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
</g></svg>
