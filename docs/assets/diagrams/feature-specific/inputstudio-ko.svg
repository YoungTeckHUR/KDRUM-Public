<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">원자료를 실행 입력으로 준비하기</title><desc id="desc">입력 프로젝트의 구성·검사 역할 · 결과 분석은 Viewer에서 수행합니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker><pattern id="missing" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3 3-3 M0 12 12 0 M9 15 15 9" stroke="#b2bdc5" stroke-width="2"/></pattern></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">원자료를 실행 입력으로 준비하기</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">입력 프로젝트의 구성·검사 역할 · 결과 분석은 Viewer에서 수행합니다.</text>
<rect x="60" y="200" width="350" height="115" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="84" y="246" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">공간 자료</text><text x="84" y="291" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">지형 · 하천 · 단면</text><rect x="60" y="350" width="350" height="115" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="84" y="396" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">시간 자료·조건</text><text x="84" y="441" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">강우 · 모의조건</text><path d="M423 260H462V315H495" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M423 409H462V365H495" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="510" y="245" width="290" height="205" rx="16" fill="#ecf6f3" stroke="#aac7d7" stroke-width="2"/><text x="534" y="291" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">프로젝트</text><text x="534" y="336" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">자료 연결·편집</text><text x="534" y="374" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">정합성 점검</text><line x1="815" y1="343" x2="864" y2="343" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="880" y="245" width="260" height="205" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="904" y="291" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">K-DRUM 입력</text><text x="904" y="336" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">모의 준비</text><text x="904" y="374" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">조건 재확인</text><text x="600" y="590" font-size="23" font-weight="500" text-anchor="middle" fill="#173d59">원자료 변경 시 연결 자료와 좌표·시간 기준을 다시 점검</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
</g></svg>
