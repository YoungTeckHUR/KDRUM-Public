<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">공간입력에서 K-DRUM 실행입력까지</title><desc id="desc">공간입력 구축, 단계별 프로젝트 점검, 저장과 입력자료 생성을 구분합니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker><pattern id="missing" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3 3-3 M0 12 12 0 M9 15 15 9" stroke="#b2bdc5" stroke-width="2"/></pattern></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">공간입력에서 K-DRUM 실행입력까지</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">공간입력 구축, 단계별 프로젝트 점검, 저장과 입력자료 생성을 구분합니다.</text>
<rect x="60" y="190" width="300" height="405" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="84" y="226" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">공간 자료</text><text x="84" y="252" font-size="18" font-weight="600" text-anchor="start" fill="#486171">원자료·공간입력 구축</text><rect x="84" y="270" width="252" height="52" rx="7" fill="#fff" stroke="#d4e1e8" stroke-width="2"/><text x="210" y="304" font-size="20" font-weight="600" text-anchor="middle" fill="#173d59">DEM → 유역·흐름방향</text><rect x="84" y="337" width="252" height="52" rx="7" fill="#fff" stroke="#d4e1e8" stroke-width="2"/><text x="210" y="371" font-size="20" font-weight="600" text-anchor="middle" fill="#173d59">하천망 → 계산격자</text><rect x="84" y="404" width="252" height="52" rx="7" fill="#fff" stroke="#d4e1e8" stroke-width="2"/><text x="210" y="438" font-size="20" font-weight="600" text-anchor="middle" fill="#173d59">토지피복·토양·토심</text><rect x="84" y="471" width="252" height="52" rx="7" fill="#fff" stroke="#d4e1e8" stroke-width="2"/><text x="210" y="505" font-size="20" font-weight="600" text-anchor="middle" fill="#173d59">강우·기상·검증·단면</text><text x="210" y="562" font-size="20" font-weight="600" text-anchor="middle" fill="#486171">검증된 공간산출물의 계보 확인</text><line x1="370" y1="392" x2="410" y2="392" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="425" y="190" width="365" height="405" rx="14" fill="#edf7f4" stroke="#83b9ae" stroke-width="2"/><text x="452" y="226" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">프로젝트</text><text x="452" y="252" font-size="18" font-weight="600" text-anchor="start" fill="#486171">단계별 구축·검증</text><rect x="452" y="261" width="70" height="50" rx="25" fill="#dceef8" stroke="#aac7d7" stroke-width="2"/><text x="487" y="294" font-size="18" font-weight="700" text-anchor="middle" fill="#173d59">01–03</text><text x="545" y="294" font-size="20" font-weight="600" text-anchor="start" fill="#173d59">공간격자·유출경로 · 강우</text><rect x="452" y="346" width="70" height="50" rx="25" fill="#dceef8" stroke="#aac7d7" stroke-width="2"/><text x="487" y="379" font-size="18" font-weight="700" text-anchor="middle" fill="#173d59">04–07</text><text x="545" y="379" font-size="20" font-weight="600" text-anchor="start" fill="#173d59">기상·검증·제어 · 구조물</text><rect x="452" y="419" width="70" height="50" rx="25" fill="#dceef8" stroke="#aac7d7" stroke-width="2"/><text x="487" y="452" font-size="18" font-weight="700" text-anchor="middle" fill="#173d59">08–10</text><text x="545" y="444" font-size="20" font-weight="600" text-anchor="start" fill="#173d59">DWNET · 2D/1D–2D</text><text x="545" y="472" font-size="18" font-weight="600" text-anchor="start" fill="#486171">최종점검</text><rect x="452" y="515" width="310" height="44" rx="7" fill="#fff6e7" stroke="#e6bf7d" stroke-width="2"/><text x="607" y="543" font-size="18" font-weight="700" text-anchor="middle" fill="#75470f">임시자료 ≠ 확정 물리자료</text><path d="M802 322H838V273H862" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M802 445H838V463H862" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="875" y="205" width="265" height="145" rx="12" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="900" y="247" font-size="25" font-weight="700" text-anchor="start" fill="#173d59">작업공간 저장</text><text x="900" y="288" font-size="20" font-weight="400" text-anchor="start" fill="#173d59">작성 상태 보존</text><text x="900" y="320" font-size="20" font-weight="400" text-anchor="start" fill="#173d59">엔진 입력은 유지</text><rect x="875" y="390" width="265" height="160" rx="12" fill="#e9f5ef" stroke="#83b9ae" stroke-width="2"/><text x="900" y="426" font-size="25" font-weight="700" text-anchor="start" fill="#173d59">K-DRUM 입력</text><text x="900" y="454" font-size="18" font-weight="600" text-anchor="start" fill="#486171">입력자료 생성</text><text x="900" y="487" font-size="19" font-weight="400" text-anchor="start" fill="#173d59">검증된 변경만 반영</text><text x="900" y="519" font-size="19" font-weight="400" text-anchor="start" fill="#173d59">실행 입력으로 생성</text><rect x="882" y="568" width="112" height="42" rx="21" fill="#fff" stroke="#aac7d7" stroke-width="2"/><text x="938" y="596" font-size="18" font-weight="700" text-anchor="middle" fill="#173d59">Base</text><rect x="1008" y="568" width="126" height="42" rx="21" fill="#fff" stroke="#aac7d7" stroke-width="2"/><text x="1071" y="596" font-size="18" font-weight="700" text-anchor="middle" fill="#173d59">Scenario</text><text x="600" y="642" font-size="22" font-weight="500" text-anchor="middle" fill="#173d59">Base와 시나리오를 분리해 의도치 않은 원본 변경을 방지</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
</g></svg>
