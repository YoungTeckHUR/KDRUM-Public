<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="read-results-en-title read-results-en-desc" lang="en"><title id="read-results-en-title">Reading results: hydrographs and water balance</title><desc id="read-results-en-desc">Illustrative observation and simulation curves are plotted against time in hours and discharge in cubic meters per second. A separate schematic lists rainfall, inflow, evapotranspiration, outflow, storage change and residual terms for water-balance review.</desc><defs><marker id="read-results-en-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#0077b6"/></marker><marker id="read-results-en-blue-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#0077b6"/></marker><marker id="read-results-en-teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#13878c"/></marker><marker id="read-results-en-teal-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#13878c"/></marker><marker id="read-results-en-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#b47013"/></marker><marker id="read-results-en-amber-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#b47013"/></marker></defs><g font-family="Pretendard, Noto Sans KR, Malgun Gothic, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="24" y="44" font-size="30" font-weight="700" fill="#15364f" text-anchor="start">Reading results: hydrographs and water balance</text><text x="24" y="83" font-size="19" font-weight="400" fill="#4d687c" text-anchor="start">Curves are illustrative only. They are not observed results or a performance assessment.</text><text x="24" y="133" font-size="21" font-weight="700" fill="#15364f" text-anchor="start">HYDROGRAPH</text><text x="620" y="133" font-size="21" font-weight="700" fill="#15364f" text-anchor="start">WATER-BALANCE TERMS</text><line x1="90" y1="422" x2="560" y2="422" stroke="#d7e2e8" stroke-width="1"/><text x="75" y="429" font-size="18" font-weight="400" fill="#4d687c" text-anchor="end">0</text><line x1="90" y1="359.75" x2="560" y2="359.75" stroke="#d7e2e8" stroke-width="1"/><text x="75" y="366.75" font-size="18" font-weight="400" fill="#4d687c" text-anchor="end">20</text><line x1="90" y1="297.5" x2="560" y2="297.5" stroke="#d7e2e8" stroke-width="1"/><text x="75" y="304.5" font-size="18" font-weight="400" fill="#4d687c" text-anchor="end">40</text><line x1="90" y1="235.25" x2="560" y2="235.25" stroke="#d7e2e8" stroke-width="1"/><text x="75" y="242.25" font-size="18" font-weight="400" fill="#4d687c" text-anchor="end">60</text><line x1="90" y1="173" x2="560" y2="173" stroke="#d7e2e8" stroke-width="1"/><text x="75" y="180" font-size="18" font-weight="400" fill="#4d687c" text-anchor="end">80</text><line x1="90" y1="422" x2="90" y2="429" stroke="#4d687c" stroke-width="1.5"/><text x="90" y="455" font-size="18" font-weight="400" fill="#4d687c" text-anchor="middle">0</text><line x1="207.5" y1="422" x2="207.5" y2="429" stroke="#4d687c" stroke-width="1.5"/><text x="207.5" y="455" font-size="18" font-weight="400" fill="#4d687c" text-anchor="middle">2</text><line x1="325" y1="422" x2="325" y2="429" stroke="#4d687c" stroke-width="1.5"/><text x="325" y="455" font-size="18" font-weight="400" fill="#4d687c" text-anchor="middle">4</text><line x1="442.5" y1="422" x2="442.5" y2="429" stroke="#4d687c" stroke-width="1.5"/><text x="442.5" y="455" font-size="18" font-weight="400" fill="#4d687c" text-anchor="middle">6</text><line x1="560" y1="422" x2="560" y2="429" stroke="#4d687c" stroke-width="1.5"/><text x="560" y="455" font-size="18" font-weight="400" fill="#4d687c" text-anchor="middle">8</text><line x1="90" y1="160" x2="90" y2="422" stroke="#15364f" stroke-width="2"/><line x1="90" y1="422" x2="568" y2="422" stroke="#15364f" stroke-width="2"/><text x="31" y="313" font-size="19" font-weight="400" fill="#15364f" text-anchor="middle" transform="rotate(-90 31 313)">Discharge (m³/s)</text><text x="329" y="491" font-size="20" font-weight="400" fill="#15364f" text-anchor="middle">Time (h)</text><path d="M90 406 C139 404 158 400 187 374 S229 262 267 204 S312 220 340 287 S391 356 433 381 S513 406 560 410" fill="none" stroke="#0077b6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 409 C145 407 165 406 190 383 S229 279 259 226 S295 200 323 264 S370 335 416 372 S500 407 560 412" fill="none" stroke="#13878c" stroke-width="3.5" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="90" cy="409" r="4.5" fill="#ffffff" stroke="#13878c" stroke-width="2"/><circle cx="190" cy="383" r="4.5" fill="#ffffff" stroke="#13878c" stroke-width="2"/><circle cx="259" cy="226" r="4.5" fill="#ffffff" stroke="#13878c" stroke-width="2"/><circle cx="323" cy="264" r="4.5" fill="#ffffff" stroke="#13878c" stroke-width="2"/><circle cx="416" cy="372" r="4.5" fill="#ffffff" stroke="#13878c" stroke-width="2"/><circle cx="560" cy="412" r="4.5" fill="#ffffff" stroke="#13878c" stroke-width="2"/><line x1="114" y1="530" x2="154" y2="530" stroke="#13878c" stroke-width="3" stroke-dasharray="6 6"/><circle cx="134" cy="530" r="4" fill="#ffffff" stroke="#13878c" stroke-width="2"/><text x="166" y="537" font-size="18" font-weight="400" fill="#15364f" text-anchor="start">Observation · illustrative</text><line x1="114" y1="565" x2="154" y2="565" stroke="#0077b6" stroke-width="4"/><text x="166" y="572" font-size="18" font-weight="400" fill="#15364f" text-anchor="start">Simulation · illustrative</text><line x1="595" y1="168" x2="595" y2="570" stroke="#bbccd8" stroke-width="2"/><rect x="630" y="173" width="292" height="164" rx="9" fill="#edf6fb" stroke="none" stroke-width="1.8"/><line x1="658" y1="158" x2="658" y2="192" stroke="#0077b6" stroke-width="3" marker-end="url(#read-results-en-blue-arrow)"/><text x="681" y="204" font-size="20" font-weight="400" fill="#15364f" text-anchor="start">P · rainfall</text><line x1="609" y1="250" x2="648" y2="250" stroke="#0077b6" stroke-width="3" marker-end="url(#read-results-en-blue-arrow)"/><text x="667" y="257" font-size="20" font-weight="400" fill="#15364f" text-anchor="start">Qin · inflow</text><text x="658" y="309" font-size="20" font-weight="700" fill="#15364f" text-anchor="start">ΔS · storage change</text><line x1="838" y1="190" x2="838" y2="152" stroke="#13878c" stroke-width="3" marker-end="url(#read-results-en-teal-arrow)"/><text x="856" y="185" font-size="20" font-weight="400" fill="#11695d" text-anchor="start">ET</text><line x1="882" y1="250" x2="940" y2="250" stroke="#13878c" stroke-width="3" marker-end="url(#read-results-en-teal-arrow)"/><text x="831" y="278" font-size="20" font-weight="400" fill="#11695d" text-anchor="start">Qout</text><text x="630" y="381" font-size="23" font-weight="700" fill="#15364f" text-anchor="start">P + Qin − ET − Qout</text><text x="630" y="418" font-size="23" font-weight="700" fill="#15364f" text-anchor="start">= ΔS + residual</text><text x="630" y="462" font-size="18" font-weight="400" fill="#4d687c" text-anchor="start">ET: evapotranspiration</text><text x="630" y="491" font-size="18" font-weight="400" fill="#4d687c" text-anchor="start">Qout: outflow · residual: closure error</text><text x="630" y="544" font-size="18" font-weight="400" fill="#4d687c" text-anchor="start">Compare totals over the same</text><text x="630" y="572" font-size="18" font-weight="400" fill="#4d687c" text-anchor="start">time window and in the same units.</text></g></svg>
