<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="river-floodplain-ko-title river-floodplain-ko-desc" lang="ko"><title id="river-floodplain-ko-title">하천과 범람원을 잇는 양방향 교환</title><desc id="river-floodplain-ko-desc">평면도에서 일차원 하천과 이차원 범람원 격자 사이의 양방향 교환을 표시한다. 단면도는 수위와 하안, 하도 및 범람원을 구분한다. 1D와 2D 수리는 개발 중이며 양방향 교환은 통제된 개발 검증 범위에서 확인되었다.</desc><defs><marker id="river-floodplain-ko-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#0077b6"/></marker><marker id="river-floodplain-ko-blue-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#0077b6"/></marker><marker id="river-floodplain-ko-teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#13878c"/></marker><marker id="river-floodplain-ko-teal-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#13878c"/></marker><marker id="river-floodplain-ko-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#b47013"/></marker><marker id="river-floodplain-ko-amber-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#b47013"/></marker></defs><g font-family="Pretendard, Noto Sans KR, Malgun Gothic, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="24" y="44" font-size="30" font-weight="700" fill="#15364f" text-anchor="start">하천과 범람원을 잇는 양방향 교환</text><text x="24" y="83" font-size="19" font-weight="400" fill="#4d687c" text-anchor="start">수리 확장 개발 개념도 · 1D 하천, 2D 범람원, 교환 방향을 구분합니다.</text><text x="24" y="141" font-size="21" font-