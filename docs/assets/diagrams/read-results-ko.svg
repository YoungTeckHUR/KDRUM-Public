0" font-weight="400" fill="#15364f" text-anchor="start">P · 강우</text><line x1="609" y1="250" x2="648" y2="250" stroke="#0077b6" stroke-width="3" marker-end="url(#read-results-ko-blue-arrow)"/><text x="667" y="257" font-size="20" font-weight="400" fill="#15364f" text-anchor="start">Qin · 유입</text><text x="658" y="309" font-size="20" font-weight="700" fill="#15364f" text-anchor="start">ΔS · 저류량 변화</text><line x1="838" y1="190" x2="838" y2="152" stroke="#13878c" stroke-width="3" marker-end="url(#read-results-ko-teal-arrow)"/><text x="856" y="185" font-size="20" font-weight="400" fill="#11695d" text-anchor="start">ET</text><line x1="882" y1="250" x2="940" y2="250" stroke="#13878c" stroke-width="3" marker-end="url(#read-results-ko-teal-arrow)"/><text x="831" y="278" font-size="20" font-weight="400" fill="#11695d" text-anchor="start">Qout</text><text x="630" y="381" font-size="23" font-weight="700" fill="#15364f" text-anchor="start">P + Qin − ET − Qout</text><text x="630" y="418" font-size="23" font-weight="700" fill="#15364f" text-anchor="start">= ΔS + residual</text><text x="630" y="462" font-size="18" font-weight="400" fill="#4d687c" text-anchor="start">ET: 증발산 · Qout: 유출</text><text x="630" y="491" font-size="18" font-weight="400" fill="#4d687c" text-anchor="start">residual: 물수지 잔차</text><text x="630" y="544" font-size="18" font-weight="400" fill="#4d687c" text-anchor="start">누적량 비교 기준:</text><text x="630" y="572" font-size="18" font-weight="400" fill="#4d687c" text-anchor="start">동일한 기간 · 동일한 단위</text></g></svg>
