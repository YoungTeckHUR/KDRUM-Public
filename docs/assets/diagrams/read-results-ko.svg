<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="read-results-ko-title read-results-ko-desc" lang="ko"><title id="read-results-ko-title">유량 시계열과 물수지</title><desc id="read-results-ko-desc">설명용 관측과 모의 유량 곡선을 시간 h와 유량 세제곱미터 매초 축 위에 나타낸다. 오른쪽에는 강우량, 유입, 증발산, 유출, 저류변화 및 잔차의 물수지 항목을 표시한다.</desc><defs><marker id="read-results-ko-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#0077b6"/></marker><marker id="read-results-ko-blue-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#0077b6"/></marker><marker id="read-results-ko-teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#13878c"/></marker><marker id="read-results-ko-teal-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#13878c"/></marker><marker id="read-results-ko-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#b47013"/></marker><marker id="read-results-ko-amber-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#b47013"/></marker></defs><g font-family="Pretendard, Noto Sans KR, Malgun Gothic, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="24" y="44" font-size="30" font-weight="700" fill="#15364f" text-anchor="start">유량 시계열과 물수지</text><text x="24" y="83" font-size="19" font-weight="400" fill="#4d687c" text-anchor="start">곡선은 설명용이며 실제 관측·모의 결과나 성능 평가가 아닙니다.</text><text x="24" y="133" font-size="21" font-weight="700" fill="#15364f" text-anchor="start">유량 시계열</text><text x="620" y="133" fon