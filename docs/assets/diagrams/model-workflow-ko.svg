<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="model-workflow-ko-title model-workflow-ko-desc" lang="ko"><title id="model-workflow-ko-title">유역 입력에서 수문·수리 결과까지</title><desc id="model-workflow-ko-desc">강우, 지형·토양 및 초기상태를 입력하여 격자 분포형 수문 및 운동파 유출 계산을 수행한다. 수문 출력은 기반 모형에서 직접 산출하며, 1차원 하천 및 2차원 범람 확장은 개발 중인 별도 경로이다.</desc><defs><marker id="model-workflow-ko-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#0077b6"/></marker><marker id="model-workflow-ko-blue-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#0077b6"/></marker><marker id="model-workflow-ko-teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#13878c"/></marker><marker id="model-workflow-ko-teal-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#13878c"/></marker><marker id="model-workflow-ko-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#b47013"/></marker><marker id="model-workflow-ko-amber-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#b47013"/></marker></defs><g font-family="Pretendard, Noto Sans KR, Malgun Gothic, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="24" y="44" font-size="30" font-weight="700" fill="#15364f" text-anchor="start">유역 입력에서 수문·수리 결과까지</text><text x="24" y="83" font-size="19" font-weight="400" fill="#4d687c" text-anchor="start">검증된 수문 기반과 개발 중인 수리 확장을 구분합니다.</text><text x="24" y="144" font-size="20" font-weight="700" fill="#15364f" text-anchor="start">입력 자료</text><text x="228" y="144" font-size="20" font-weight="700" fill="#15364f" text-anchor="start">기반 수문 모형</text><text x="517" y="144" font-size="20" font-weight="700" fill="#885112" text-anchor="start">수리 확장</text><text x="772" y="144" font-size="20" font-weight="700" fill="#15364f" text-anchor="start">출력</text><rect x="24" y="177" width="167" height="82" rx="9" fill="#edf6fb" stroke="none" stroke-width="1.8"/><text x="39" y="208" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">강우</text><text x="39" y="237" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">관측소 · 레이더</text><rect x="24" y="280" width="167" height="82" rx="9" fill="#edf6fb" stroke="none" stroke-width="1.8"/><text x="39" y="311" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">지형 · 토양</text><text x="39" y="340" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">격자 · 하천망</text><rect x="24" y="383" width="167" height="82" rx="9" fill="#edf6fb" stroke="none" stroke-width="1.8"/><text x="39" y="414" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">모형 설정</text><text x="39" y="443" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">매개변수 · 초기상태</text><line x1="201" y1="218" x2="201" y2="424" stroke="#0077b6" stroke-width="2"/><line x1="191" y1="218" x2="201" y2="218" stroke="#0077b6" stroke-width="2"/><line x1="191" y1="321" x2="201" y2="321" stroke="#0077b6" stroke-width="2"/><line x1="191" y1="424" x2="201" y2="424" stroke="#0077b6" stroke-width="2"/><line x1="201" y1="321" x2="220" y2="321" stroke="#0077b6" stroke-width="3" marker-end="url(#model-workflow-ko-blue-arrow)"/><rect x="228" y="177" width="252" height="288" rx="9" fill="#e8f6f3" stroke="none" stroke-width="1.8"/><rect x="244" y="192" width="132" height="29" rx="4" fill="#13878c" stroke="none" stroke-width="1.8"/><text x="254" y="213" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">확립된 기능</text><text x="248" y="254" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">격자 분포형 강우–유출</text><text x="248" y="283" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">침투 · 증발산</text><text x="248" y="312" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">토양수분 저류</text><line x1="354" y1="327" x2="354" y2="342" stroke="#13878c" stroke-width="3" marker-end="url(#model-workflow-ko-teal-arrow)"/><text x="248" y="367" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">운동파 흐름 추적</text><text x="248" y="397" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">사면 유출 · 하도 유량</text><line x1="482" y1="357" x2="509" y2="357" stroke="#b47013" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#model-workflow-ko-amber-arrow)"/><rect x="517" y="254" width="218" height="211" rx="9" fill="#fff5e2" stroke="#e2ba7b" stroke-width="1.8" stroke-dasharray="7 6"/><text x="535" y="286" font-size="18" font-weight="700" fill="#885112" text-anchor="start">개발 중</text><text x="535" y="329" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">1D 하천 수리</text><text x="535" y="374" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">↕ 양방향 교환</text><text x="535" y="419" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">2D 범람 해석</text><rect x="772" y="177" width="164" height="108" rx="9" fill="#edf6fb" stroke="none" stroke-width="1.8"/><text x="788" y="213" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">유출 시계열</text><text x="788" y="246" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">수문 상태</text><rect x="772" y="357" width="164" height="108" rx="9" fill="#fff5e2" stroke="none" stroke-width="1.8"/><text x="788" y="393" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">하천 수위</text><text x="788" y="426" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">침수 범위·수심</text><path d="M480 218 H758" fill="none" stroke="#13878c" stroke-width="3" marker-end="url(#model-workflow-ko-teal-arrow)" stroke-linecap="round" stroke-linejoin="round"/><line x1="735" y1="411" x2="760" y2="411" stroke="#b47013" stroke-width="3" marker-end="url(#model-workflow-ko-amber-arrow)"/><text x="500" y="200" font-size="18" font-weight="400" fill="#11695d" text-anchor="start">기반 모형 직접 출력</text><line x1="24" y1="510" x2="936" y2="510" stroke="#bbccd8" stroke-width="2"/><circle cx="34" cy="545" r="5" fill="#13878c" stroke="none" stroke-width="2"/><text x="49" y="552" font-size="18" font-weight="400" fill="#4d687c" text-anchor="start">수문·운동파 기반: 확립된 기능</text><circle cx="535" cy="545" r="5" fill="#b47013" stroke="none" stroke-width="2"/><text x="550" y="552" font-size="18" font-weight="400" fill="#4d687c" text-anchor="start">수리 확장: 개발·검증 단계</text></g></svg>
