fff6e7" stroke="#e6bf7d" stroke-width="2"/><text x="900" y="274" font-size="17" font-weight="700" text-anchor="middle" fill="#75470f">폭평균 · 정수압 가정</text><text x="900" y="299" font-size="15" font-weight="600" text-anchor="middle" fill="#75470f">평면 범람해석과 좌표계가 다름</text><text x="600" y="625" font-size="17" font-weight="600" text-anchor="middle" fill="#173d59">Estuary2DV는 K-DRUM 기본 계산엔진과 분리된 실험적 하구 수리동역학·염분 연구모형입니다.</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
