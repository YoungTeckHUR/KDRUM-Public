 stroke-linecap="round"/><path d="M920 438 Q985 402 1055 438 Q985 458 920 438Z" fill="#d6b47a" stroke="#a98f6a" stroke-width="2"/><text x="987" y="475" font-size="18" font-weight="700" text-anchor="middle" fill="#75470f">Potential deposition reach</text><text x="987" y="510" font-size="16" font-weight="500" text-anchor="middle" fill="#486171">Remaining load continues downstream</text><text x="600" y="620" font-size="17" font-weight="600" text-anchor="middle" fill="#173d59">Separate hillslope sediment generation from river transport while showing their connected pathway.</text>
