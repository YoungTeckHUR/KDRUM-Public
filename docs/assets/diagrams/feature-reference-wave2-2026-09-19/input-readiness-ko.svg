<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">입력자료와 실행 준비 점검</title><desc id="desc">입력 조건을 확인하고 문제 항목을 실행 전에 정리합니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker><pattern id="missing" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3 3-3 M0 12 12 0 M9 15 15 9" stroke="#b2bdc5" stroke-width="2"/></pattern></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">입력자료와 실행 준비 점검</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">입력 조건을 확인하고 문제 항목을 실행 전에 정리합니다.</text>
<rect x="60" y="218" width="310" height="236" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="84" y="264" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">원자료</text><text x="84" y="309" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">지형 · 강우 · 하천</text><text x="84" y="347" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">좌표 · 시간 · 단위</text><line x1="380" y1="330" x2="425" y2="330" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="440" y="218" width="310" height="236" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="464" y="264" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">정합성 검사</text><text x="464" y="309" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">공간 · 시간 범위</text><text x="464" y="347" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">연결성 · 값의 범위</text><line x1="760" y1="330" x2="805" y2="330" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="820" y="218" width="320" height="236" rx="16" fill="#ecf6f3" stroke="#aac7d7" stroke-width="2"/><text x="844" y="264" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">점검 결과</text><text x="844" y="309" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">문제 항목과 경고</text><text x="844" y="347" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">실행 준비 상태</text><text x="600" y="560" font-size="25" font-weight="500" text-anchor="middle" fill="#173d59">점검 범위와 개발 상태는 각 기능 설명에 따릅니다.</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
</g></svg>
