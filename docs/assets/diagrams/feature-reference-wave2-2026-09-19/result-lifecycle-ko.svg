<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">실행 기록과 출력 무결성</title><desc id="desc">결과의 생성 조건과 결과 분석 준비 상태를 함께 확인합니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker><pattern id="missing" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3 3-3 M0 12 12 0 M9 15 15 9" stroke="#b2bdc5" stroke-width="2"/></pattern></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">실행 기록과 출력 무결성</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">결과의 생성 조건과 결과 분석 준비 상태를 함께 확인합니다.</text>
<rect x="60" y="218" width="310" height="220" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="84" y="264" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">실행 조건 기록</text><text x="84" y="309" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">입력 · 실행방식</text><text x="84" y="347" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">초기상태</text><text x="84" y="385" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">진단 · 경고</text><text x="84" y="423" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">계산시간</text><line x1="384" y1="325" x2="425" y2="325" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="440" y="218" width="310" height="220" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="464" y="264" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">결과 파일 생성</text><text x="464" y="309" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">NetCDF · 리포트</text><text x="464" y="347" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">생성과 정상 종료</text><line x1="764" y1="325" x2="805" y2="325" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="820" y="218" width="320" height="220" rx="16" fill="#ecf6f3" stroke="#aac7d7" stroke-width="2"/><text x="844" y="264" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">출력 요건 점검</text><text x="844" y="309" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">정의된 출력 요건</text><text x="844" y="347" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">실행 오류상태</text><path d="M980 452V496H600V529" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="574" font-size="30" font-weight="700" text-anchor="middle" fill="#173d59">후처리 · 결과 분석 도구</text><text x="600" y="618" font-size="22" font-weight="400" text-anchor="middle" fill="#173d59">출력 점검과 수문·수리 결과 타당성 평가는 별도 항목입니다.</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
</g></svg>
