<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">DEM에서 수리해석용 ChannelBed 지형까지</title><desc id="desc">DEM·중심선·추가 단면이 제공하는 범위에서 저수로와 하상을 보완하고 높이 기준과 연결성을 확인합니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">DEM에서 수리해석용 ChannelBed 지형까지</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">DEM·중심선·추가 단면이 제공하는 범위에서 저수로와 하상을 보완하고 높이 기준과 연결성을 확인합니다.</text>
<rect x="60" y="195" width="310" height="385" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="86" y="235" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">1 · 표면 지형</text><text x="86" y="266" font-size="16" font-weight="600" text-anchor="start" fill="#486171">DEM의 저수로 표현 한계</text><path d="M90 365 L145 335 L205 355 L265 345 L340 365" fill="none" stroke="#8a795f" stroke-width="5"/><line x1="115" y1="335" x2="320" y2="335" stroke="#78bfdc" stroke-width="3"/><text x="215" y="320" font-size="16" font-weight="600" text-anchor="middle" fill="#247eaa">수면 예시</text><text x="86" y="430" font-size="19" font-weight="700" text-anchor="start" fill="#173d59">확인</text><text x="86" y="458" font-size="16" font-weight="500" text-anchor="start" fill="#486171">하상·저수로 형상과 높이 기준</text><rect x="445" y="195" width="310" height="385" rx="14" fill="#f8fbfc" stroke="#aac7d7" stroke-width="2"/><text x="471" y="235" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">2 · 보완 자료</text><text x="471" y="266" font-size="17" font-weight="600" text-anchor="start" fill="#486171">DEM · 중심선 · 추가 단면</text><line x1="490" y1="330" x2="700" y2="330" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="595" y="312" font-size="17" font-weight="700" text-anchor="middle" fill="#173d59">하천 중심선</text><rect x="500" y="360" width="205" height="45" rx="6" fill="#fff" stroke="#d4e1e8" stroke-width="2"/><text x="520" y="389" font-size="17" font-weight="700" text-anchor="start" fill="#173d59">XS-01</text><text x="585" y="389" font-size="15" font-weight="500" text-anchor="start" fill="#173d59">단면·하상 정보</text><rect x="500" y="425" width="205" height="45" rx="6" fill="#fff" stroke="#d4e1e8" stroke-width="2"/><text x="520" y="454" font-size="17" font-weight="700" text-anchor="start" fill="#173d59">XS-02</text><text x="585" y="454" font-size="15" font-weight="500" text-anchor="start" fill="#173d59">단면·하상 정보</text><rect x="500" y="490" width="205" height="45" rx="6" fill="#fff" stroke="#d4e1e8" stroke-width="2"/><text x="520" y="519" font-size="17" font-weight="700" text-anchor="start" fill="#173d59">XS-03</text><text x="585" y="519" font-size="15" font-weight="500" text-anchor="start" fill="#173d59">단면·하상 정보</text><text x="471" y="555" font-size="16" font-weight="500" text-anchor="start" fill="#486171">원자료 범위 안에서 보완</text><path d="M375 385H435" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M760 385H820" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="830" y="195" width="310" height="385" rx="14" fill="#f4faf6" stroke="#aac7d7" stroke-width="2"/><text x="856" y="235" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">3 · 수리 지형</text><text x="856" y="266" font-size="17" font-weight="600" text-anchor="start" fill="#486171">주변 지형과 연결된 저수로·하상</text><path d="M860 365 L915 335 L955 355 L985 420 L1015 355 L1060 345 L1110 365" fill="none" stroke="#8a795f" stroke-width="5"/><line x1="885" y1="335" x2="1088" y2="335" stroke="#78bfdc" stroke-width="3"/><text x="986" y="320" font-size="16" font-weight="600" text-anchor="middle" fill="#247eaa">수면 예시</text><text x="856" y="455" font-size="19" font-weight="700" text-anchor="start" fill="#173d59">최종 확인</text><text x="856" y="484" font-size="16" font-weight="500" text-anchor="start" fill="#486171">높이 기준 · 주변 연결성</text><text x="856" y="512" font-size="16" font-weight="500" text-anchor="start" fill="#486171">1D/2D 수리입력으로 사용</text><text x="600" y="628" font-size="18" font-weight="600" text-anchor="middle" fill="#173d59">보완 지형은 측량 원자료와 구분하고, 추가 자료가 없는 형상을 임의로 생성하지 않음</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
</g></svg>
