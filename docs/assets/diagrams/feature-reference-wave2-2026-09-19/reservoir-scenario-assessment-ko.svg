<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">예측 기반 저수지 운영대안 비교</title><desc id="desc">같은 예측조건에서 여러 방류대안의 저수지·하류 영향을 비교합니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker><pattern id="missing" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3 3-3 M0 12 12 0 M9 15 15 9" stroke="#b2bdc5" stroke-width="2"/></pattern></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">예측 기반 저수지 운영대안 비교</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">같은 예측조건에서 여러 방류대안의 저수지·하류 영향을 비교합니다.</text>
<rect x="60" y="205" width="285" height="365" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="86" y="245" font-size="25" font-weight="700" text-anchor="start" fill="#173d59">예측 유입·초기상태</text><rect x="95" y="305" width="215" height="82" rx="10" fill="#dceef8" stroke="#8bbbd0" stroke-width="2"/><text x="202" y="339" font-size="19" font-weight="700" text-anchor="middle" fill="#173d59">예측 유입계열</text><text x="202" y="368" font-size="17" font-weight="500" text-anchor="middle" fill="#486171">저수위·저류량</text><path d="M202 390V450" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="228" y="432" font-size="17" font-weight="600" text-anchor="start" fill="#11695d">공통 입력조건</text><rect x="95" y="462" width="215" height="66" rx="10" fill="#edf7f4" stroke="#83b9ae" stroke-width="2"/><text x="202" y="503" font-size="18" font-weight="700" text-anchor="middle" fill="#173d59">동일 기준으로 비교</text><line x1="360" y1="390" x2="400" y2="390" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="415" y="205" width="350" height="365" rx="14" fill="#fffaf0" stroke="#e6bf7d" stroke-width="2"/><text x="441" y="245" font-size="25" font-weight="700" text-anchor="start" fill="#173d59">운영대안 A / B / C</text><rect x="455" y="305" width="270" height="58" rx="8" fill="#fff" stroke="#d4e1e8" stroke-width="2"/><text x="478" y="341" font-size="18" font-weight="700" text-anchor="start" fill="#173d59">대안 A</text><line x1="570" y1="334" x2="685" y2="334" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="455" y="382" width="270" height="58" rx="8" fill="#e9f5ef" stroke="#d4e1e8" stroke-width="2"/><text x="478" y="418" font-size="18" font-weight="700" text-anchor="start" fill="#173d59">대안 B</text><line x1="570" y1="411" x2="685" y2="411" stroke="#328c79" stroke-width="3" marker-end="url(#arrow)"/><rect x="455" y="459" width="270" height="58" rx="8" fill="#fff" stroke="#d4e1e8" stroke-width="2"/><text x="478" y="495" font-size="18" font-weight="700" text-anchor="start" fill="#173d59">대안 C</text><line x1="570" y1="488" x2="685" y2="488" stroke="#b07a31" stroke-width="3" marker-end="url(#arrow)"/><text x="590" y="550" font-size="16" font-weight="600" text-anchor="middle" fill="#75470f">방류 시점·크기·구조물 조합</text><line x1="780" y1="390" x2="820" y2="390" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="835" y="205" width="305" height="365" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="861" y="245" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">비교·검토</text><rect x="870" y="302" width="235" height="155" rx="10" fill="#edf7f4" stroke="#83b9ae" stroke-width="2"/><text x="987" y="336" font-size="18" font-weight="700" text-anchor="middle" fill="#173d59">저수지 수위·저류</text><text x="987" y="369" font-size="17" font-weight="500" text-anchor="middle" fill="#486171">방류량·시점</text><text x="987" y="401" font-size="17" font-weight="500" text-anchor="middle" fill="#486171">하류 제약조건</text><text x="987" y="432" font-size="17" font-weight="500" text-anchor="middle" fill="#486171">물수지·운영한계</text><rect x="870" y="475" width="235" height="55" rx="8" fill="#fff6e7" stroke="#e6bf7d" stroke-width="2"/><text x="987" y="509" font-size="17" font-weight="700" text-anchor="middle" fill="#75470f">운영자가 대안을 비교</text><text x="600" y="620" font-size="17" font-weight="600" text-anchor="middle" fill="#173d59">예측은 대안 비교의 입력이며, 그림은 자동 의사결정이나 실제 방류량을 의미하지 않습니다.</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
</g></svg>
