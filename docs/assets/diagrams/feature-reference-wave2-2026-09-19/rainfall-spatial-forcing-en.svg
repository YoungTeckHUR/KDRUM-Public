<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Preparing spatial rainfall forcing</title><desc id="desc">Prepare rainfall sources as cell-based forcing with consistent space and time references. Concept schematic · not calculated values or a software screenshot.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" fill="#607f94">VISUAL CONCEPT</text>
<text x="60" y="97" font-size="40" font-weight="700" fill="#173d59">Preparing spatial rainfall forcing</text>
<text x="60" y="142" font-size="23" fill="#526d7e">Prepare rainfall sources as cell-based forcing with consistent space and time references.</text>

<rect x="60" y="195" width="330" height="405" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="86" y="235" font-size="29" font-weight="700" fill="#173d59">Rainfall sources</text>
