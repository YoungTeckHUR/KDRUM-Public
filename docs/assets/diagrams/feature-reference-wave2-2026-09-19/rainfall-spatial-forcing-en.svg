<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">From rainfall observations to model-cell forcing</title><desc id="desc">Align spatial and temporal references and connect each rainfall source to model-cell forcing. Concept schematic · not calculated values or a software screenshot.</desc>
