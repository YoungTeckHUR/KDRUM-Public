<text x="1004" y="530" text-anchor="middle" font-size="21" font-weight="700" fill="#173d59">Rainfall by cell</text><text x="1004" y="560" text-anchor="middle" font-size="17" fill="#486171">Read actual values from inputs</text>
<text x="600" y="630" text-anchor="middle" font-size="19" font-weight="600" fill="#173d59">Station mapping uses IDW; radar/gridded fields are aligned spatially to model cells</text>
