<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">유역 물수지와 폐합오차</title><desc id="desc">같은 공간·시간 범위의 유입, 유출과 저장량 변화를 집계합니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker><pattern id="missing" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3 3-3 M0 12 12 0 M9 15 15 9" stroke="#b2bdc5" stroke-width="2"/></pattern></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">유역 물수지와 폐합오차</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">같은 공간·시간 범위의 유입, 유출과 저장량 변화를 집계합니다.</text>
<rect x="395" y="241" width="410" height="240" rx="16" fill="#edf7f4" stroke="#50a69b" stroke-width="2"/><text x="600" y="291" font-size="28" font-weight="700" text-anchor="middle" fill="#173d59">평가 대상 유역</text><text x="600" y="354" font-size="29" font-weight="700" text-anchor="middle" fill="#173d59">저장량 변화</text><text x="600" y="402" font-size="38" font-weight="600" text-anchor="middle" fill="#173d59">ΔS</text><text x="62" y="271" font-size="25" font-weight="600" text-anchor="start" fill="#173d59">강우 · 외부 유입</text><line x1="85" y1="324" x2="380" y2="324" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="860" y="394" font-size="27" font-weight="600" text-anchor="start" fill="#173d59">유출</text><line x1="820" y1="352" x2="1120" y2="352" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><line x1="680" y1="230" x2="680" y2="185" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="720" y="203" font-size="25" font-weight="600" text-anchor="start" fill="#173d59">증발산</text><text x="600" y="550" font-size="29" font-weight="700" text-anchor="middle" fill="#173d59">폐합오차 = 유입 − 유출 − 저장량 변화</text><text x="600" y="603" font-size="24" font-weight="400" text-anchor="middle" fill="#173d59">내부 이동은 유역 경계 통과량과 구분하여 추적합니다.</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
</g></svg>
