<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">목표지점 보정과 케이스 평가</title><desc id="desc">관측과 여러 매개변수 조합의 결과를 같은 조건에서 비교합니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker><pattern id="missing" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3 3-3 M0 12 12 0 M9 15 15 9" stroke="#b2bdc5" stroke-width="2"/></pattern></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">목표지점 보정과 케이스 평가</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">관측과 여러 매개변수 조합의 결과를 같은 조건에서 비교합니다.</text>
<rect x="60" y="215" width="300" height="149" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="84" y="261" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">관측유량</text><text x="84" y="306" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">대상 지점 · 평가 기간</text><rect x="60" y="400" width="300" height="149" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="84" y="446" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">매개변수 범위</text><text x="84" y="491" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">검토할 계산 케이스</text><path d="M374 287H403V333H430" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M374 472H403V377H430" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="440" y="268" width="300" height="210" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="464" y="314" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">반복 계산 · 비교</text><text x="464" y="359" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">동일한 목표지점</text><text x="464" y="397" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">케이스별 결과</text><line x1="754" y1="356" x2="805" y2="356" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="820" y="268" width="320" height="210" rx="16" fill="#ecf6f3" stroke="#aac7d7" stroke-width="2"/><text x="844" y="314" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">성능지표 평가</text><text x="844" y="359" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">NSE · KGE</text><text x="844" y="397" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">PBIAS · RMSE</text><text x="600" y="610" font-size="25" font-weight="400" text-anchor="middle" fill="#173d59">선정 결과의 적용 범위는 자료와 평가 조건에 따릅니다.</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
</g></svg>
