<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Warm-up and initial-state adjustment</title><desc id="desc">Initial-state adjustment is evaluated against the target discharge. Concept schematic · not calculated values or a software screenshot.</desc>
