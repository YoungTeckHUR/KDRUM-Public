<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">DEM과 수리해석용 ChannelBed</title><desc id="desc">DEM으로 부족한 수중 하상·저수로 형상을 추가 자료로 보완합니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" fill="#607f94">VISUAL CONCEPT</text>
<text x="60" y="97" font-size="40" font-weight="700" fill="#173d59">DEM과 수리해석용 ChannelBed</text>
<text x="60" y="142" font-size="23" fill="#526d7e">DEM으로 부족한 수중 하상·저수로 형상을 추가 자료로 보완합니다.</text>

<rect x="60" y="195" width="505" height="400" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="86" y="235" font-size="29" font-weight="700" fill="#173d59">원 지형자료</text><text x="86" y="263" font-size="18" font-weight="600" fill="#486171">DEM은 수면 아래 저수로를 충분히 표현하지 못할 수 있음</text>
<path d="M105 405 L190 370 L275 382 L360 360 L505 392" fill="none" stroke="#8ca3af" stroke-width="6"/><line x1="105" y1="405" x2="505" y2="405" stroke="#78bfdc" stroke-width="3"/><text x="310" y="432" text-anchor="middle" font-size="19" font-weight="700" fill="#486171">DEM 표면</text>
<path d="M185 405 L230 450 L275 495 L330 450 L375 405" fill="none" stroke="#967b59" stroke-width="5" stroke-dasharray="9 6"/><text x="280" y="520" text-anchor="middle" font-size="19" font-weight="600" fill="#75470f">수중 하상은 별도 자료가 필요</text>
<line x1="580" y1="392" x2="635" y2="392" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="650" y="195" width="490" height="400" rx="14" fill="#edf7f4" stroke="#83b9ae" stroke-width="2"/><text x="676" y="235" font-size="29" font-weight="700" fill="#173d59">ChannelBed 보완</text><text x="676" y="263" font-size="18" font-weight="600" fill="#486171">중심선·횡단면·높이 기준을 이용해 수리지형 구성</text>
<path d="M700 405 L785 370 L845 388 L895 472 L945 505 L995 472 L1045 388 L1100 405" fill="none" stroke="#967b59" stroke-width="6"/><line x1="700" y1="405" x2="1100" y2="405" stroke="#78bfdc" stroke-width="3"/><text x="900" y="438" text-anchor="middle" font-size="18" font-weight="600" fill="#247eaa">수면</text><text x="945" y="535" text-anchor="middle" font-size="20" font-weight="700" fill="#11695d">저수로·하상 보완</text>
<rect x="720" y="555" width="370" height="45" rx="8" fill="#fff6e7" stroke="#e6bf7d" stroke-width="2"/><text x="905" y="584" text-anchor="middle" font-size="17" font-weight="600" fill="#75470f">측량 원자료와 보완 지형을 구분</text>
<text x="600" y="630" text-anchor="middle" font-size="19" font-weight="600" fill="#173d59">목적: 1D/2D 수리해석에 사용할 하상·저수로 형상을 더 일관되게 준비</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/>
<text x="60" y="697" font-size="19" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
</g></svg>
