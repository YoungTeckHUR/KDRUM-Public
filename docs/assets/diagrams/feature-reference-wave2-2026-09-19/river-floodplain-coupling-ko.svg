<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">1D 하천과 2D 범람원의 양방향 연계</title><desc id="desc">상대 수위와 교환경계에 따라 월류 또는 복귀 흐름을 계산합니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
