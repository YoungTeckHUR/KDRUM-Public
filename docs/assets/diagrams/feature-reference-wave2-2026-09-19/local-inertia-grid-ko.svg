<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">2D Local Inertia 격자 계산 개념</title><desc id="desc">셀 수심 h와 격자면 단위폭 유량 q를 시간에 따라 갱신합니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">2D Local Inertia 격자 계산 개념</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">셀 수심 h와 격자면 단위폭 유량 q를 시간에 따라 갱신합니다.</text>
<rect x="60" y="195" width="510" height="410" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="86" y="235" font-size="29" font-weight="700" text-anchor="start" fill="#173d59">2D 계산격자</text><text x="86" y="262" font-size="18" font-weight="600" text-anchor="start" fill="#486171">셀 중심 수심 h · 격자면 유량 q</text><path d="M120 300h70v70h-70Z" fill="#edf4ef" stroke="#fff" stroke-width="2"/><path d="M192 300h70v70h-70Z" fill="#edf4ef" stroke="#fff" stroke-width="2"/><path d="M264 300h70v70h-70Z" fill="#edf4ef" stroke="#fff" stroke-width="2"/><path d="M336 300h70v70h-70Z" fill="#cde6ef" stroke="#fff" stroke-width="2"/><path d="M408 300h70v70h-70Z" fill="#cde6ef" stroke="#fff" stroke-width="2"/><path d="M120 372h70v70h-70Z" fill="#edf4ef" stroke="#fff" stroke-width="2"/><path d="M192 372h70v70h-70Z" fill="#edf4ef" stroke="#fff" stroke-width="2"/><path d="M264 372h70v70h-70Z" fill="#cde6ef" stroke="#fff" stroke-width="2"/><path d="M336 372h70v70h-70Z" fill="#cde6ef" stroke="#fff" stroke-width="2"/><path d="M408 372h70v70h-70Z" fill="#9bcde0" stroke="#fff" stroke-width="2"/><path d="M120 444h70v70h-70Z" fill="#edf4ef" stroke="#fff" stroke-width="2"/><path d="M192 444h70v70h-70Z" fill="#cde6ef" stroke="#fff" stroke-width="2"/><path d="M264 444h70v70h-70Z" fill="#cde6ef" stroke="#fff" stroke-width="2"/><path d="M336 444h70v70h-70Z" fill="#9bcde0" stroke="#fff" stroke-width="2"/><path d="M408 444h70v70h-70Z" fill="#9bcde0" stroke="#fff" stroke-width="2"/><path d="M120 516h70v70h-70Z" fill="#cde6ef" stroke="#fff" stroke-width="2"/><path d="M192 516h70v70h-70Z" fill="#cde6ef" stroke="#fff" stroke-width="2"/><path d="M264 516h70v70h-70Z" fill="#9bcde0" stroke="#fff" stroke-width="2"/><path d="M336 516h70v70h-70Z" fill="#9bcde0" stroke="#fff" stroke-width="2"/><path d="M408 516h70v70h-70Z" fill="#9bcde0" stroke="#fff" stroke-width="2"/><text x="300" y="418.8" font-size="22" font-weight="700" text-anchor="middle" fill="#173d59">수심 h</text><line x1="257" y1="408" x2="329" y2="408" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="300" y="395" font-size="17" font-weight="700" text-anchor="middle" fill="#173d59">격자면 유량 q</text><line x1="228" y1="437" x2="228" y2="509" stroke="#328c79" stroke-width="3" marker-end="url(#arrow)"/><text x="233.76" y="483.6" font-size="18" font-weight="700" text-anchor="start" fill="#11695d">q</text><text x="86" y="558" font-size="18" font-weight="500" text-anchor="start" fill="#486171">η = z + h 로 수면고를 구성</text><rect x="620" y="195" width="520" height="410" rx="14" fill="#f8fbfc" stroke="#aac7d7" stroke-width="2"/><text x="646" y="235" font-size="29" font-weight="700" text-anchor="start" fill="#173d59">시간단계 계산 흐름</text><rect x="650" y="285" width="460" height="72" rx="10" fill="#e8f3f9" stroke="#d4e1e8" stroke-width="2"/><text x="674" y="314" font-size="21" font-weight="700" text-anchor="start" fill="#173d59">1 · 수면고·지형</text><text x="674" y="341" font-size="17" font-weight="500" text-anchor="start" fill="#486171">인접 셀의 수면차 확인</text><path d="M880 361V373" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="650" y="377" width="460" height="72" rx="10" fill="#e9f5ef" stroke="#d4e1e8" stroke-width="2"/><text x="674" y="406" font-size="21" font-weight="700" text-anchor="start" fill="#173d59">2 · 격자면 유량 q</text><text x="674" y="433" font-size="17" font-weight="500" text-anchor="start" fill="#486171">국부관성·수면경사·마찰로 갱신</text><path d="M880 453V465" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="650" y="469" width="460" height="72" rx="10" fill="#fff6e7" stroke="#d4e1e8" stroke-width="2"/><text x="674" y="498" font-size="21" font-weight="700" text-anchor="start" fill="#173d59">3 · 수심 h 갱신</text><text x="674" y="525" font-size="17" font-weight="500" text-anchor="start" fill="#486171">유입 − 유출로 셀 저장량 갱신</text><text x="646" y="548" font-size="18" font-weight="600" text-anchor="start" fill="#75470f">이류가속도 생략</text><text x="646" y="572" font-size="18" font-weight="600" text-anchor="start" fill="#75470f">국부관성·수면경사·마찰 반영</text><text x="600" y="625" font-size="20" font-weight="600" text-anchor="middle" fill="#173d59">공간 격자에서 q를 먼저 갱신하고, 그 유입·유출로 h를 갱신하는 범람해석 개념</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
</g></svg>
