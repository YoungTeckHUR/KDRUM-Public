<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">A/B/C/D layers and the hydrologic role of D</title><desc id="desc">Within the existing multilayer structure, distinguish D-layer storage, delayed return and optional loss. Concept schematic · not calculated values or a software screenshot.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker><pattern id="missing" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3 3-3 M0 12 12 0 M9 15 15 9" stroke="#b2bdc5" stroke-width="2"/></pattern></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">A/B/C/D layers and the hydrologic role of D</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">Within the existing multilayer structure, distinguish D-layer storage, delayed return and optional loss.</text>
<rect x="60" y="195" width="500" height="400" rx="14" fill="#f8fbfc" stroke="#aac7d7" stroke-width="2"/><text x="86" y="235" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">Multi-layer unit-cell storage</text><rect x="95" y="270" width="300" height="58" rx="0" fill="#f1e2c8" stroke="#c7b18e" stroke-width="2"/><text x="118" y="307" font-size="25" font-weight="700" text-anchor="start" fill="#173d59">A layer</text><rect x="95" y="328" width="300" height="58" rx="0" fill="#e8d4b1" stroke="#c7b18e" stroke-width="2"/><text x="118" y="365" font-size="25" font-weight="700" text-anchor="start" fill="#173d59">B layer</text><rect x="95" y="386" width="300" height="70" rx="0" fill="#dcc39b" stroke="#c7b18e" stroke-width="2"/><text x="118" y="423" font-size="25" font-weight="700" text-anchor="start" fill="#173d59">C layer</text><rect x="95" y="456" width="300" height="105" rx="0" fill="#c7e3df" stroke="#c7b18e" stroke-width="2"/><text x="118" y="493" font-size="24" font-weight="700" text-anchor="start" fill="#173d59">D-layer storage</text><path d="M250 316V329" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M250 374V387" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M250 444V457" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="278" y="303" font-size="18" font-weight="600" text-anchor="start" fill="#486171">Percolation</text><rect x="455" y="310" width="70" height="145" rx="8" fill="#dceef8" stroke="#8bbbd0" stroke-width="2"/><text x="490" y="388" font-size="20" font-weight="700" text-anchor="middle" fill="#173d59">River</text><line x1="395" y1="299" x2="452" y2="330" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><line x1="395" y1="357" x2="452" y2="366" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><line x1="395" y1="421" x2="452" y2="405" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M370 520H425V430H390" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="245" y="535" font-size="18" font-weight="700" text-anchor="start" fill="#11695d">Delayed return</text><path d="M250 561V584" fill="none" stroke="#a36a2c" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="278" y="580" font-size="18" font-weight="600" text-anchor="start" fill="#75470f">Optional deep loss</text><rect x="615" y="205" width="525" height="120" rx="12" fill="#e9f5ef" stroke="#83b9ae" stroke-width="2"/><text x="642" y="243" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">D layer is an existing component</text><text x="642" y="278" font-size="19" font-weight="400" text-anchor="start" fill="#173d59">Groundwater storage in the multilayer structure</text><text x="642" y="307" font-size="18" font-weight="600" text-anchor="start" fill="#486171">Not a newly added layer</text><rect x="615" y="350" width="525" height="145" rx="12" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="642" y="390" font-size="26" font-weight="700" text-anchor="start" fill="#173d59">Upper soil-layer path</text><text x="642" y="420" font-size="18" font-weight="600" text-anchor="start" fill="#486171">Delayed return and runoff linkage</text><text x="642" y="449" font-size="19" font-weight="400" text-anchor="start" fill="#173d59">Update D storage and connect it to the upper runoff path</text><text x="642" y="477" font-size="19" font-weight="400" text-anchor="start" fill="#173d59">Separate storage, return and loss in the water balance</text><rect x="615" y="510" width="525" height="85" rx="12" fill="#fff6e7" stroke="#e6bf7d" stroke-width="2"/><text x="642" y="548" font-size="22" font-weight="700" text-anchor="start" fill="#75470f">Distinct from a full groundwater-flow model</text><text x="642" y="577" font-size="18" font-weight="500" text-anchor="start" fill="#75470f">Check feature-specific activation and scope</text><text x="600" y="640" font-size="22" font-weight="500" text-anchor="middle" fill="#173d59">Distinguish the existing D layer from long-term runoff extensions</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">Concept schematic · not calculated values or a software screenshot.</text>
