<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Watershed water balance</title><desc id="desc">Use the same spatial and temporal boundaries for all terms. Concept schematic · not calculated values or a software screenshot.</desc>
