<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">보존성 물질·염료 추적 경로</title><desc id="desc">상류에서 주입한 보존성 물질의 하류 이동과 지점별 확인 흐름을 보여줍니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker><pattern id="missing" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3 3-3 M0 12 12 0 M9 15 15 9" stroke="#b2bdc5" stroke-width="2"/></pattern></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">보존성 물질·염료 추적 경로</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">상류에서 주입한 보존성 물질의 하류 이동과 지점별 확인 흐름을 보여줍니다.</text>
<rect x="60" y="205" width="300" height="365" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="86" y="245" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">주입·초기조건</text><rect x="95" y="315" width="230" height="82" rx="10" fill="#e8f3f9" stroke="#aac7d7" stroke-width="2"/><text x="210" y="349" font-size="19" font-weight="700" text-anchor="middle" fill="#173d59">상류 주입 위치</text><text x="210" y="378" font-size="17" font-weight="500" text-anchor="middle" fill="#486171">시점·투입량 정의</text><path d="M210 400V455" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="236" y="438" font-size="17" font-weight="600" text-anchor="start" fill="#11695d">하천으로 입력</text><line x1="375" y1="390" x2="415" y2="390" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="205" width="330" height="365" rx="14" fill="#edf7f4" stroke="#83b9ae" stroke-width="2"/><text x="456" y="245" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">보존성 물질 이동</text><path d="M475 420 C540 360 625 360 715 425" fill="none" stroke="#78bfdc" stroke-width="32" stroke-linecap="round"/><path d="M500 401C565 360 630 370 690 412" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="595" y="330" font-size="18" font-weight="700" text-anchor="middle" fill="#11695d">흐름과 함께 하류 이동</text><rect x="495" y="460" width="200" height="52" rx="8" fill="#fff" stroke="#d4e1e8" stroke-width="2"/><text x="595" y="493" font-size="17" font-weight="700" text-anchor="middle" fill="#486171">반응·붕괴 없는 추적</text><line x1="775" y1="390" x2="815" y2="390" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="830" y="205" width="310" height="365" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="856" y="245" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">지점별 확인</text><line x1="885" y1="330" x2="1085" y2="330" stroke="#78bfdc" stroke-width="3"/><line x1="885" y1="415" x2="1085" y2="415" stroke="#78bfdc" stroke-width="3"/><circle cx="920" cy="330" r="9" fill="#fff" stroke="#247eaa" stroke-width="3"/><text x="920" y="365" font-size="16" font-weight="700" text-anchor="middle" fill="#173d59">P1</text><circle cx="985" cy="330" r="9" fill="#fff" stroke="#247eaa" stroke-width="3"/><text x="985" y="365" font-size="16" font-weight="700" text-anchor="middle" fill="#173d59">P2</text><circle cx="1050" cy="330" r="9" fill="#fff" stroke="#247eaa" stroke-width="3"/><text x="1050" y="365" font-size="16" font-weight="700" text-anchor="middle" fill="#173d59">P3</text><path d="M885 485 C920 485 930 450 955 450 S995 500 1025 490 S1060 465 1090 480" fill="none" stroke="#247eaa" stroke-width="4"/><text x="985" y="525" font-size="16" font-weight="600" text-anchor="middle" fill="#486171">농도·도달시간 시계열</text><text x="600" y="620" font-size="17" font-weight="600" text-anchor="middle" fill="#173d59">보존성 추적은 물질의 이동경로를 확인하는 기능이며, 반응성 수질과정 모듈과 구분합니다.</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
</g></svg>
