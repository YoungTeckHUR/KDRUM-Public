<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">수리구조물의 유량 연결</title><desc id="desc">월류와 게이트 통과 흐름을 구조물 형식·제원·수위조건에 따라 구분합니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" fill="#607f94">VISUAL CONCEPT</text>
<text x="60" y="97" font-size="40" font-weight="700" fill="#173d59">수리구조물의 유량 연결</text>
<text x="60" y="142" font-size="23" fill="#526d7e">월류와 게이트 통과 흐름을 구조물 형식·제원·수위조건에 따라 구분합니다.</text>

<rect x="60" y="195" width="510" height="410" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="86" y="235" font-size="29" font-weight="700" fill="#173d59">월류 구조물</text>
<line x1="100" y1="385" x2="520" y2="385" stroke="#78bfdc" stroke-width="3"/><rect x="285" y="360" width="95" height="125" rx="2" fill="#c7b18e" stroke="#967b59" stroke-width="2"/><text x="332" y="347" text-anchor="middle" font-size="19" font-weight="700" fill="#75470f">월류턱</text>
<path d="M185 340H275" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="176" y="322" font-size="18" font-weight="600" fill="#173d59">상류 수위</text><path d="M390 340H485" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="414" y="322" font-size="18" font-weight="700" fill="#11695d">월류 Q</text>
<text x="86" y="548" font-size="18" font-weight="600" fill="#486171">수위와 월류턱 높이의 관계로 유량 산정</text>
<rect x="630" y="195" width="510" height="410" rx="14" fill="#edf7f4" stroke="#83b9ae" stroke-width="2"/><text x="656" y="235" font-size="29" font-weight="700" fill="#173d59">게이트·개구부</text>
<line x1="670" y1="385" x2="1100" y2="385" stroke="#78bfdc" stroke-width="3"/><rect x="860" y="300" width="28" height="185" rx="2" fill="#967b59" stroke="#75470f" stroke-width="2"/><rect x="888" y="410" width="105" height="75" rx="2" fill="#fff" stroke="#967b59" stroke-width="2"/><text x="940" y="447" text-anchor="middle" font-size="18" font-weight="700" fill="#173d59">개구부</text>
<path d="M735 430H850" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="704" y="411" font-size="18" font-weight="600" fill="#173d59">상류 수위</text><path d="M1000 447H1080" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="1014" y="426" font-size="18" font-weight="700" fill="#11695d">통과 Q</text>
<text x="656" y="548" font-size="18" font-weight="600" fill="#486171">개도·제원·상하류 수위 조건을 함께 사용</text>
<text x="600" y="630" text-anchor="middle" font-size="19" font-weight="600" fill="#173d59">구조물 형식별 유량관계를 1D 하천수리 또는 2D 범람 계산과 연결</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/>
<text x="60" y="697" font-size="19" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
</g></svg>
