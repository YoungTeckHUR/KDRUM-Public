<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">연속모의와 상태 연속성</title><desc id="desc">강우가 없는 기간에도 저장상태를 이어 다음 강우 반응에 사용합니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker><pattern id="missing" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3 3-3 M0 12 12 0 M9 15 15 9" stroke="#b2bdc5" stroke-width="2"/></pattern></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">연속모의와 상태 연속성</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">강우가 없는 기간에도 저장상태를 이어 다음 강우 반응에 사용합니다.</text>
<rect x="60" y="205" width="320" height="365" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="86" y="245" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">강우사상 A</text><rect x="95" y="295" width="250" height="54" rx="8" fill="#dceef8" stroke="#8bbbd0" stroke-width="2"/><text x="220" y="329" font-size="19" font-weight="700" text-anchor="middle" fill="#173d59">강우·융설 입력</text><path d="M220 350V382" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="95" y="390" width="250" height="125" rx="10" fill="#e9f5ef" stroke="#83b9ae" stroke-width="2"/><text x="220" y="422" font-size="22" font-weight="700" text-anchor="middle" fill="#173d59">A/B/C/D 상태</text><text x="220" y="455" font-size="17" font-weight="500" text-anchor="middle" fill="#486171">토양수분·저장량 갱신</text><text x="220" y="484" font-size="17" font-weight="500" text-anchor="middle" fill="#486171">유출·기저유출 반응</text><line x1="390" y1="390" x2="425" y2="390" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="440" y="205" width="320" height="365" rx="14" fill="#fffaf0" stroke="#e6bf7d" stroke-width="2"/><text x="466" y="245" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">무강우·건기</text><path d="M600 300V265" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="625" y="286" font-size="18" font-weight="700" text-anchor="start" fill="#75470f">증발산</text><rect x="475" y="330" width="250" height="155" rx="10" fill="#edf7f4" stroke="#83b9ae" stroke-width="2"/><text x="600" y="366" font-size="21" font-weight="700" text-anchor="middle" fill="#173d59">상태는 계속 유지·갱신</text><text x="600" y="404" font-size="17" font-weight="500" text-anchor="middle" fill="#486171">저장량 감소·재분배</text><text x="600" y="435" font-size="17" font-weight="500" text-anchor="middle" fill="#486171">D층·지연유출 연속성</text><text x="600" y="466" font-size="17" font-weight="600" text-anchor="middle" fill="#11695d">다음 계산으로 전달</text><line x1="770" y1="390" x2="805" y2="390" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="820" y="205" width="320" height="365" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="846" y="245" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">강우사상 B</text><rect x="855" y="295" width="250" height="54" rx="8" fill="#dceef8" stroke="#8bbbd0" stroke-width="2"/><text x="980" y="329" font-size="19" font-weight="700" text-anchor="middle" fill="#173d59">새 강우 입력</text><path d="M980 350V382" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="855" y="390" width="250" height="125" rx="10" fill="#e9f5ef" stroke="#83b9ae" stroke-width="2"/><text x="980" y="422" font-size="21" font-weight="700" text-anchor="middle" fill="#173d59">이전 상태를 이어 계산</text><text x="980" y="455" font-size="16" font-weight="500" text-anchor="middle" fill="#486171">같은 강우라도 초기상태 영향</text><text x="980" y="484" font-size="17" font-weight="600" text-anchor="middle" fill="#11695d">연속 물수지 유지</text><text x="600" y="620" font-size="19" font-weight="600" text-anchor="middle" fill="#173d59">연속모의는 강우사상 사이의 저장상태를 끊지 않고 다음 시점으로 전달합니다.</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
</g></svg>
