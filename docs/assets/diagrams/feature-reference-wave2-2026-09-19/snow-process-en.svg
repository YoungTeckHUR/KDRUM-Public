<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">Snow storage and melt-factor adjustment</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">Partition precipitation and adjust melt empirically before hydrologic routing.</text>
<rect x="60" y="192" width="330" height="153" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="84" y="238" font-size="24" font-weight="700" text-anchor="start" fill="#173d59">Meteorological inputs</text><text x="84" y="283" font-size="22" font-weight="400" text-anchor="start" fill="#173d59">Precipitation · temp · wind</text><text x="84" y="321" font-size="22" font-weight="400" text-anchor="start" fill="#173d59">Elevation-adjusted temp</text><rect x="435" y="192" width="330" height="153" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="459" y="238" font-size="24" font-weight="700" text-anchor="start" fill="#173d59">Rain / snow partition</text><text x="459" y="283" font-size="22" font-weight="400" text-anchor="start" fill="#173d59">Temperature-based split</text><text x="459" y="321" font-size="22" font-weight="400" text-anchor="start" fill="#173d59">Snowfall adds to storage</text><rect x="810" y="192" width="330" height="153" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="834" y="238" font-size="24" font-weight="700" text-anchor="start" fill="#173d59">Melt adjustment</text><text x="834" y="283" font-size="22" font-weight="400" text-anchor="start" fill="#173d59">Season · slope · D8</text><text x="834" y="321" font-size="22" font-weight="400" text-anchor="start" fill="#173d59">Empirical time adjustment</text><line x1="395" y1="262" x2="427" y2="262" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 353V399" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M460 353V382H225V401" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="274" y="373" font-size="20" font-weight="400" text-anchor="start" fill="#173d59">Rain</text><path d="M975 353V435H776" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="435" y="412" width="330" height="155" rx="16" fill="#ecf6f3" stroke="#aac7d7" stroke-width="2"/><text x="459" y="458" font-size="24" font-weight="700" text-anchor="start" fill="#173d59">Snow storage / melt</text><text x="459" y="503" font-size="22" font-weight="400" text-anchor="start" fill="#173d59">Update remaining snow</text><text x="459" y="541" font-size="22" font-weight="400" text-anchor="start" fill="#173d59">Calculate meltwater</text><rect x="60" y="412" width="330" height="155" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="84" y="458" font-size="24" font-weight="700" text-anchor="start" fill="#173d59">Hydrologic input</text><text x="84" y="503" font-size="22" font-weight="400" text-anchor="start" fill="#173d59">Rain + meltwater</text><text x="84" y="541" font-size="22" font-weight="400" text-anchor="start" fill="#173d59">To infiltration and runoff</text><path d="M435 492H401" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="810" y="515" font-size="22" font-weight="600" text-anchor="start" fill="#173d59">Radiation / snow transport</text><text x="810" y="547" font-size="22" font-weight="400" text-anchor="start" fill="#173d59">are not directly solved</text><text x="600" y="623" font-size="24" font-weight="400" text-anchor="middle" fill="#173d59">Slope and direction modify melt factors; no simulation result is shown.</text>
