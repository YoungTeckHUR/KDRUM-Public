<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Snow storage and melt-factor adjustment</title><desc id="desc">Partition precipitation and adjust melt empirically before hydrologic routing. Concept schematic · not calculated values or a software screenshot.</desc>
