<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">수리구조물 유량과 계산영역 연결</title><desc id="desc">월류와 게이트·개구부 흐름을 구조물 조건에 맞게 구분하고 산정 유량을 상·하류 계산에 전달합니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">수리구조물 유량과 계산영역 연결</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">월류와 게이트·개구부 흐름을 구조물 조건에 맞게 구분하고 산정 유량을 상·하류 계산에 전달합니다.</text>
<rect x="60" y="195" width="500" height="355" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="86" y="235" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">월류 구조물</text><text x="86" y="263" font-size="17" font-weight="600" text-anchor="start" fill="#486171">상·하류 수위와 월류턱 제원</text><path d="M95 430H250V335H330V430H525" fill="#e7d9bd" stroke="#9a825f" stroke-width="3"/><line x1="105" y1="360" x2="245" y2="360" stroke="#247eaa" stroke-width="3"/><line x1="335" y1="405" x2="515" y2="405" stroke="#78bfdc" stroke-width="3"/><path d="M225 315H355" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="290" y="300" font-size="19" font-weight="700" text-anchor="middle" fill="#173d59">월류 Q</text><text x="105" y="350" font-size="15" font-weight="600" text-anchor="start" fill="#173d59">상류 수위</text><text x="365" y="395" font-size="15" font-weight="600" text-anchor="start" fill="#173d59">하류 수위</text><rect x="640" y="195" width="500" height="355" rx="14" fill="#f4faf6" stroke="#aac7d7" stroke-width="2"/><text x="666" y="235" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">게이트·개구부</text><text x="666" y="263" font-size="17" font-weight="600" text-anchor="start" fill="#486171">수위와 개구부 제원에 따른 흐름</text><path d="M675 430H820V315H875V430H1110" fill="#e7d9bd" stroke="#9a825f" stroke-width="3"/><rect x="827" y="350" width="41" height="80" fill="#fff" stroke="#647785" stroke-width="3"/><line x1="685" y1="350" x2="818" y2="350" stroke="#247eaa" stroke-width="3"/><line x1="880" y1="405" x2="1100" y2="405" stroke="#78bfdc" stroke-width="3"/><path d="M790 390H930" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="860" y="375" font-size="19" font-weight="700" text-anchor="middle" fill="#173d59">개구부 Q</text><text x="685" y="340" font-size="15" font-weight="600" text-anchor="start" fill="#173d59">상류 수위</text><text x="920" y="395" font-size="15" font-weight="600" text-anchor="start" fill="#173d59">하류 수위</text><rect x="115" y="575" width="970" height="62" rx="9" fill="#f8fbfc" stroke="#d4e1e8" stroke-width="2"/><text x="600" y="603" font-size="18" font-weight="700" text-anchor="middle" fill="#173d59">수위·구조물 제원</text><text x="600" y="630" font-size="17" font-weight="600" text-anchor="middle" fill="#486171">→ 구조물 유량 Q 산정 → 1D/2D 상·하류 계산에 전달</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
</g></svg>
