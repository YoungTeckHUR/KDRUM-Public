<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">HotStart state save and restart</title><desc id="desc">Use saved model states as the starting point for a subsequent run. Concept schematic · not calculated values or a software screenshot.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker><pattern id="missing" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3 3-3 M0 12 12 0 M9 15 15 9" stroke="#b2bdc5" stroke-width="2"/></pattern></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">HotStart state save and restart</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">Use saved model states as the starting point for a subsequent run.</text>
<rect x="60" y="215" width="300" height="350" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="86" y="255" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">1 · Run to checkpoint</text><rect x="95" y="310" width="230" height="88" rx="10" fill="#e8f3f9" stroke="#aac7d7" stroke-width="2"/><text x="210" y="344" font-size="20" font-weight="700" text-anchor="middle" fill="#173d59">Update model states</text><text x="210" y="373" font-size="17" font-weight="500" text-anchor="middle" fill="#486171">Soil · storage · runoff</text><path d="M210 400V445" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="235" y="431" font-size="18" font-weight="700" text-anchor="start" fill="#11695d">time t₁</text><rect x="95" y="455" width="230" height="68" rx="10" fill="#edf7f4" stroke="#83b9ae" stroke-width="2"/><text x="210" y="497" font-size="19" font-weight="700" text-anchor="middle" fill="#173d59">Reach checkpoint</text><line x1="375" y1="390" x2="415" y2="390" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="215" width="330" height="350" rx="14" fill="#fffaf0" stroke="#e6bf7d" stroke-width="2"/><text x="456" y="255" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">2 · Save state</text><rect x="480" y="315" width="230" height="125" rx="10" fill="#fff" stroke="#d4e1e8" stroke-width="2"/><text x="595" y="350" font-size="22" font-weight="700" text-anchor="middle" fill="#173d59">Saved-state file</text><text x="595" y="383" font-size="17" font-weight="500" text-anchor="middle" fill="#486171">States for enabled functions</text><text x="595" y="414" font-size="17" font-weight="600" text-anchor="middle" fill="#11695d">Starting point for next run</text><text x="595" y="500" font-size="17" font-weight="600" text-anchor="middle" fill="#75470f">Keep separate from forcing inputs</text><line x1="775" y1="390" x2="815" y2="390" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="830" y="215" width="310" height="350" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="856" y="255" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">3 · Restart</text><rect x="865" y="310" width="240" height="78" rx="10" fill="#e9f5ef" stroke="#83b9ae" stroke-width="2"/><text x="985" y="344" font-size="20" font-weight="700" text-anchor="middle" fill="#173d59">Read saved state</text><text x="985" y="372" font-size="17" font-weight="500" text-anchor="middle" fill="#486171">Restore t₁ states</text><path d="M985 390V430" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="865" y="440" width="240" height="78" rx="10" fill="#e8f3f9" stroke="#aac7d7" stroke-width="2"/><text x="985" y="474" font-size="18" font-weight="700" text-anchor="middle" fill="#173d59">Continue with later forcing</text><text x="985" y="502" font-size="17" font-weight="500" text-anchor="middle" fill="#486171">Times after t₁</text><text x="600" y="620" font-size="17" font-weight="600" text-anchor="middle" fill="#173d59">Saved-state coverage depends on enabled functions and build; not every hydraulic extension is restored identically.</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">Concept schematic · not calculated values or a software screenshot.</text>
</g></svg>
