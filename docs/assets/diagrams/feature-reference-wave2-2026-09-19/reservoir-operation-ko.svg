<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">댐·저수지 운영의 계산 연결</title><desc id="desc">저수지 상태와 운영규칙·방류 제약을 이용해 방류를 하류 하천과 연결합니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker><pattern id="missing" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3 3-3 M0 12 12 0 M9 15 15 9" stroke="#b2bdc5" stroke-width="2"/></pattern></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">댐·저수지 운영의 계산 연결</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">저수지 상태와 운영규칙·방류 제약을 이용해 방류를 하류 하천과 연결합니다.</text>
<rect x="60" y="205" width="300" height="365" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="86" y="245" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">저수지 상태</text><rect x="95" y="300" width="230" height="78" rx="10" fill="#dceef8" stroke="#8bbbd0" stroke-width="2"/><text x="210" y="334" font-size="20" font-weight="700" text-anchor="middle" fill="#173d59">유입량·수위</text><text x="210" y="362" font-size="17" font-weight="500" text-anchor="middle" fill="#486171">저류량·여유용량</text><path d="M210 380V430" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="95" y="440" width="230" height="76" rx="10" fill="#edf7f4" stroke="#83b9ae" stroke-width="2"/><text x="210" y="473" font-size="19" font-weight="700" text-anchor="middle" fill="#173d59">현재 운영조건</text><text x="210" y="499" font-size="17" font-weight="500" text-anchor="middle" fill="#486171">시점별 갱신</text><line x1="375" y1="390" x2="415" y2="390" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="205" width="330" height="365" rx="14" fill="#fffaf0" stroke="#e6bf7d" stroke-width="2"/><text x="456" y="245" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">운영규칙·제약</text><rect x="470" y="300" width="250" height="150" rx="10" fill="#fff" stroke="#d4e1e8" stroke-width="2"/><text x="595" y="334" font-size="19" font-weight="700" text-anchor="middle" fill="#173d59">방류 목표·운영규칙</text><text x="595" y="368" font-size="17" font-weight="500" text-anchor="middle" fill="#486171">최소 환경유량</text><text x="595" y="400" font-size="17" font-weight="500" text-anchor="middle" fill="#486171">시간당 방류 증·감 한도</text><text x="595" y="430" font-size="17" font-weight="600" text-anchor="middle" fill="#75470f">수위·방류 허용범위</text><text x="595" y="505" font-size="17" font-weight="600" text-anchor="middle" fill="#11695d">운영자 판단을 지원하는 계산조건</text><line x1="775" y1="390" x2="815" y2="390" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="830" y="205" width="310" height="365" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="856" y="245" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">방류와 하류영향</text><rect x="865" y="300" width="240" height="82" rx="10" fill="#e9f5ef" stroke="#83b9ae" stroke-width="2"/><text x="985" y="335" font-size="20" font-weight="700" text-anchor="middle" fill="#173d59">게이트·월류 Q</text><text x="985" y="364" font-size="16" font-weight="500" text-anchor="middle" fill="#486171">구조물별 유량관계</text><path d="M985 384V430" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="865" y="440" width="240" height="82" rx="10" fill="#e8f3f9" stroke="#aac7d7" stroke-width="2"/><text x="985" y="474" font-size="18" font-weight="700" text-anchor="middle" fill="#173d59">하류 하천으로 연결</text><text x="985" y="503" font-size="17" font-weight="500" text-anchor="middle" fill="#486171">수위·유량 변화 확인</text><text x="600" y="620" font-size="18" font-weight="600" text-anchor="middle" fill="#173d59">저수지 상태 → 운영규칙·방류 제약 → 구조물 방류 → 하류 수리조건을 하나의 흐름으로 연결합니다.</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
</g></svg>
