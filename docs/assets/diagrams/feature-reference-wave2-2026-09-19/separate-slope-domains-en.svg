<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Separate hillslope and channel slopes</title><desc id="desc">Distinguish the terrain slopes used for hillslope and channel calculations. Concept schematic · not calculated values or a software screenshot.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker><pattern id="missing" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3 3-3 M0 12 12 0 M9 15 15 9" stroke="#b2bdc5" stroke-width="2"/></pattern></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">Separate hillslope and channel slopes</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">Distinguish the terrain slopes used for hillslope and channel calculations.</text>
<rect x="60" y="205" width="500" height="360" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="86" y="245" font-size="29" font-weight="700" text-anchor="start" fill="#173d59">Hillslope domain</text><text x="86" y="276" font-size="18" font-weight="600" text-anchor="start" fill="#486171">Hillslope-cell slope Sₕ</text><path d="M110 455 L245 295 L465 455 Z" fill="#e7dcc6" stroke="#a98f6a" stroke-width="3"/><path d="M205 342C255 365 305 397 365 430" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="125" y="325" font-size="18" font-weight="700" text-anchor="start" fill="#75470f">Hillslope runoff path</text><rect x="115" y="480" width="390" height="52" rx="8" fill="#edf7f4" stroke="#83b9ae" stroke-width="2"/><text x="310" y="513" font-size="16" font-weight="600" text-anchor="middle" fill="#11695d">Apply Sₕ to hillslope-cell routing</text><line x1="580" y1="385" x2="620" y2="385" stroke="#247eaa" stroke-width="3" stroke-dasharray="7 6"/><rect x="640" y="205" width="500" height="360" rx="14" fill="#f8fbfc" stroke="#aac7d7" stroke-width="2"/><text x="666" y="245" font-size="29" font-weight="700" text-anchor="start" fill="#173d59">Channel domain</text><text x="666" y="276" font-size="18" font-weight="600" text-anchor="start" fill="#486171">Channel longitudinal slope S𝚌</text><path d="M700 330 C790 350 900 395 1080 445" fill="none" stroke="#78bfdc" stroke-width="28" stroke-linecap="round"/><path d="M720 330C815 353 910 392 1055 432" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="810" y="330" font-size="18" font-weight="700" text-anchor="start" fill="#11695d">Downstream</text><rect x="690" y="480" width="400" height="52" rx="8" fill="#fff6e7" stroke="#e6bf7d" stroke-width="2"/><text x="890" y="513" font-size="15" font-weight="600" text-anchor="middle" fill="#75470f">Use S𝚌 with length, width and roughness</text><text x="600" y="620" font-size="18" font-weight="600" text-anchor="middle" fill="#173d59">The two slopes are terrain conditions for separate domains, not sequential processing stages.</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">Concept schematic · not calculated values or a software screenshot.</text>
</g></svg>
