roke="#328c79" stroke-width="3" marker-end="url(#arrow)"/><rect x="455" y="459" width="270" height="58" rx="8" fill="#fff" stroke="#d4e1e8" stroke-width="2"/><text x="478" y="495" font-size="18" font-weight="700" text-anchor="start" fill="#173d59">Alternative C</text><line x1="570" y1="488" x2="685" y2="488" stroke="#b07a31" stroke-width="3" marker-end="url(#arrow)"/><text x="590" y="550" font-size="16" font-weight="600" text-anchor="middle" fill="#75470f">Compare timing, magnitude and structures</text><line x1="780" y1="390" x2="820" y2="390" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="835" y="205" width="305" height="365" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="861" y="245" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">Compare and review</text><rect x="870" y="302" width="235" height="155" rx="10" fill="#edf7f4" stroke="#83b9ae" stroke-width="2"/><text x="987" y="336" font-size="18" font-weight="700" text-anchor="middle" fill="#173d59">Reservoir level / storage</text><text x="987" y="369" font-size="17" font-weight="500" text-anchor="middle" fill="#486171">Release amount / timing</text><text x="987" y="401" font-size="17" font-weight="500" text-anchor="middle" fill="#486171">Downstream constraints</text><text x="987" y="432" font-size="17" font-weight="500" text-anchor="middle" fill="#486171">Balance / operating limits</text><rect x="870" y="475" width="235" height="55" rx="8" fill="#fff6e7" stroke="#e6bf7d" stroke-width="2"/><text x="987" y="496" font-size="14" font-weight="700" text-anchor="middle" fill="#75470f">Operator compares</text><text x="987" y="516" font-size="14" font-weight="700" text-anchor="middle" fill="#75470f">alternatives</text><text x="600" y="620" font-size="17" font-weight="600" text-anchor="middle" fill="#173d59">Forecasts support alternative comparison; the schematic does not imply automatic decisions or actual releases.</text>
