<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">적설저장과 융설계수 보정</title><desc id="desc">강수 분리와 경험적 보정을 거쳐 융설수를 수문 계산에 전달합니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker><pattern id="missing" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3 3-3 M0 12 12 0 M9 15 15 9" stroke="#b2bdc5" stroke-width="2"/></pattern></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">적설저장과 융설계수 보정</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">강수 분리와 경험적 보정을 거쳐 융설수를 수문 계산에 전달합니다.</text>
<rect x="60" y="192" width="330" height="153" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="84" y="238" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">기상 입력</text><text x="84" y="283" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">강수 · 기온 · 풍속</text><text x="84" y="321" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">표고에 따른 기온보정</text><rect x="435" y="192" width="330" height="153" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="459" y="238" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">강우 / 강설 분리</text><text x="459" y="283" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">기온 기준으로 분리</text><text x="459" y="321" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">강설은 적설에 누적</text><rect x="810" y="192" width="330" height="153" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="834" y="238" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">융설계수 보정</text><text x="834" y="283" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">계절 · 경사 · D8 방향</text><text x="834" y="321" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">시간대의 경험적 보정</text><line x1="395" y1="262" x2="427" y2="262" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 353V399" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M460 353V382H225V401" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="274" y="373" font-size="20" font-weight="400" text-anchor="start" fill="#173d59">강우</text><path d="M975 353V435H776" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="435" y="412" width="330" height="155" rx="16" fill="#ecf6f3" stroke="#aac7d7" stroke-width="2"/><text x="459" y="458" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">적설저장 · 융설</text><text x="459" y="503" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">남은 적설량 갱신</text><text x="459" y="541" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">융설수 산정</text><rect x="60" y="412" width="330" height="155" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="84" y="458" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">수문 입력</text><text x="84" y="503" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">강우 + 융설수</text><text x="84" y="541" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">침투 · 유출 계산으로</text><path d="M435 492H401" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="810" y="515" font-size="22" font-weight="600" text-anchor="start" fill="#173d59">직접 일사·적설 이동</text><text x="810" y="547" font-size="22" font-weight="400" text-anchor="start" fill="#173d59">해석과 구분</text><text x="600" y="623" font-size="24" font-weight="400" text-anchor="middle" fill="#173d59">경사·방향은 융설계수에 반영되며, 그림은 계산 결과가 아닙니다.</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
</g></svg>
