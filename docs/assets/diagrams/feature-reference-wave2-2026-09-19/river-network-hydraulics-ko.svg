05" y1="308" x2="852" y2="308" stroke="#247eaa" stroke-width="3"/><text x="665" y="298" font-size="17" font-weight="700" text-anchor="start" fill="#173d59">XS-01</text><rect x="650" y="367" width="250" height="68" rx="8" fill="#fff" stroke="#d4e1e8" stroke-width="2"/><path d="M670 420 L705 393 L755 411 L810 385 L880 420" fill="none" stroke="#967b59" stroke-width="3"/><line x1="705" y1="398" x2="852" y2="398" stroke="#247eaa" stroke-width="3"/><text x="665" y="388" font-size="17" font-weight="700" text-anchor="start" fill="#173d59">XS-02</text><rect x="650" y="457" width="250" height="68" rx="8" fill="#fff" stroke="#d4e1e8" stroke-width="2"/><path d="M670 510 L705 483 L755 501 L810 475 L880 510" fill="none" stroke="#967b59" stroke-width="3"/><line x1="705" y1="488" x2="852" y2="488" stroke="#247eaa" stroke-width="3"/><text x="665" y="478" font-size="17" font-weight="700" text-anchor="start" fill="#173d59">XS-03</text><path d="M930 310V468" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="956" y="337" font-size="20" font-weight="700" text-anchor="start" fill="#173d59">수위 η</text><text x="956" y="377" font-size="20" font-weight="700" text-anchor="start" fill="#173d59">유량 Q</text><text x="956" y="417" font-size="18" font-weight="500" text-anchor="start" fill="#486171">상·하류 상호영향</text><text x="646" y="555" font-size="18" font-weight="500" text-anchor="start" fill="#486171">단면 형상은 보존하고 종단 위치·연결성을 정합</text><text x="600" y="625" font-size="20" font-weight="600" text-anchor="middle" fill="#173d59">입력: 하천망·횡단면·경계조건  →  해석: 연속·운동량  →  결과: 수위 η · 유량 Q</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
