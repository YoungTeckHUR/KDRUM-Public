<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Continuous simulation and model states</title><desc id="desc">Carry storage states through dry periods so they affect the next event. Concept schematic · not calculated values or a software screenshot.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker><pattern id="missing" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3 3-3 M0 12 12 0 M9 15 15 9" stroke="#b2bdc5" stroke-width="2"/></pattern></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">Continuous simulation and model states</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">Carry storage states through dry periods so they affect the next event.</text>
<rect x="60" y="205" width="320" height="365" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="86" y="245" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">Rain event A</text><rect x="95" y="295" width="250" height="54" rx="8" fill="#dceef8" stroke="#8bbbd0" stroke-width="2"/><text x="220" y="329" font-size="19" font-weight="700" text-anchor="middle" fill="#173d59">Rain / melt input</text><path d="M220 350V382" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="95" y="390" width="250" height="125" rx="10" fill="#e9f5ef" stroke="#83b9ae" stroke-width="2"/><text x="220" y="422" font-size="22" font-weight="700" text-anchor="middle" fill="#173d59">A/B/C/D states</text><text x="220" y="455" font-size="17" font-weight="500" text-anchor="middle" fill="#486171">Update soil water + storage</text><text x="220" y="484" font-size="17" font-weight="500" text-anchor="middle" fill="#486171">Runoff / baseflow response</text><line x1="390" y1="390" x2="425" y2="390" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="440" y="205" width="320" height="365" rx="14" fill="#fffaf0" stroke="#e6bf7d" stroke-width="2"/><text x="466" y="245" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">Dry / no-rain period</text><path d="M600 300V265" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="625" y="286" font-size="18" font-weight="700" text-anchor="start" fill="#75470f">ET</text><rect x="475" y="330" width="250" height="155" rx="10" fill="#edf7f4" stroke="#83b9ae" stroke-width="2"/><text x="600" y="358" font-size="18" font-weight="700" text-anchor="middle" fill="#173d59">States persist</text><text x="600" y="382" font-size="18" font-weight="700" text-anchor="middle" fill="#173d59">through dry periods</text><text x="600" y="416" font-size="15" font-weight="500" text-anchor="middle" fill="#486171">Storage depletion</text><text x="600" y="438" font-size="15" font-weight="500" text-anchor="middle" fill="#486171">+ redistribution</text><text x="600" y="462" font-size="15" font-weight="600" text-anchor="middle" fill="#11695d">D-layer continuity</text><line x1="770" y1="390" x2="805" y2="390" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="820" y="205" width="320" height="365" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="846" y="245" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">Rain event B</text><rect x="855" y="295" width="250" height="54" rx="8" fill="#dceef8" stroke="#8bbbd0" stroke-width="2"/><text x="980" y="329" font-size="19" font-weight="700" text-anchor="middle" fill="#173d59">New rainfall input</text><path d="M980 350V382" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="855" y="390" width="250" height="125" rx="10" fill="#e9f5ef" stroke="#83b9ae" stroke-width="2"/><text x="980" y="416" font-size="18" font-weight="700" text-anchor="middle" fill="#173d59">Continue from</text><text x="980" y="440" font-size="18" font-weight="700" text-anchor="middle" fill="#173d59">prior states</text><text x="980" y="470" font-size="14" font-weight="500" text-anchor="middle" fill="#486171">Starting state</text><text x="980" y="491" font-size="14" font-weight="600" text-anchor="middle" fill="#11695d">affects response</text><text x="600" y="620" font-size="19" font-weight="600" text-anchor="middle" fill="#173d59">Continuous simulation carries storage states across events instead of resetting them.</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">Concept schematic · not calculated values or a software screenshot.</text>
</g></svg>
