<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Hydraulic-structure discharge and domain coupling</title><desc id="desc">Distinguish crest overflow from gate/opening flow and pass the calculated discharge to adjoining domains. Concept schematic · not calculated values or a software screenshot.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">Hydraulic-structure discharge and domain coupling</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">Distinguish crest overflow from gate/opening flow and pass the calculated discharge to adjoining domains.</text>
<rect x="60" y="195" width="500" height="355" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="86" y="235" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">Crest overflow</text><text x="86" y="263" font-size="17" font-weight="600" text-anchor="start" fill="#486171">Up/downstream levels and crest geometry</text><path d="M95 430H250V335H330V430H525" fill="#e7d9bd" stroke="#9a825f" stroke-width="3"/><line x1="105" y1="360" x2="245" y2="360" stroke="#247eaa" stroke-width="3"/><line x1="335" y1="405" x2="515" y2="405" stroke="#78bfdc" stroke-width="3"/><path d="M225 315H355" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="290" y="300" font-size="19" font-weight="700" text-anchor="middle" fill="#173d59">overflow Q</text><text x="105" y="350" font-size="15" font-weight="600" text-anchor="start" fill="#173d59">upstream level</text><text x="365" y="395" font-size="15" font-weight="600" text-anchor="start" fill="#173d59">downstream level</text><rect x="640" y="195" width="500" height="355" rx="14" fill="#f4faf6" stroke="#aac7d7" stroke-width="2"/><text x="666" y="235" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">Gate / opening</text><text x="666" y="263" font-size="17" font-weight="600" text-anchor="start" fill="#486171">Flow governed by levels and opening geometry</text><path d="M675 430H820V315H875V430H1110" fill="#e7d9bd" stroke="#9a825f" stroke-width="3"/><rect x="827" y="350" width="41" height="80" fill="#fff" stroke="#647785" stroke-width="3"/><line x1="685" y1="350" x2="818" y2="350" stroke="#247eaa" stroke-width="3"/><line x1="880" y1="405" x2="1100" y2="405" stroke="#78bfdc" stroke-width="3"/><path d="M790 390H930" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="975" y="375" font-size="19" font-weight="700" text-anchor="middle" fill="#173d59">opening Q</text><text x="685" y="340" font-size="15" font-weight="600" text-anchor="start" fill="#173d59">upstream level</text><text x="920" y="395" font-size="15" font-weight="600" text-anchor="start" fill="#173d59">downstream level</text><rect x="115" y="575" width="970" height="62" rx="9" fill="#f8fbfc" stroke="#d4e1e8" stroke-width="2"/><text x="600" y="603" font-size="18" font-weight="700" text-anchor="middle" fill="#173d59">heads + geometry</text><text x="600" y="625" font-size="17" font-weight="600" text-anchor="middle" fill="#486171">→ calculate structure discharge Q → pass to upstream/downstream 1D/2D calculations</text>
