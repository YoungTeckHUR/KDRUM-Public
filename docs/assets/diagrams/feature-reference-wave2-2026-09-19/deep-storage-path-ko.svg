<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">D층 저장·복귀·손실의 구분</title><desc id="desc">지연 복귀와 별도 선택 조건의 심부 손실을 구분합니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker><pattern id="missing" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3 3-3 M0 12 12 0 M9 15 15 9" stroke="#b2bdc5" stroke-width="2"/></pattern></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">D층 저장·복귀·손실의 구분</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">지연 복귀와 별도 선택 조건의 심부 손실을 구분합니다.</text>
<rect x="60" y="225" width="330" height="190" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="84" y="271" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">D층 저장</text><text x="84" y="316" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">유입과 저장량 갱신</text><text x="84" y="354" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">저장량 내에서 방출</text><line x1="405" y1="317" x2="427" y2="317" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="435" y="225" width="330" height="190" rx="16" fill="#ecf6f3" stroke="#aac7d7" stroke-width="2"/><text x="459" y="271" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">상부 토양층 경로</text><text x="459" y="316" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">지연 복귀 수용</text><text x="459" y="354" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">토양층 유출과 연결</text><line x1="779" y1="317" x2="804" y2="317" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="810" y="225" width="330" height="190" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="834" y="271" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">유출 전달</text><text x="834" y="316" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">다른 유출 기여와 결합</text><text x="834" y="354" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">하류 유량에 기여</text><path d="M225 430V466" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="480" width="330" height="120" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="84" y="526" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">선택적 심부 손실</text><text x="84" y="571" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">활성 옵션 확인</text><text x="435" y="522" font-size="26" font-weight="600" text-anchor="start" fill="#173d59">저장·복귀·손실을 따로 집계</text><text x="435" y="569" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">완전한 지하수유동 해석과 구분</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
</g></svg>
