<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">A/B/C/D층과 D층의 수문학적 역할</title><desc id="desc">기존 다층 구조에서 D층 저장, 지연 복귀와 선택적 손실을 구분합니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker><pattern id="missing" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3 3-3 M0 12 12 0 M9 15 15 9" stroke="#b2bdc5" stroke-width="2"/></pattern></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">A/B/C/D층과 D층의 수문학적 역할</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">기존 다층 구조에서 D층 저장, 지연 복귀와 선택적 손실을 구분합니다.</text>
<rect x="60" y="195" width="500" height="400" rx="14" fill="#f8fbfc" stroke="#aac7d7" stroke-width="2"/><text x="86" y="235" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">단위격자 다층 저장구조</text><rect x="95" y="270" width="300" height="58" rx="0" fill="#f1e2c8" stroke="#c7b18e" stroke-width="2"/><text x="118" y="307" font-size="25" font-weight="700" text-anchor="start" fill="#173d59">A층</text><rect x="95" y="328" width="300" height="58" rx="0" fill="#e8d4b1" stroke="#c7b18e" stroke-width="2"/><text x="118" y="365" font-size="25" font-weight="700" text-anchor="start" fill="#173d59">B층</text><rect x="95" y="386" width="300" height="70" rx="0" fill="#dcc39b" stroke="#c7b18e" stroke-width="2"/><text x="118" y="423" font-size="25" font-weight="700" text-anchor="start" fill="#173d59">C층</text><rect x="95" y="456" width="300" height="105" rx="0" fill="#c7e3df" stroke="#c7b18e" stroke-width="2"/><text x="118" y="493" font-size="24" font-weight="700" text-anchor="start" fill="#173d59">D층 저장</text><path d="M250 316V329" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M250 374V387" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M250 444V457" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="278" y="303" font-size="18" font-weight="600" text-anchor="start" fill="#486171">침루</text><rect x="455" y="310" width="70" height="145" rx="8" fill="#dceef8" stroke="#8bbbd0" stroke-width="2"/><text x="490" y="388" font-size="20" font-weight="700" text-anchor="middle" fill="#173d59">하천</text><line x1="395" y1="299" x2="452" y2="330" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><line x1="395" y1="357" x2="452" y2="366" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><line x1="395" y1="421" x2="452" y2="405" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M370 520H425V430H390" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="245" y="535" font-size="18" font-weight="700" text-anchor="start" fill="#11695d">지연 복귀</text><path d="M250 561V584" fill="none" stroke="#a36a2c" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="278" y="580" font-size="18" font-weight="600" text-anchor="start" fill="#75470f">선택적 심부 손실</text><rect x="615" y="205" width="525" height="120" rx="12" fill="#e9f5ef" stroke="#83b9ae" stroke-width="2"/><text x="642" y="243" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">D층은 기존 구성</text><text x="642" y="278" font-size="19" font-weight="400" text-anchor="start" fill="#173d59">다층 유출구조의 지하수 저장층</text><text x="642" y="307" font-size="18" font-weight="600" text-anchor="start" fill="#486171">신규 층이 아님</text><rect x="615" y="350" width="525" height="145" rx="12" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="642" y="390" font-size="26" font-weight="700" text-anchor="start" fill="#173d59">상부 토양층 경로</text><text x="642" y="420" font-size="18" font-weight="600" text-anchor="start" fill="#486171">지연 복귀와 유출 연결</text><text x="642" y="449" font-size="19" font-weight="400" text-anchor="start" fill="#173d59">D층 저장량을 갱신하고 상부 유출경로와 연결</text><text x="642" y="477" font-size="19" font-weight="400" text-anchor="start" fill="#173d59">저장·복귀·손실은 물수지에서 구분</text><rect x="615" y="510" width="525" height="85" rx="12" fill="#fff6e7" stroke="#e6bf7d" stroke-width="2"/><text x="642" y="548" font-size="22" font-weight="700" text-anchor="start" fill="#75470f">완전한 지하수유동모형과 구분</text><text x="642" y="577" font-size="18" font-weight="500" text-anchor="start" fill="#75470f">기능별 활성조건과 적용범위를 별도 확인</text><text x="600" y="640" font-size="22" font-weight="500" text-anchor="middle" fill="#173d59">D층 자체와 장기유출 개선 기능을 구분해서 해석</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
</g></svg>
