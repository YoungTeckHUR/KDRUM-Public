<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">하천 침투와 D층 심부저장 연계</title><desc id="desc">하천–D층 이동량을 제한조건으로 산정해 두 영역 물수지에 동일하게 반영합니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">하천 침투와 D층 심부저장 연계</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">하천–D층 이동량을 제한조건으로 산정해 두 영역 물수지에 동일하게 반영합니다.</text>
<rect x="60" y="195" width="520" height="410" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="86" y="235" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">하천–D층 이동</text><text x="86" y="264" font-size="17" font-weight="600" text-anchor="start" fill="#486171">D층은 기존 다층 구조의 지하수 저장층</text><path d="M95 405V330H170C205 330 220 355 240 385C260 416 290 428 320 428C350 428 380 416 400 385C420 355 435 330 470 330H545V405Z" fill="#e1d4bd" stroke="#a98f6a" stroke-width="3"/><path d="M220 375H420C400 380 390 394 380 408C367 424 347 428 320 428C293 428 273 424 260 408C250 394 240 380 220 375Z" fill="#78bfdc" stroke="#247eaa" stroke-width="3"/><text x="320" y="455" font-size="19" font-weight="700" text-anchor="middle" fill="#173d59">하천수</text><path d="M320 465V505" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="340" y="493" font-size="17" font-weight="700" text-anchor="start" fill="#173d59">침투 이동량</text><rect x="150" y="520" width="340" height="62" rx="9" fill="#c7e3df" stroke="#83b9ae" stroke-width="2"/><text x="320" y="557" font-size="21" font-weight="700" text-anchor="middle" fill="#173d59">기존 D층 저장</text><rect x="630" y="195" width="510" height="410" rx="14" fill="#f8fbfc" stroke="#aac7d7" stroke-width="2"/><text x="656" y="235" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">이동량 제한과 물수지</text><rect x="660" y="285" width="450" height="64" rx="9" fill="#e8f3f9" stroke="#d4e1e8" stroke-width="2"/><text x="680" y="312" font-size="19" font-weight="700" text-anchor="start" fill="#173d59">가용 하천수</text><text x="680" y="336" font-size="15" font-weight="500" text-anchor="start" fill="#486171">하천에서 실제로 이동 가능한 물</text><rect x="660" y="367" width="450" height="64" rx="9" fill="#e9f5ef" stroke="#d4e1e8" stroke-width="2"/><text x="680" y="394" font-size="19" font-weight="700" text-anchor="start" fill="#173d59">침투가능량</text><text x="680" y="418" font-size="15" font-weight="500" text-anchor="start" fill="#486171">선택한 조건의 침투 한계</text><rect x="660" y="449" width="450" height="64" rx="9" fill="#fff6e7" stroke="#d4e1e8" stroke-width="2"/><text x="680" y="476" font-size="19" font-weight="700" text-anchor="start" fill="#173d59">D층 저장여유</text><text x="680" y="500" font-size="15" font-weight="500" text-anchor="start" fill="#486171">저장 가능한 남은 용량</text><text x="885" y="548" font-size="17" font-weight="600" text-anchor="middle" fill="#486171">같은 시간구간에서</text><text x="760" y="580" font-size="21" font-weight="700" text-anchor="middle" fill="#173d59">하천  −ΔV</text><text x="1010" y="580" font-size="21" font-weight="700" text-anchor="middle" fill="#173d59">D층  +ΔV</text><text x="600" y="628" font-size="18" font-weight="600" text-anchor="middle" fill="#173d59">이동량은 가용 하천수·침투가능량·D층 저장여유의 제한을 함께 받음</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
</g></svg>
