<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">Serial, OpenMP and MPI execution</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">Compare one case across execution modes, separating result consistency from performance.</text>
<rect x="60" y="205" width="215" height="350" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="86" y="245" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">Same inputs</text><rect x="95" y="315" width="145" height="105" rx="10" fill="#fff" stroke="#d4e1e8" stroke-width="2"/><text x="167" y="350" font-size="20" font-weight="700" text-anchor="middle" fill="#173d59">K-DRUM</text><text x="167" y="382" font-size="17" font-weight="600" text-anchor="middle" fill="#486171">Same case</text><line x1="290" y1="380" x2="335" y2="380" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="350" y="205" width="230" height="350" rx="14" fill="#f8fbfc" stroke="#aac7d7" stroke-width="2"/><text x="376" y="245" font-size="25" font-weight="700" text-anchor="start" fill="#173d59">Serial</text><rect x="395" y="315" width="140" height="105" rx="10" fill="#fff" stroke="#d4e1e8" stroke-width="2"/><text x="465" y="350" font-size="18" font-weight="700" text-anchor="middle" fill="#173d59">One task</text><text x="465" y="382" font-size="17" font-weight="600" text-anchor="middle" fill="#486171">Sequential</text><rect x="610" y="205" width="240" height="350" rx="14" fill="#edf7f4" stroke="#83b9ae" stroke-width="2"/><text x="636" y="245" font-size="25" font-weight="700" text-anchor="start" fill="#173d59">OpenMP</text><text x="730" y="280" font-size="18" font-weight="600" text-anchor="middle" fill="#486171">Shared memory</text><rect x="630" y="325" width="50" height="70" rx="8" fill="#fff" stroke="#83b9ae" stroke-width="2"/><text x="655" y="367" font-size="17" font-weight="700" text-anchor="middle" fill="#173d59">T1</text><rect x="700" y="325" width="50" height="70" rx="8" fill="#fff" stroke="#83b9ae" stroke-width="2"/><text x="725" y="367" font-size="17" font-weight="700" text-anchor="middle" fill="#173d59">T2</text><rect x="770" y="325" width="50" height="70" rx="8" fill="#fff" stroke="#83b9ae" stroke-width="2"/><text x="795" y="367" font-size="17" font-weight="700" text-anchor="middle" fill="#173d59">T3</text><line x1="650" y1="425" x2="810" y2="425" stroke="#83b9ae" stroke-width="3"/><text x="730" y="455" font-size="14" font-weight="600" text-anchor="middle" fill="#11695d">Threads in one process</text><rect x="880" y="205" width="260" height="350" rx="14" fill="#fffaf0" stroke="#e6bf7d" stroke-width="2"/><text x="906" y="245" font-size="25" font-weight="700" text-anchor="start" fill="#173d59">MPI</text><text x="1010" y="280" font-size="18" font-weight="600" text-anchor="middle" fill="#486171">Distributed memory</text><rect x="902" y="325" width="56" height="70" rx="8" fill="#fff" stroke="#e6bf7d" stroke-width="2"/><text x="930" y="367" font-size="17" font-weight="700" text-anchor="middle" fill="#173d59">P1</text><rect x="982" y="325" width="56" height="70" rx="8" fill="#fff" stroke="#e6bf7d" stroke-width="2"/><text x="1010" y="367" font-size="17" font-weight="700" text-anchor="middle" fill="#173d59">P2</text><rect x="1062" y="325" width="56" height="70" rx="8" fill="#fff" stroke="#e6bf7d" stroke-width="2"/><text x="1090" y="367" font-size="17" font-weight="700" text-anchor="middle" fill="#173d59">P3</text><line x1="958" y1="360" x2="982" y2="360" stroke="#b07a31" stroke-width="3" marker-end="url(#arrow)"/><line x1="1038" y1="360" x2="1062" y2="360" stroke="#b07a31" stroke-width="3" marker-end="url(#arrow)"/><text x="1010" y="447" font-size="13" font-weight="600" text-anchor="middle" fill="#75470f">Message exchange</text><text x="1010" y="467" font-size="13" font-weight="600" text-anchor="middle" fill="#75470f">between processes</text><path d="M275 455C320 500 340 500 395 475" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M275 455C470 555 620 550 700 490" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M275 455C630 590 900 570 1010 490" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="620" font-size="17" font-weight="600" text-anchor="middle" fill="#173d59">Check result consistency under the same inputs first; assess parallel performance separately for each build and environment.</text>
