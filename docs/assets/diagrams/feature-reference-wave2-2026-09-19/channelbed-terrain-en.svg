<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">From DEM to ChannelBed hydraulic terrain</title><desc id="desc">Supplement low-flow and bed geometry only where supported by DEM, centerline and section data, then verify datum and continuity. Concept schematic · not calculated values or a software screenshot.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">From DEM to ChannelBed hydraulic terrain</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">Supplement low-flow and bed geometry only where supported by DEM, centerline and section data, then verify datum and continuity.</text>
<rect x="60" y="195" width="310" height="385" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="86" y="235" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">1 · surface terrain</text><text x="86" y="266" font-size="16" font-weight="600" text-anchor="start" fill="#486171">DEM may under-resolve low-flow geometry</text><path d="M90 365 L145 335 L205 355 L265 345 L340 365" fill="none" stroke="#8a795f" stroke-width="5"/><line x1="115" y1="335" x2="320" y2="335" stroke="#78bfdc" stroke-width="3"/><text x="215" y="320" font-size="16" font-weight="600" text-anchor="middle" fill="#247eaa">example water level</text><text x="86" y="430" font-size="19" font-weight="700" text-anchor="start" fill="#173d59">Review</text><text x="86" y="458" font-size="16" font-weight="500" text-anchor="start" fill="#486171">bed / low-flow shape and vertical datum</text><rect x="445" y="195" width="310" height="385" rx="14" fill="#f8fbfc" stroke="#aac7d7" stroke-width="2"/><text x="471" y="235" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">2 · supplemental data</text><text x="471" y="266" font-size="17" font-weight="600" text-anchor="start" fill="#486171">DEM · centerline · added sections</text><line x1="490" y1="330" x2="700" y2="330" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="595" y="312" font-size="17" font-weight="700" text-anchor="middle" fill="#173d59">river centerline</text><rect x="500" y="360" width="205" height="45" rx="6" fill="#fff" stroke="#d4e1e8" stroke-width="2"/><text x="520" y="389" font-size="17" font-weight="700" text-anchor="start" fill="#173d59">XS-01</text><text x="585" y="389" font-size="15" font-weight="500" text-anchor="start" fill="#173d59">section / bed info</text><rect x="500" y="425" width="205" height="45" rx="6" fill="#fff" stroke="#d4e1e8" stroke-width="2"/><text x="520" y="454" font-size="17" font-weight="700" text-anchor="start" fill="#173d59">XS-02</text><text x="585" y="454" font-size="15" font-weight="500" text-anchor="start" fill="#173d59">section / bed info</text><rect x="500" y="490" width="205" height="45" rx="6" fill="#fff" stroke="#d4e1e8" stroke-width="2"/><text x="520" y="519" font-size="17" font-weight="700" text-anchor="start" fill="#173d59">XS-03</text><text x="585" y="519" font-size="15" font-weight="500" text-anchor="start" fill="#173d59">section / bed info</text><text x="471" y="555" font-size="16" font-weight="500" text-anchor="start" fill="#486171">Supplement only within source-data support</text><path d="M375 385H435" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M760 385H820" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="830" y="195" width="310" height="385" rx="14" fill="#f4faf6" stroke="#aac7d7" stroke-width="2"/><text x="856" y="235" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">3 · hydraulic terrain</text><text x="856" y="266" font-size="17" font-weight="600" text-anchor="start" fill="#486171">Connected low-flow / bed geometry</text><path d="M860 365 L915 335 L955 355 L985 420 L1015 355 L1060 345 L1110 365" fill="none" stroke="#8a795f" stroke-width="5"/><line x1="885" y1="335" x2="1088" y2="335" stroke="#78bfdc" stroke-width="3"/><text x="986" y="320" font-size="16" font-weight="600" text-anchor="middle" fill="#247eaa">example water level</text><text x="856" y="455" font-size="19" font-weight="700" text-anchor="start" fill="#173d59">Final checks</text><text x="856" y="484" font-size="16" font-weight="500" text-anchor="start" fill="#486171">vertical datum · terrain continuity</text><text x="856" y="512" font-size="16" font-weight="500" text-anchor="start" fill="#486171">use as 1D/2D hydraulic input</text><text x="600" y="628" font-size="18" font-weight="600" text-anchor="middle" fill="#173d59">Keep supplemented terrain distinct from survey data; do not invent unsupported geometry</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">Concept schematic · not calculated values or a software screenshot.</text>
</g></svg>
