<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc"><title id="title">Connecting profile, section and time series</title><desc id="desc">Illustrative curves linking the same location x₀, time t₀ and level η₀. Not simulation results or a viewer screenshot.</desc><rect width="1200" height="930" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif"><text x="50" y="55" font-size="36" font-weight="700" text-anchor="start" fill="#173d59">Connect results at one location and time</text><text x="50" y="99" font-size="26" font-weight="400" text-anchor="start" fill="#173d59">Choose a location in the profile; match its level in the other views.</text><text x="50" y="163" font-size="30" font-weight="700" text-anchor="start" fill="#173d59">Longitudinal profile</text><text x="1140" y="163" font-size="25" font-weight="500" text-anchor="end" fill="#b56114">Fixed time t₀</text><line x1="95" y1="200" x2="95" y2="410" stroke="#9aafbd" stroke-width="3"/><line x1="95" y1="410" x2="1135" y2="410" stroke="#9aafbd" stroke-width="3"/><text x="60" y="215" font-size="27" font-weight="500" text-anchor="end" fill="#173d59">z</text><path d="M140 238L310 244L420 252L560 260L720 275L920 286L1100 302L1100 374L920 350L720 352L560 330L420 334L310 303L140 315Z" fill="#e4f2f8"/><path d="M140 315L310 303L420 334L560 330L720 352L920 350L1100 374" fill="none" stroke="#866d51" stroke-width="5" stroke-linejoin="round"/><path d="M140 238L310 244L420 252L560 260L720 275L920 286L1100 302" fill="none" stroke="#0077ad" stroke-width="5" stroke-linejoin="round"/><line x1="560" y1="193" x2="560" y2="410" stroke="#b56114" stroke-width="3" stroke-dasharray="8 7"/><circle cx="560" cy="260" r="7" fill="#b56114" stroke="#fff" stroke-width="3"/><text x="581" y="241" font-size="29" font-weight="600" text-anchor="start" fill="#0077ad">η₀</text><text x="560" y="447" font-size="26" font-weight="600" text-anchor="middle" fill="#b56114">Selected section x₀</text><text x="1135" y="447" font-size="24" font-weight="400" text-anchor="end" fill="#173d59">Downstream x →</text><line x1="145" y1="475" x2="190" y2="475" stroke="#0077ad" stroke-width="3"/><text x="204" y="484" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">Water surface</text><line x1="395" y1="475" x2="440" y2="475" stroke="#866d51" stroke-width="3"/><text x="454" y="484" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">Riverbed</text><line x1="50" y1="512" x2="1150" y2="512" stroke="#d7e4ec" stroke-width="3"/><text x="50" y="559" font-size="30" font-weight="700" text-anchor="start" fill="#173d59">Cross section</text><text x="50" y="595" font-size="25" font-weight="500" text-anchor="start" fill="#b56114">Location x₀ · time t₀</text><line x1="90" y1="629" x2="90" y2="800" stroke="#9aafbd" stroke-width="3"/><line x1="90" y1="800" x2="540" y2="800" stroke="#9aafbd" stroke-width="3"/><text x="66" y="642" font-size="27" font-weight="500" text-anchor="end" fill="#173d59">z</text><path d="M167 681L472 681L437 735L395 773L270 773L214 735Z" fill="#cce8f4"/><path d="M115 636L167 681L214 735L270 773L395 773L437 735L472 681L522 640" fill="none" stroke="#866d51" stroke-width="5" stroke-linejoin="round"/><line x1="167" y1="681" x2="472" y2="681" stroke="#0077ad" stroke-width="3"/><text x="481" y="673" font-size="29" font-weight="600" text-anchor="end" fill="#0077ad">η₀</text><text x="540" y="836" font-size="24" font-weight="400" text-anchor="end" fill="#173d59">Across channel y →</text><text x="660" y="559" font-size="30" font-weight="700" text-anchor="start" fill="#173d59">Time series</text><text x="660" y="595" font-size="25" font-weight="500" text-anchor="start" fill="#b56114">Fixed location x₀ · varying time</text><line x1="722" y1="627" x2="722" y2="691" stroke="#9aafbd" stroke-width="3"/><line x1="722" y1="691" x2="1140" y2="691" stroke="#9aafbd" stroke-width="3"/><text x="696" y="648" font-size="28" font-weight="500" text-anchor="end" fill="#0077ad">η</text><path d="M730 679C790 679 815 667 852 640S907 633 930 648S1020 680 1130 683" fill="none" stroke="#0077ad" stroke-width="5" stroke-linejoin="round"/><line x1="722" y1="722" x2="722" y2="792" stroke="#9aafbd" stroke-width="3"/><line x1="722" y1="792" x2="1140" y2="792" stroke="#9aafbd" stroke-width="3"/><text x="696" y="748" font-size="28" font-weight="500" text-anchor="end" fill="#12877b">Q</text><path d="M730 783C790 785 837 771 870 741S916 734 930 746S1020 782 1130 785" fill="none" stroke="#12877b" stroke-width="5" stroke-linejoin="round"/><line x1="930" y1="614" x2="930" y2="792" stroke="#b56114" stroke-width="3" stroke-dasharray="8 7"/><circle cx="930" cy="648" r="7" fill="#b56114" stroke="#fff" stroke-width="3"/><circle cx="930" cy="746" r="7" fill="#b56114" stroke="#fff" stroke-width="3"/><text x="952" y="641" font-size="26" font-weight="600" text-anchor="start" fill="#0077ad">η₀</text><text x="930" y="829" font-size="28" font-weight="600" text-anchor="middle" fill="#b56114">t₀</text><text x="1140" y="836" font-size="24" font-weight="400" text-anchor="end" fill="#173d59">Time t →</text><text x="50" y="885" font-size="26" font-weight="500" text-anchor="start" fill="#173d59">η: water level · Q: discharge   |   Match x₀ and t₀ across all three views.</text></g></svg>
