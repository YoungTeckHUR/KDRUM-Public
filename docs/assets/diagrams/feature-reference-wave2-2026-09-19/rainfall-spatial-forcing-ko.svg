<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">관측 강우에서 계산격자 강우까지</title><desc id="desc">입력 형식에 맞춰 공간·시간 기준을 확인하고 계산격자의 강우 입력으로 연결합니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
