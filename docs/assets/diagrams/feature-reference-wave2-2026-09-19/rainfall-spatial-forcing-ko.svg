<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">관측 강우에서 계산격자 강우까지</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">입력 형식에 맞춰 공간·시간 기준을 확인하고 계산격자의 강우 입력으로 연결합니다.</text>
