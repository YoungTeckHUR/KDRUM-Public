<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">강우자료 완전성 평가</title><desc id="desc">관측·예측·결측의 구성과 누락 상태를 요약합니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker><pattern id="missing" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3 3-3 M0 12 12 0 M9 15 15 9" stroke="#b2bdc5" stroke-width="2"/></pattern></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">강우자료 완전성 평가</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">관측·예측·결측의 구성과 누락 상태를 요약합니다.</text>
<rect x="350" y="194" width="500" height="106" rx="16" fill="#f1f7fb" stroke="#aac7d7" stroke-width="2"/><text x="374" y="240" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">강우자료의 시간 구간</text><path d="M600 301V326H225V352" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 301V352" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 326H975V352" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="370" width="330" height="134" rx="16" fill="#e2f1fa" stroke="#aac7d7" stroke-width="2"/><text x="84" y="416" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">관측</text><text x="84" y="461" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">관측자료가 있는 기간</text><rect x="435" y="370" width="330" height="134" rx="16" fill="#e7f3ed" stroke="#aac7d7" stroke-width="2"/><text x="459" y="416" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">예측</text><text x="459" y="461" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">예측자료가 있는 기간</text><rect x="810" y="370" width="330" height="134" rx="16" fill="url(#missing)" stroke="#aac7d7" stroke-width="2"/><text x="834" y="416" font-size="28" font-weight="700" text-anchor="start" fill="#173d59">결측</text><text x="834" y="461" font-size="24" font-weight="400" text-anchor="start" fill="#173d59">입력자료가 없는 기간</text><path d="M225 506V537H600" fill="none" stroke="#247eaa" stroke-width="3"/><path d="M600 506V565" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M975 506V537H600" fill="none" stroke="#247eaa" stroke-width="3"/><text x="600" y="609" font-size="29" font-weight="700" text-anchor="middle" fill="#173d59">유형별 시간수 집계 → 실행 리포트</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
</g></svg>
