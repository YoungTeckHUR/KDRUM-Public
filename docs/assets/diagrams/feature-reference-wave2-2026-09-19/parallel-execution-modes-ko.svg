<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">단일·OpenMP·MPI 실행 비교</title><desc id="desc">같은 입력을 서로 다른 실행방식으로 계산하고 결과 일관성과 병렬 효율을 구분해 평가합니다. 개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#247eaa"/></marker><pattern id="missing" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3 3-3 M0 12 12 0 M9 15 15 9" stroke="#b2bdc5" stroke-width="2"/></pattern></defs>
<rect width="1200" height="720" fill="#fff"/><g font-family="Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,Arial,sans-serif">
<text x="60" y="43" font-size="18" font-weight="600" text-anchor="start" fill="#607f94">VISUAL CONCEPT</text><text x="60" y="97" font-size="40" font-weight="700" text-anchor="start" fill="#173d59">단일·OpenMP·MPI 실행 비교</text><text x="60" y="142" font-size="23" font-weight="400" text-anchor="start" fill="#526d7e">같은 입력을 서로 다른 실행방식으로 계산하고 결과 일관성과 병렬 효율을 구분해 평가합니다.</text>
<rect x="60" y="205" width="215" height="350" rx="14" fill="#f5f9fb" stroke="#aac7d7" stroke-width="2"/><text x="86" y="245" font-size="27" font-weight="700" text-anchor="start" fill="#173d59">동일 입력</text><rect x="95" y="315" width="145" height="105" rx="10" fill="#fff" stroke="#d4e1e8" stroke-width="2"/><text x="167" y="350" font-size="20" font-weight="700" text-anchor="middle" fill="#173d59">K-DRUM</text><text x="167" y="382" font-size="17" font-weight="600" text-anchor="middle" fill="#486171">동일 조건</text><line x1="290" y1="380" x2="335" y2="380" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="350" y="205" width="230" height="350" rx="14" fill="#f8fbfc" stroke="#aac7d7" stroke-width="2"/><text x="376" y="245" font-size="25" font-weight="700" text-anchor="start" fill="#173d59">단일 실행</text><rect x="395" y="315" width="140" height="105" rx="10" fill="#fff" stroke="#d4e1e8" stroke-width="2"/><text x="465" y="350" font-size="18" font-weight="700" text-anchor="middle" fill="#173d59">1개 작업</text><text x="465" y="382" font-size="17" font-weight="600" text-anchor="middle" fill="#486171">순차 계산</text><rect x="610" y="205" width="240" height="350" rx="14" fill="#edf7f4" stroke="#83b9ae" stroke-width="2"/><text x="636" y="245" font-size="25" font-weight="700" text-anchor="start" fill="#173d59">OpenMP</text><text x="730" y="280" font-size="18" font-weight="600" text-anchor="middle" fill="#486171">공유메모리</text><rect x="630" y="325" width="50" height="70" rx="8" fill="#fff" stroke="#83b9ae" stroke-width="2"/><text x="655" y="367" font-size="17" font-weight="700" text-anchor="middle" fill="#173d59">T1</text><rect x="700" y="325" width="50" height="70" rx="8" fill="#fff" stroke="#83b9ae" stroke-width="2"/><text x="725" y="367" font-size="17" font-weight="700" text-anchor="middle" fill="#173d59">T2</text><rect x="770" y="325" width="50" height="70" rx="8" fill="#fff" stroke="#83b9ae" stroke-width="2"/><text x="795" y="367" font-size="17" font-weight="700" text-anchor="middle" fill="#173d59">T3</text><line x1="650" y1="425" x2="810" y2="425" stroke="#83b9ae" stroke-width="3"/><text x="730" y="455" font-size="16" font-weight="600" text-anchor="middle" fill="#11695d">한 프로세스 안의 스레드</text><rect x="880" y="205" width="260" height="350" rx="14" fill="#fffaf0" stroke="#e6bf7d" stroke-width="2"/><text x="906" y="245" font-size="25" font-weight="700" text-anchor="start" fill="#173d59">MPI</text><text x="1010" y="280" font-size="18" font-weight="600" text-anchor="middle" fill="#486171">분산메모리</text><rect x="902" y="325" width="56" height="70" rx="8" fill="#fff" stroke="#e6bf7d" stroke-width="2"/><text x="930" y="367" font-size="17" font-weight="700" text-anchor="middle" fill="#173d59">P1</text><rect x="982" y="325" width="56" height="70" rx="8" fill="#fff" stroke="#e6bf7d" stroke-width="2"/><text x="1010" y="367" font-size="17" font-weight="700" text-anchor="middle" fill="#173d59">P2</text><rect x="1062" y="325" width="56" height="70" rx="8" fill="#fff" stroke="#e6bf7d" stroke-width="2"/><text x="1090" y="367" font-size="17" font-weight="700" text-anchor="middle" fill="#173d59">P3</text><line x1="958" y1="360" x2="982" y2="360" stroke="#b07a31" stroke-width="3" marker-end="url(#arrow)"/><line x1="1038" y1="360" x2="1062" y2="360" stroke="#b07a31" stroke-width="3" marker-end="url(#arrow)"/><text x="1010" y="455" font-size="16" font-weight="600" text-anchor="middle" fill="#75470f">프로세스 간 메시지 교환</text><path d="M275 455C320 500 340 500 395 475" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M275 455C470 555 620 550 700 490" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M275 455C630 590 900 570 1010 490" fill="none" stroke="#247eaa" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="620" font-size="17" font-weight="600" text-anchor="middle" fill="#173d59">먼저 동일 입력의 결과 일관성을 확인하고, 병렬 성능은 실행환경과 버전에 맞춰 별도로 비교합니다.</text>
<line x1="60" y1="663" x2="1140" y2="663" stroke="#d7e4ec" stroke-width="3"/><text x="60" y="697" font-size="19" font-weight="400" text-anchor="start" fill="#607789">개념도 · 실제 계산값 또는 프로그램 화면이 아닙니다.</text>
</g></svg>
