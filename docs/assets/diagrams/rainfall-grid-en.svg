 font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="674" y="458" font-size="18" font-weight="400" fill="#11695d" text-anchor="start">Distributed rainfall: established</text><line x1="24" y1="484" x2="936" y2="484" stroke="#bbccd8" stroke-width="2"/><circle cx="45" cy="523" r="17" fill="#0077b6" stroke="none" stroke-width="2"/><text x="45" y="530" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="72" y="530" font-size="20" font-weight="400" fill="#15364f" text-anchor="start">Example cell A</text><circle cx="345" cy="523" r="17" fill="#0077b6" stroke="none" stroke-width="2"/><text x="345" y="530" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="372" y="530" font-size="20" font-weight="400" fill="#15364f" text-anchor="start">Example cell B</text><circle cx="665" cy="523" r="17" fill="#0077b6" stroke="none" stroke-width="2"/><text x="665" y="530" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="692" y="530" font-size="20" font-weight="400" fill="#15364f" text-anchor="start">Example cell C</text><text x="24" y="578" font-size="18" font-weight="400" fill="#4d687c" text-anchor="start">Numbers identify example locations. They do not represent rainfall magnitude or accuracy.</text></g></svg>
