<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="rainfall-grid-en-title rainfall-grid-en-desc" lang="en"><title id="rainfall-grid-en-title">Connecting observed rainfall to the model grid</title><desc id="rainfall-grid-en-desc">Station and radar observations pass through input checks and spatial allocation to produce grid rainfall forcing. Thiessen and IDW paths are implemented and under QA. Grid labels 1, 2 and 3 identify illustrative example cells, not observations or model results.</desc><defs><marker id="rainfall-grid-en-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#0077b6"/></marker><marker id="rainfall-grid-en-blue-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#0077b6"/></marker><marker id="rainfall-grid-en-teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#13878c"/></marker><marker id="rainfall-grid-en-teal-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#13878c"/></marker><marker id="rainfall-grid-en-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#b47013"/></marker><marker id="rainfall-grid-en-amber-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#b47013"/></marker></defs><g font-family="Pretendard, Noto Sans KR, Malgun Gothic, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="24" y="44" font-size="30" font-weight="700" fill="#15364f" text-anchor="start">Connecting observed rainfall to the model grid</text><text x="24" y="83" font-size="19" font-weight="400" fill="#4d687c" text-anchor="start">Input-processing schematic · colors and numbers are illustrative, not measured values.</text><text x="24" y="143" font-size="21" font-weight="700" fill="#15364f" text-anchor="start">OBSERVATIONS</text><text x="332" y="143" font-size="21" font-weight="700" fill="#15364f" text-anchor="start">CHECK + ALLOCATE</text><text x="674" y="143" font-size="21" font-weight="700" fill="#15364f" text-anchor="start">GRID FORCING</text><rect x="24" y="168" width="250" height="256" rx="9" fill="#edf6fb" stroke="none" stroke-width="1.8"/><text x="44" y="202" font-size="21" font-weight="700" fill="#15364f" text-anchor="start">Rain gauges</text><path d="M66 284 L148 260 L224 294" fill="none" stroke="#bbccd8" stroke-width="2" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="66" cy="284" r="10" fill="#0077b6" stroke="#ffffff" stroke-width="3"/><text x="66" y="263" font-size="18" font-weight="700" fill="#005f90" text-anchor="middle">A</text><circle cx="148" cy="260" r="10" fill="#0077b6" stroke="#ffffff" stroke-width="3"/><text x="148" y="239" font-size="18" font-weight="700" fill="#005f90" text-anchor="middle">B</text><circle cx="224" cy="294" r="10" fill="#0077b6" stroke="#ffffff" stroke-width="3"/><text x="224" y="273" font-size="18" font-weight="700" fill="#005f90" text-anchor="middle">C</text><line x1="44" y1="322" x2="252" y2="322" stroke="#bbccd8" stroke-width="2"/><text x="44" y="356" font-size="21" font-weight="700" fill="#15364f" text-anchor="start">Radar rainfall</text><circle cx="65" cy="393" r="19" fill="none" stroke="#13878c" stroke-width="1.7"/><circle cx="65" cy="393" r="9" fill="none" stroke="#13878c" stroke-width="1.7"/><line x1="65" y1="393" x2="82" y2="378" stroke="#13878c" stroke-width="2"/><text x="102" y="400" font-size="19" font-weight="400" fill="#4d687c" text-anchor="start">Spatial field</text><line x1="282" y1="295" x2="318" y2="295" stroke="#0077b6" stroke-width="3" marker-end="url(#rainfall-grid-en-blue-arrow)"/><rect x="332" y="168" width="283" height="256" rx="9" fill="#e8f6f3" stroke="none" stroke-width="1.8"/><text x="352" y="202" font-size="22" font-weight="700" fill="#15364f" text-anchor="start">Input quality checks</text><text x="352" y="235" font-size="18" font-weight="400" fill="#4d687c" text-anchor="start">Time alignment · missing data</text><line x1="473" y1="254" x2="473" y2="283" stroke="#13878c" stroke-width="3" marker-end="url(#rainfall-grid-en-teal-arrow)"/><text x="352" y="317" font-size="21" font-weight="700" fill="#15364f" text-anchor="start">Station → grid</text><text x="352" y="349" font-size="21" font-weight="700" fill="#15364f" text-anchor="start">Thiessen · IDW</text><text x="352" y="392" font-size="18" font-weight="700" fill="#11695d" text-anchor="start">IMPLEMENTED / QA</text><line x1="624" y1="295" x2="660" y2="295" stroke="#0077b6" stroke-width="3" marker-end="url(#rainfall-grid-en-blue-arrow)"/><rect x="674" y="172" width="50" height="50" rx="0" fill="#c1e1f1" stroke="#ffffff" stroke-width="2"/><rect x="724" y="172" width="50" height="50" rx="0" fill="#b0d7ec" stroke="#ffffff" stroke-width="2"/><rect x="774" y="172" width="50" height="50" rx="0" fill="#98cbe4" stroke="#ffffff" stroke-width="2"/><rect x="824" y="172" width="50" height="50" rx="0" fill="#98cbe4" stroke="#ffffff" stroke-width="2"/><rect x="874" y="172" width="50" height="50" rx="0" fill="#98cbe4" stroke="#ffffff" stroke-width="2"/><rect x="674" y="222" width="50" height="50" rx="0" fill="#d4ebf7" stroke="#ffffff" stroke-width="2"/><rect x="724" y="222" width="50" height="50" rx="0" fill="#c1e1f1" stroke="#ffffff" stroke-width="2"/><rect x="774" y="222" width="50" height="50" rx="0" fill="#b0d7ec" stroke="#ffffff" stroke-width="2"/><rect x="824" y="222" width="50" height="50" rx="0" fill="#98cbe4" stroke="#ffffff" stroke-width="2"/><rect x="874" y="222" width="50" height="50" rx="0" fill="#98cbe4" stroke="#ffffff" stroke-