<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="grid-water-cycle-ko-title grid-water-cycle-ko-desc" lang="ko"><title id="grid-water-cycle-ko-title">하나의 격자에서 보는 물의 이동</title><desc id="grid-water-cycle-ko-desc">강우는 지표 저류에 유입되고 침투를 통해 토양수분으로 이동한다. 증발산, 지표유출, 지중유출이 물을 격자 밖으로 이동시킨다. 깊은 저류층과 지연 기저유출 확장은 개발 중으로 표시한다.</desc><defs><marker id="grid-water-cycle-ko-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#0077b6"/></marker><marker id="grid-water-cycle-ko-blue-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#0077b6"/></marker><marker id="grid-water-cycle-ko-teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#13878c"/></marker><marker id="grid-water-cycle-ko-teal-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#13878c"/></marker><marker id="grid-water-cycle-ko-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#b47013"/></marker><marker id="grid-water-cycle-ko-amber-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#b47013"/></marker></defs><g font-family="Pretendard, Noto Sans KR, Malgun Gothic, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="24" y="44" font-size="30" font-weight="700" fill="#15364f" text-anchor="start">하나의 격자에서 보는 물의 이동</text><text x="24" y="83" font-size="19" font-weight="400" fill="#4d687c" text-anchor="start">저류와 플럭스를 설명하는 개념도 · 실제 계산 격자의 비율과 다릅니다.</text><rect x="72" y="267" width="704" height="177" rx="0" fill="#eef4ee" stroke="none" stroke-width="1.8"/><rect x="72" y="238" width="704" height="29" rx="0" fill="#d7eefb" stroke="none" stroke-width="1.8"/><path d="M72 267 H776" fill="none" stroke="#71977d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="97" y="316" font-size="23" font-weight="700" fill="#15364f" text-anchor="start">토양수분 저류</text><text x="97" y="349" font-size="19" font-weight="400" fill="#4d687c" text-anchor="start">침투 · 저장 · 지중 이동</text><text x="97" y="425" font-size="18" font-weight="400" fill="#4d687c" text-anchor="start">격자 내부</text><line x1="154" y1="159" x2="154" y2="228" stroke="#0077b6" stroke-width="2.5" marker-end="url(#grid-water-cycle-ko-blue-arrow)"/><line x1="187" y1="159" x2="187" y2="228" stroke="#0077b6" stroke-width="2.5" marker-end="url(#grid-water-cycle-ko-blue-arrow)"/><line x1="220" y1="159" x2="220" y2="228" stroke="#0077b6" stroke-width="2.5" marker-end="url(#grid-water-cycle-ko-blue-arrow)"/><line x1="253" y1="159" x2="253" y2="228" stroke="#0077b6" stroke-width="2.5" marker-end="url(#grid-water-cycle-ko-blue-arrow)"/><text x="149" y="138" font-size="23" font-weight="700" fill="#005f90" text-anchor="start">강우 P</text><line x1="458" y1="246" x2="458" y2="374" stroke="#13878c" stroke-width="4" marker-end="url(#grid-water-cycle-ko-teal-arrow)"/><text x="478" y="315" font-size="21" font-weight="700" fill="#11695d" text-anchor="start">침투</text><text x="478" y="344" font-size="18" font-weight="400" fill="#4d687c" text-anchor="start">Green–Ampt</text><line x1="665" y1="334" x2="665" y2="155" stroke="#13878c" stroke-width="4" marker-end="url(#grid-water-cycle-ko-teal-arrow)"/><text x="688" y="161" font-size="19" font-weight="400" fill="#11695d" text-anchor="start">증발산 ET</text><text x="688" y="190" font-size="19" font-weight="400" fill="#11695d" text-anchor="start">지표 · 토양</text><text x="302" y="222" font-size="20" font-weight="700" fill="#15364f" text-anchor="start">지표 저류</text><line x1="736" y1="251" x2="907" y2="251" stroke="#0077b6" stroke-width="4" marker-end="url(#grid-water-cycle-ko-blue-arrow)"/><text x="790" y="289" font-size="19" font-weight="400" fill="#005f90" text-anchor="start">지표유출</text><text x="790" y="317" font-size="19" font-weight="400" fill="#005f90" text-anchor="start">Qsurface</text><line x1="652" y1="401" x2="907" y2="401" stroke="#13878c" stroke-width="4" marker-end="url(#grid-water-cycle-ko-teal-arrow)"/><text x="790" y="361" font-size="19" font-weight="400" fill="#11695d" text-anchor="start">지중유출</text><text x="790" y="435" font-size="19" font-weight="400" fill="#11695d" text-anchor="start">Qsubsurface</text><rect x="72" y="470" width="704" height="83" rx="9" fill="#fff5e2" stroke="#d7aa65" stroke-width="1.8" stroke-dasharray="7 6"/><text x="97" y="504" font-size="19" font-weight="400" fill="#885112" text-anchor="start">깊은 저류층 (D-layer)</text><text x="97" y="533" font-size="19" font-weight="400" fill="#885112" text-anchor="start">저류·지연 기저유출 확장 · 개발 중</text><line x1="458" y1="447" x2="458" y2="465" stroke="#b47013" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#grid-water-cycle-ko-amber-arrow)"/><path d="M776 512 H886 V472" fill="none" stroke="#b47013" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#grid-water-cycle-ko-amber-arrow)" stroke-linecap="round" stroke-linejoin="round"/><text x="792" y="544" font-size="18" font-weight="400" fill="#885112" text-anchor="start">지연 유출</text><text x="72" y="583" font-size="18" font-weight="400" fill="#4d687c" text-anchor="start">저류량과 유·출입 플럭스를 함께 읽어 물수지를 확인합니다.</text></g></svg>
