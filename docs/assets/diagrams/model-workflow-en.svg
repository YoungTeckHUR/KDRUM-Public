<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="model-workflow-en-title model-workflow-en-desc" lang="en"><title id="model-workflow-en-title">From watershed inputs to hydrologic and hydraulic outputs</title><desc id="model-workflow-en-desc">Rainfall, terrain, soil and initial states feed established distributed hydrology and kinematic-wave routing. Hydrologic outputs come directly from this core; developing one- and two-dimensional hydraulics form an extension path.</desc><defs><marker id="model-workflow-en-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#0077b6"/></marker><marker id="model-workflow-en-blue-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#0077b6"/></marker><marker id="model-workflow-en-teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#13878c"/></marker><marker id="model-workflow-en-teal-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#13878c"/></marker><marker id="model-workflow-en-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#b47013"/></marker><marker id="model-workflow-en-amber-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#b47013"/></marker></defs><g font-family="Pretendard, Noto Sans KR, Malgun Gothic, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="24" y="44" font-size="30" font-weight="700" fill="#15364f" text-anchor="start">From watershed inputs to hydrologic and hydraulic outputs</text><text x="24" y="83" font-size="19" font-weight="400" fill="#4d687c" text-anchor="start">Established hydrology and developing hydraulic extensions have distinct maturity.</text><text x="24" y="144" font-size="20" font-weight="700" fill="#15364f" text-anchor="start">INPUTS</text><text x="228" y="144" font-size="20" font-weight="700" fill="#15364f" text-anchor="start">HYDROLOGIC CORE</text><text x="517" y="144" font-size="20" font-weight="700" fill="#885112" text-anchor="start">EXTENSIONS</text><text x="772" y="144" font-size="20" font-weight="700" fill="#15364f" text-anchor="start">OUTPUTS</text><rect x="24" y="177" width="167" height="82" rx="9" fill="#edf6fb" stroke="none" stroke-width="1.8"/><text x="39" y="208" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">Rainfall</text><text x="39" y="237" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">Stations · radar</text><rect x="24" y="280" width="167" height="82" rx="9" fill="#edf6fb" stroke="none" stroke-width="1.8"/><text x="39" y="311" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">Terrain · soil</text><text x="39" y="340" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">Grid · channels</text><rect x="24" y="383" width="167" height="82" rx="9" fill="#edf6fb" stroke="none" stroke-width="1.8"/><text x="39" y="414" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">Configuration</text><text x="39" y="443" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">Parameters · state</text><line x1="201" y1="218" x2="201" y2="424" stroke="#0077b6" stroke-width="2"/><line x1="191" y1="218" x2="201" y2="218" stroke="#0077b6" stroke-width="2"/><line x1="191" y1="321" x2="201" y2="321" stroke="#0077b6" stroke-width="2"/><line x1="191" y1="424" x2="201" y2="424" stroke="#0077b6" stroke-width="2"/><line x1="201" y1="321" x2="220" y2="321" stroke="#0077b6" stroke-width="3" marker-end="url(#model-workflow-en-blue-arrow)"/><rect x="228" y="177" width="252" height="288" rx="9" fill="#e8f6f3" stroke="none" stroke-width="1.8"/><rect x="244" y="192" width="132" height="29" rx="4" fill="#13878c" stroke="none" stroke-width="1.8"/><text x="254" y="213" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">ESTABLISHED</text><text x="248" y="254" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">Grid rainfall–runoff</text><text x="248" y="283" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">Infiltration · ET</text><text x="248" y="312" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">Soil-water storage</text><line x1="354" y1="327" x2="354" y2="342" stroke="#13878c" stroke-width="3" marker-end="url(#model-workflow-en-teal-arrow)"/><text x="248" y="367" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">Kinematic-wave routing</text><text x="248" y="397" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">Hillslope · channel flow</text><line x1="482" y1="357" x2="509" y2="357" stroke="#b47013" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#model-workflow-en-amber-arrow)"/><rect x="517" y="254" width="218" height="211" rx="9" fill="#fff5e2" stroke="#e2ba7b" stroke-width="1.8" stroke-dasharray="7 6"/><text x="535" y="286" font-size="18" font-weight="700" fill="#885112" text-anchor="start">IN DEVELOPMENT</text><text x="535" y="329" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">1D river hydraulics</text><text x="535" y="374" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">↕ Two-way exchange</text><text x="535" y="419" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">2D flood inundation</text><rect x="772" y="177" width="164" height="108" rx="9" fill="#edf6fb" stroke="none" stroke-width="1.8"/><text x="788" y="213" font-size="19" font-weight="400" fill="#15364f" text-anchor="start">Runoff series</text><text x="788" y="246" font-size="19" font