loodViewer</text><text x="1230" y="470">Python / analysis</text><text x="1230" y="630">Reports / archive</text></g><rect x="100" y="760" width="1390" height="75" rx="18" fill="#0b2635" stroke="#3f6f86" stroke-width="3"/><text x="145" y="807" fill="#dff8ff" font-family="Arial" font-size="23" font-weight="700">Goal: one canonical result structure, minimal duplicate files, consistent units / coordinates / time axis</text></svg>