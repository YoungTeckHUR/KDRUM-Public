const txt={ko:{title:'K-DRUM 시각자료 · 기능별 갤러리',intro:'자연계의 물과 물질 순환을 디지털로 해석하는 K-DRUM의 주요 기능을 영상과 발표자료 이미지로 정리했습니다.',videoTitle:'자연계 → 디지털 해석',videoText:'강우·융적설·침투·유출·댐 방류·범람·하구 유출·유사 이동을 하나의 유역 흐름으로 표현한 모형 소개용 AI 개념영상입니다. 실제 K-DRUM 수치모의 결과 영상은 아닙니다.',pdf:'발표자료 PDF 보기',video:'영상 파일 열기',resources:'공개 자료',rPdf:'발표자료 PDF',rPdfText:'p18 공개용 발표자료. 브라우저 열람 및 다운로드.',rVideo:'K-DRUM 소개 영상',rVideoText:'모형 소개용 AI 개념영상 · 22초. 실제 수치모의 결과가 아닙니다.',rImage:'디지털 해석 대표 이미지',rImageText:'자연계 물순환에서 격자 기반 디지털 해석으로 전환하는 개념 이미지.',note:'기능 상태는 Core 확립 기능, 연계 기능, 개발·연구 기능을 구분하여 해석해야 합니다. 본 갤러리는 p18 소개자료의 시각적 안내용이며 최신 기술 상태는 DEVELOPMENT_STATUS 및 CAPABILITIES 문서를 함께 확인하십시오.',foot:'공개용 시각자료 · 2026-09-12 p18 기준. 편집 가능한 PPT 원본은 공개 배포본에서 제외합니다.'},en:{title:'K-DRUM Visual Guide · Feature Gallery',intro:'A visual guide to K-DRUM, showing how natural water and material movement is interpreted through distributed hydrologic and hydraulic modeling.',videoTitle:'Nature → Digital Interpretation',videoText:'AI-generated concept visualization for model introduction, illustrating rainfall, snowmelt, infiltration, runoff, dam release, flooding, estuary discharge and sediment transport across one watershed. It is not a direct K-DRUM numerical simulation result.',pdf:'Open presentation PDF',video:'Open video file',resources:'Public resources',rPdf:'Presentation PDF',rPdfText:'Public p18 presentation for browser viewing and download.',rVideo:'K-DRUM overview video',rVideoText:'22-second AI-generated concept visualization; not a numerical simulation result.',rImage:'Digital interpretation reference',rImageText:'Concept image connecting natural watershed processes to grid-based digital interpretation.',note:'Capability status should be interpreted together with DEVELOPMENT_STATUS and CAPABILITIES. This gallery is a visual guide based on the p18 presentation and does not imply that every illustrated extension is a released Core capability.',foot:'Public visual reference · 2026-09-12 p18. Editable PPT source is intentionally excluded from the public website package.'}};

const imageBase = 'assets/presentation/2026-09-12-p18/';
const viewer = document.getElementById('viewer');
const viewerSlide = document.getElementById('viewerSlide');
function setLang(value) {
  const lang = value === 'en' ? 'en' : 'ko';
  try { localStorage.setItem('kdrumMediaLang', lang); } catch (_) {}
  document.documentElement.lang = lang;
  const url = new URL(location.href);
  url.searchParams.set('lang', lang);
  history.replaceState(null, '', url);
  const t = txt[lang];
  document.getElementById('homeLink').href = lang === 'ko' ? 'ko/' : './';
  document.getElementById('navTitle').textContent = lang === 'ko' ? '시각자료' : 'Visual Guide';
  document.querySelectorAll('[data-lang]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.lang === lang)));
  ['title','intro','videoTitle','videoText','note'].forEach(k => document.getElementById(k).textContent = t[k]);
  document.getElementById('pdfBtn').textContent = t.pdf;
  document.getElementById('videoBtn').textContent = t.video;
  document.getElementById('resourcesTitle').textContent = t.resources;
  ['rPdf','rPdfText','rVideo','rVideoText','rImage','rImageText'].forEach(k => document.getElementById(k).textContent = t[k]);
  document.getElementById('footer').textContent = t.foot;
  document.getElementById('viewerClose').setAttribute('aria-label', lang === 'ko' ? '닫기' : 'Close');
  const gallery = document.getElementById('gallery');
  gallery.replaceChildren();
  data.forEach(group => {
    const heading = document.createElement('h2');
    heading.className = 'section-title';
    heading.textContent = group[0] + ' · ' + (lang === 'ko' ? group[2] : group[1]);
    const grid = document.createElement('div');
    grid.className = 'grid';
    group[3].forEach(item => {
      const title = lang === 'ko' ? item[2] : item[1];
      const status = featureStatus[item[0]][lang === 'ko' ? 1 : 0];
      const src = imageBase + featureFiles[item[0]];
      const card = document.createElement('article');
      card.className = 'card';
      const button = document.createElement('button');
      button.type = 'button';
      button.dataset.index = item[0];
      button.setAttribute('aria-label', title + (lang === 'ko' ? ' 확대' : ' — enlarge'));
      const img = document.createElement('img');
      img.className = 'thumb';
      img.src = src;
      img.alt = title;
      img.loading = 'lazy';
      img.decoding = 'async';
      button.append(img);
      button.onclick = () => {
        viewerSlide.src = src;
        viewerSlide.alt = title;
        document.getElementById('viewerCaption').textContent = title + ' · ' + status;
        viewer.showModal();
      };
      const body = document.createElement('div');
      body.className = 'body';
      const label = document.createElement('span');
      label.className = 'status';
      label.textContent = status;
      const h3 = document.createElement('h3');
      h3.textContent = title;
      const description = document.createElement('p');
      description.textContent = lang === 'ko' ? item[4] : item[3];
      body.append(label, h3, description);
      card.append(button, body);
      grid.append(card);
    });
    gallery.append(heading, grid);
  });
}
viewer.addEventListener('click', event => { if (event.target === viewer) viewer.close(); });
