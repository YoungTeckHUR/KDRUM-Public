<!doctype html>

<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;--bg:#07131e;--panel:#0e1c27;--line:#2c4352;--text:#edf5fa;--muted:#a9bac6;--accent:#00b9ed}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);line-height:1.65}.wrap{width:min(1240px,calc(100% - 34px));margin:auto}a{color:inherit}.top{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:rgba(7,19,30,.96);backdrop-filter:blur(8px)}.nav{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.nav a{text-decoration:none;font-weight:750}.lang{display:flex;gap:8px}.lang button{border:1px solid var(--line);background:#102533;color:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}.hero{padding:54px 0 24px}.hero h1{font-size:clamp(2.25rem,5vw,4.5rem);line-height:1.02;letter-spacing:-.045em;margin:0 0 14px}.lead{max-width:920px;color:#c9d6de;font-size:1.08rem}.video{margin-top:28px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}video{display:block;width:100%;border-radius:12px;background:#000}.video h2{margin:16px 0 6px}.video p{margin:0;color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{display:inline-block;padding:9px 13px;border:1px solid var(--line);border-radius:9px;text-decoration:none;background:#102533;font-weight:700}.btn.primary{background:#0b83e6;border-color:#0b83e6}.section-title{margin:48px 0 14px;font-size:1.7rem}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.card button{all:unset;display:block;width:100%;cursor:zoom-in}.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#fff}.body{padding:14px 15px 16px}.body h3{margin:0 0 5px;font-size:1.02rem}.body p{margin:0;color:var(--muted);font-size:.91rem}.note{margin-top:48px;padding:18px;border:1px solid var(--line);border-radius:12px;background:#0b1a25;color:#c7d5dd}footer{margin-top:54px;padding:24px 0 42px;border-top:1px solid var(--line);color:var(--muted)}dialog{max-width:96vw;max-height:94vh;padding:10px;border:1px solid #4d7895;border-radius:12px;background:#061019}dialog::backdrop{background:rgba(0,0,0,.82)}dialog img{display:block;max-width:92vw;max-height:88vh}.close{position:absolute;right:16px;top:16px;border:1px solid #587487;border-radius:8px;background:#0c2030;color:#fff;padding:7px 11px;cursor:pointer}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.grid{grid-template-columns:1fr}.top{position:static}}
</style>
</head>
<body>
<div class="top"><div class="wrap nav"><a href="./">← K-DRUM</a><strong id="navTitle">시각자료</strong><span class="lang"><button onclick="setLang('ko')">한국어</button><button onclick="setLang('en')">English</button></span></div></div>
<div class="wrap">
<section class="hero"><h1 id="title"></h1><p class="lead" id="intro"></p>
<div class="video"><video controls playsinline preload="metadata" poster="assets/presentation/2026-09-12-p18/18_core_value_integration.jpg"><source src="media/2026-09-12-p18/KDRUM_Nature_to_Digital_22s_web.mp4" type="video/mp4"></video><h2 id="videoTitle"></h2><p id="videoText"></p><div class="actions"><a class="btn primary" href="media/2026-09-12-p18/K-DRUM_v3.x_p18.pdf" id="pdfBtn"></a><a class="btn" href="media/2026-09-12-p18/KDRUM_Nature_to_Digital_22s_web.mp4" id="videoBtn"></a></div></div></section>

<footer id="footer"></footer>
</div>
<dialog id="viewer"><button class="close" onclick="viewer.close()">×</button><img id="viewerImg" alt=""></dialog>
<script>
const data=[
['01','Model concept','모형 개념',[
['01_model_overview.jpg','Model overview','K-DRUM 모형 개요','Physically based grid-distributed watershed modeling','물리 기반 격자형 분포형 유역 해석'],
['02_water_cycle.jpg','Watershed water cycle','유역 물순환','Precipitation, storage, runoff and downstream routing','강수·저류·유출·하류 전달'],
['03_spatial_heterogeneity.jpg','Spatial heterogeneity','공간 이질성','Terrain, land cover and soil variability on computational grids','지형·토지피복·토양의 공간 이질성 반영'],
['04_end_to_end_workflow.jpg','End-to-end workflow','입력-계산-출력 체계','Integrated input, computation, output and verification','입력-계산-출력-검증의 통합 흐름']]],
['02','Hydro-meteorology','수문기상·연속모의',[
['05_rainfall_input.jpg','Rainfall input','강우 공간입력','Quality control and spatial rainfall input','강우 품질관리와 공간입력'],
['06_snow_processes.jpg','Snow processes','융·적설','Snow accumulation and melt with terrain and temperature effects','지형·기온 영향을 고려한 적설·융설'],
['07_continuous_hydrology.jpg','Continuous hydrology','연속 수문모의','Continuous water balance with evapotranspiration, vegetation and soil','증발산·식생·토양과 연계한 연속 물수지'],
['08_initial_state_adjustment.jpg','Initial-state adjustment','초기상태 자동보정','Adjustment of initial soil moisture and snow conditions','초기 토양수분·적설 상태의 자동 조정'],
['09_hot_start.jpg','Hot Start','Hot Start','State inheritance from replay to forecast simulation','재현모의 상태를 예측모의에 연계']]],
['03','Runoff & calibration','유출전달·보정',[
['10_runoff_routing.jpg','Runoff routing','유출 전달','Routing from hillslopes and small streams to major rivers','사면·소하천에서 대하천까지 연속 유출 전달'],
['11_subbasin_calibration.jpg','Sub-basin evaluation & calibration','소유역·다지점 평가 및 보정','Multi-site evaluation and water-balance-oriented optimization','다지점 평가와 물수지 기반 매개변수 최적화']]],
['04','Hydraulics & operation','수리해석·운영',[
['12_solver_hierarchy.jpg','Hydraulic solver hierarchy','수리해석 Solver hierarchy','Multiple formulations for river-flow analysis','하천흐름 해석을 위한 다중 수리해석 체계'],
['13_river_structures_operations.jpg','Structures & operations','하천·댐·구조물 운영','River networks, dams, gates and operating rules','하천망·댐·게이트·운영규칙 해석'],
['14_flood_1d_2d.jpg','1D-2D flood analysis','1D-2D 홍수범람','River-floodplain coupling and multi-resolution extension','하천-범람원 연계와 다중해상도 확장']]],
['05','Sediment & computation','물질이송·계산',[
['15_sediment_tracer_particles.jpg','Sediment & tracers','유사·Tracer·Particle','Sediment, conservative tracer and particle transport extensions','유사 및 보존성 물질·입자 이송 확장'],
['16_parallel_computing.jpg','Parallel computing','대유역·병렬계산','Scalable computation for large distributed domains','대규모 분포형 해석을 위한 병렬 계산']]],
['06','Verification & integration','검증·통합',[
['17_outputs_verification.jpg','Outputs & verification','결과·물수지·수치검증','Water balance, numerical checks and reproducible outputs','물수지·수치검증·재현 가능한 결과관리'],
['18_core_value_integration.jpg','Core value & integration','K-DRUM 핵심가치와 확장','Digital interpretation of connected watershed and river processes','유역-하천 연계 물순환의 디지털 해석과 확장']]]
];
const txt={ko:{title:'K-DRUM 시각자료 · 기능별 갤러리',intro:'자연계의 물과 물질 순환을 디지털로 해석하는 K-DRUM의 주요 기능을 영상과 발표자료 이미지로 정리했습니다.',videoTitle:'자연계 → 디지털 해석',videoText:'강우·융적설·침투·유출·댐 방류·범람·하구 유출·유사 이동을 하나의 유역 흐름으로 표현한 모형 소개용 AI 개념영상입니다. 실제 K-DRUM 수치모의 결과 영상은 아닙니다.',pdf:'발표자료 PDF 보기',video:'영상 파일 열기',note:'기능 상태는 Core 확립 기능, 연계 기능, 개발·연구 기능을 구분하여 해석해야 합니다. 본 갤러리는 p18 소개자료의 시각적 안내용이며 최신 기술 상태는 DEVELOPMENT_STATUS 및 CAPABILITIES 문서를 함께 확인하십시오.',foot:'공개용 시각자료 · 2026-09-12 p18 기준. 편집 가능한 PPT 원본은 공개 배포본에서 제외합니다.'},en:{title:'K-DRUM Visual Guide · Feature Gallery',intro:'A visual guide to K-DRUM, showing how natural water and material movement is interpreted through distributed hydrologic and hydraulic modeling.',videoTitle:'Nature → Digital Interpretation',videoText:'An AI-generated concept video illustrating rainfall, snowmelt, infiltration, runoff, dam release, flooding, estuary discharge and sediment transport across one watershed. It is not a direct K-DRUM numerical simulation result.',pdf:'Open presentation PDF',video:'Open video file',note:'Capability status should be interpreted together with DEVELOPMENT_STATUS and CAPABILITIES. This gallery is a visual guide based on the p18 presentation and does not imply that every illustrated extension is a released Core capability.',foot:'Public visual reference · 2026-09-12 p18. Editable PPT source is intentionally excluded from the public website package.'}};
function setLang(lang){localStorage.setItem('kdrumMediaLang',lang);document.documentElement.lang=lang;const t=txt[lang];document.getElementById('navTitle').textContent=lang==='ko'?'시각자료':'Visual Guide';['title','intro','videoTitle','videoText','note'].forEach(k=>document.getElementById(k).textContent=t[k]);document.getElementById('pdfBtn').textContent=t.pdf;document.getElementById('videoBtn').textContent=t.video;document.getElementById('footer').textContent=t.foot;const g=document.getElementById('gallery');g.innerHTML='';data.forEach(group=>{const h=document.createElement('h2');h.className='section-title';h.textContent=group[0]+' · '+(lang==='ko'?group[2]:group[1]);g.appendChild(h);const grid=document.createElement('div');grid.className='grid';group[3].forEach(it=>{grid.insertAdjacentHTML('beforeend',`<article class="card"><button data-src="assets/presentation/2026-09-12-p18/${it[0]}"><img loading="lazy" src="assets/presentation/2026-09-12-p18/${it[0]}" alt="${lang==='ko'?it[2]:it[1]}"></button><div class="body"><h3>${lang==='ko'?it[2]:it[1]}</h3><p>${lang==='ko'?it[4]:it[3]}</p></div></article>`)});g.appendChild(grid)});document.querySelectorAll('.card button').forEach(b=>b.onclick=()=>{viewerImg.src=b.dataset.src;viewer.showModal()})}
const viewer=document.getElementById('viewer'),viewerImg=document.getElementById('viewerImg');viewer.onclick=e=>{if(e.target===viewer)viewer.close()};const q=new URLSearchParams(location.search).get('lang');setLang(q==='en'||q==='ko'?q:(localStorage.getItem('kdrumMediaLang')||'ko'));
</script>
